name: PoE2 / overquality-flip prices

on:
  schedule:
    # 1시간 30분 간격 (UTC 기준). 24시간이 1.5시간의 정수배(16회)라 하루 단위로 정확히 반복됩니다.
    # 크론은 "N분마다 + 오프셋"을 표현할 수 없어서 3시간 간격 두 줄로 나눠 엇갈리게 실행합니다.
    # 최신 리그는 매번 수집하고, 직전 리그(6시간)·Standard(24시간)는 아래 --league 의 ':시간' 간격이 지났을 때만 수집
    - cron: "17 0,3,6,9,12,15,18,21 * * *"   # 00:17, 03:17, 06:17 ...
    - cron: "47 1,4,7,10,13,16,19,22 * * *"  # 01:47, 04:47, 07:47 ...
  workflow_dispatch:             # Actions 탭의 "Run workflow" 버튼으로 수동 실행

permissions:
  contents: write                # overquality-flip-prices.json 을 커밋·푸시하기 위해 필요

concurrency:
  group: poe2-overquality-flip-prices          # 이전 실행이 끝나기 전에는 다음 실행을 시작하지 않음
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # 수집 스크립트가 있는 폴더 (리포지토리 루트 기준). 결과는 이 폴더의 out/overquality-flip-prices.json 에 저장됩니다.
      SCRIPT_DIR: poetools/poe2/overquality-flip
      SCRIPT_NAME: poe2_overquality-flip.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Collect prices
        working-directory: ${{ env.SCRIPT_DIR }}
        # 최신 리그: 1.5시간마다(매 실행) / 직전(second latest) 리그: 6시간마다 / Standard: 24시간마다
        # ':N' 은 마지막 수집 후 최소 N시간 간격 (실행 소요 시간·크론 지연을 감안해 1.5시간 일찍 도래한 것으로 봄)
        # 수집 중지 항목 재조회: 최신 1일 / 직전 3일 / Standard 10일마다 (--stopped-retry, 일 단위, 같은 방식으로 1.5시간 일찍 도래)
        run: python -u "$SCRIPT_NAME" all --league "latest,previous:6,standard:24" --stopped-retry "latest:1,previous:3,standard:10"

      - name: Validate and commit overquality-flip-prices.json
        if: ${{ !cancelled() }}                # 수집 중 일부 실패해도, 저장된 진행분은 커밋
        run: |
          python -c "import json,sys; json.load(open('${SCRIPT_DIR}/out/overquality-flip-prices.json', encoding='utf-8'))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${SCRIPT_DIR}/out/overquality-flip-prices.json"
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "chore: update overquality-flip-prices.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

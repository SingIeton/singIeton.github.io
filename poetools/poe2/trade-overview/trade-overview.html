<!doctype html>
<html lang="ko" data-game="poe2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>스킬 아뮬렛 시세 · PoE Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&display=swap">
<link rel="stylesheet" href="../../style/theme.css">
<script src="../../style/site-bar.js"></script>
<style>
.cards{display:flex;flex-direction:column;gap:9px;align-items:stretch;margin-top:16px}
.crow{display:grid;grid-template-columns:repeat(5,calc((100% - 36px)/5 - 10px));justify-content:center;gap:9px}
.card{position:relative;display:flex;flex-direction:column;box-sizing:border-box;min-width:0;height:154px;overflow:hidden;background:var(--sf);border:1px solid var(--ln);border-radius:var(--r)}
.card h2{position:relative;flex:none;gap:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;height:46px;margin:0;padding:0 26px;text-align:center;font:600 15px/1.3 var(--serif);color:var(--ink);background:color-mix(in oklab,var(--ink) 7%,transparent);border-bottom:1px solid var(--ln)}
.card h2.tc{background:color-mix(in oklab,var(--tc) 38%,transparent)}
.card h2 .t{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card h2 a{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--mute);text-decoration:none;font-weight:400}
.card h2 a:hover{color:var(--ink)}
.prices{flex:none;margin:0;padding:2px 0;list-style:none;font-variant-numeric:tabular-nums;text-align:right}
.prices li{display:grid;grid-template-columns:30% 40% 30%;align-items:baseline;padding:1px 0;font:600 17px/1.3 "Spectral",var(--serif),Georgia,serif;font-variant-numeric:lining-nums tabular-nums;color:var(--ink)}
.prices li+li{border-top:1px solid color-mix(in oklab,var(--ink) 7%,transparent)}
.prices .u{margin-left:2px;letter-spacing:0;font-size:.9em;font-weight:500;color:var(--mute)}
.prices .p{text-align:right;white-space:nowrap}
.prices .cnt{display:block;text-align:center;padding:0 0 2px;font:500 12px/1.4 var(--serif);color:var(--mute)}
.prices .ls{text-align:right;font:500 12px/1.3 var(--serif);color:var(--mute);white-space:nowrap}
</style>
</head>
<body>
<main class="wrap" id="main">
  <div class="cards" id="out"></div>
</main>

<script src="out/trade-overview.js"></script>
<script>
(function(){
"use strict";
var D = window.TRADE_OVERVIEW_SKILL_AMULET, out = document.getElementById("out");
var KO = function(){ return false; };                    // 한글 모드여도 전부 영어로 표시
var pick = function(ko, en){ return (KO() && ko) ? ko : en; };
var h = function(tag, cls, text){ var e = document.createElement(tag); if(cls) e.className = cls; if(text!=null) e.textContent = text; return e; };
var num = function(n){ return (Math.round(n*100)/100).toLocaleString(KO()?"ko-KR":"en-US"); };
var SHORT = {divine:"d", chaos:"c", exalted:"ex"};
var cur = function(c){ return SHORT[c] || c; };

if(!D || !D.leagues){ out.appendChild(h("p","note","Failed to load data.")); return; }
var league = (D.order && D.order[0]) || Object.keys(D.leagues)[0];
var entries = ((D.leagues[league] || {}).entries || []).slice();
var byId = {};                                            // 카드 번호 n(1부터, 왼쪽→오른쪽, 위→아래) 은 id 가 "n" 인 항목을 읽는다
entries.forEach(function(x){ byId[String(x.id)] = x; });

var COLS = 5, CARD_H = 154, GAP = 9, BOTTOM = 0;               // CARD_H 는 CSS .card 의 height 와 같아야 한다
var GAP_TRIM = 10;                                  // 가격(.p)과 일자(.ls) 사이 간격을 이만큼(px) 줄인다 (가격은 오른쪽, 일자는 왼쪽으로 절반씩 민다)
/* 카드 제목 배경색: 카드 번호(1부터, 왼쪽→오른쪽, 위→아래) 순서. 같은 색을 여러 칸에 써도 된다. 번호보다 칸이 많으면 처음부터 다시 돈다.
   (16진수 색은 # 없이 적는다. royalblue 같은 CSS 색 이름도 가능. 제목 배경에는 아래 CSS 의 38% 로 연하게 섞여 들어간다) */
var COLORS = [
  "c8527f", "c8527f", "c8527f", "9a67c4", "8f5fc4",
  "2f95b0", "9a67c4", "3f7fc0", "5a6fd2", "2f95b0",
  "3f86c8", "8f5fc4", "2f9d78", "c8527f", "2f9d78",
  "c9803a", "c9803a", "c9803a", "c9803a", "c9803a",
  "8f5fc4", "d0603f", "3f86c8", "3f86c8", "3f86c8"
];
function ago(iso){                                        // 등록(마지막 갱신) 시각 -> "3시간 전" / "3h"
  var t = Date.parse(iso || ""); if(isNaN(t)) return "";
  var m = Math.max(0, Math.floor((Date.now() - t) / 60000));
  if(m < 1) return pick("방금", "just now");
  if(m < 60) return pick(m + "분 전", m + "m");
  if(m < 1440) return pick(Math.floor(m/60) + "시간 전", Math.floor(m/60) + "h");
  return pick(Math.floor(m/1440) + "일 전", Math.floor(m/1440) + "d");
}
function colorOf(n){                                                      // 16진수만 적으면 앞에 # 를 붙여 쓴다 (royalblue 같은 색 이름은 그대로)
  var c = COLORS.length ? String(COLORS[(n-1) % COLORS.length]).trim() : "";
  return /^[0-9a-f]{3,8}$/i.test(c) ? "#" + c : c;
}
function card(e, n){
  var sec = h("section", e ? "card" : "card empty");
  var h2 = h("h2",""); if(e) h2.appendChild(h("span","t", pick(e.ko, e.name)));
  var color = colorOf(n);
  if(color){ h2.className = "tc"; h2.style.setProperty("--tc", color); }
  if(e && e.link){ var a = h("a","","↗"); a.href = e.link; a.target = "_blank"; a.rel = "noopener"; a.title = KO() ? "경매장에서 열기" : "Open on trade site"; h2.appendChild(a); }
  sec.appendChild(h2);
  var ul = h("ul","prices");
  if(e){
    /* 맨 윗줄에 검색된 전체 매물 수, 이어서 가격 하위 3개 (통화가 모두 같을 때만 가격순으로 정렬, 섞여 있으면 받은 순서 유지) */
    var ls = (e.listings || []).slice();
    if(ls.length && ls.every(function(l){ return l.c === ls[0].c; })) ls.sort(function(a,b){ return a.a - b.a; });
    if(e.status !== "blank" && typeof e.total === "number") ul.appendChild(h("li","cnt", pick(num(e.total) + "건", num(e.total) + " results")));
    ls.slice(0,3).forEach(function(l,n){
      var li = h("li", n===0 ? "lo" : ""), t = ago(l.indexed);
      var p = h("span","p", num(l.a)); p.appendChild(h("span","u",cur(l.c))); li.appendChild(p);
      if(t){ var g = h("span","ls",t); g.title = "Listed " + l.indexed; li.appendChild(g); }
      ul.appendChild(li);
    });
  }
  sec.appendChild(ul);
  return sec;
}
function render(){                                        // 한 화면에 들어오는 줄 수만큼만 그린다 (카드 크기는 데이터와 무관하게 고정). 하단에 따로 남기는 여백은 BOTTOM
  out.textContent = "";
  var top = out.getBoundingClientRect().top + (window.pageYOffset || 0);
  var avail = window.innerHeight - top - BOTTOM;
  var rows = Math.max(1, Math.floor((avail + GAP) / (CARD_H + GAP)));
  for(var i = 0; i < rows; i++){
    var row = h("div","crow");
    for(var j = 0; j < COLS; j++){ var n = i*COLS + j + 1; row.appendChild(card(byId[String(n)], n)); }
    out.appendChild(row);
  }
  alignCols();
}
/* 가격(.p)·일자(.ls) 열: 카드 안에서 가장 넓은 글자의 중심이 열 기준선(30% / 70%)에 오도록 오른쪽 끝을 밀어 준다. 나머지 줄은 같은 오른쪽 끝에 맞춘다. */
function alignCols(){
  var uls = out.querySelectorAll(".prices");
  for(var i = 0; i < uls.length; i++){
    ["p","ls"].forEach(function(c){
      var els = uls[i].querySelectorAll("." + c), max = 0, k;
      for(k = 0; k < els.length; k++){ var r = document.createRange(); r.selectNodeContents(els[k]); max = Math.max(max, r.getBoundingClientRect().width); }
      for(k = 0; k < els.length; k++) els[k].style.marginRight = (-max/2 + (c === "p" ? -GAP_TRIM/2 : GAP_TRIM/2)) + "px";
    });
  }
}
render();
var lastKo = KO();                                        // 한/영 전환(html 속성 변경)을 감지해 다시 그린다
new MutationObserver(function(){ var k = KO(); if(k !== lastKo){ lastKo = k; render(); } })
  .observe(document.documentElement, {attributes:true});
var timer; window.addEventListener("resize", function(){ clearTimeout(timer); timer = setTimeout(render, 120); });
})();
</script>
</body>
</html>

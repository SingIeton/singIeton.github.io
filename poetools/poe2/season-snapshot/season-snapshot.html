<!DOCTYPE html>
<html lang="ko" data-game="poe2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Season Snapshot | PoE Tools</title>
<meta name="description" content="PoE 2 시즌별 화폐 일별 가격 비교">
<!-- 위치: poetools/poe2/season-snapshot/season-snapshot.html
     상단 바·푸터·배경·언어/테마는 site-bar.js가 처리합니다 (경로는 poetools/style/ 기준). -->
<link rel="stylesheet" href="../../style/theme.css">
<script src="../../style/site-bar.js"></script>
<style>
/* 폰트·색·패널·표·버튼 등 공통 모양은 style/theme.css. 여기에는 이 서비스 전용 스타일만 둡니다. */
main#app.wrap{max-width:min(1440px,100%);width:100%} /* 메인 영역(표·그래프 포함) 폭: 기존 1800px의 80% */
.ctrls{display:flex;flex-direction:column;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--ln)}
.row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
.fld{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.fld>.lbl{font-size:12px;margin:0}
.fld select{min-width:150px}
.row .fld:has(select){flex-direction:row;align-items:center;gap:10px}
.row .fld:has(select)>.lbl{white-space:nowrap}
.row .fld:has(#unit){margin-left:auto} /* 표시 단위: 오른쪽 끝 정렬 */
.fld .grp{gap:6px}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{color:var(--mute);font-size:13px}
.grp>label.lbl{margin:0}
.chip{position:relative;display:inline-flex;justify-content:flex-start;gap:8px;margin:0;padding:5px 12px;border:1px solid var(--ln2);border-radius:999px;cursor:pointer;user-select:none;font-size:13.5px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){border-color:var(--sw);background:color-mix(in oklab,var(--sw) 12%,transparent)}
.chip:focus-within{outline:2px solid var(--g);outline-offset:2px}
.chip small{color:var(--mute);font-size:12px}
.chk{display:inline-flex;justify-content:flex-start;gap:8px;margin:0}
.chk small{color:var(--mute)}
.chart{position:relative}
.chart svg#svg{width:100%;height:auto;display:block;touch-action:pan-y}
.grid line{stroke:var(--ln)}
.ax text{fill:var(--mute);font-size:11.5px}
.ax .yu,.ax .xu{text-anchor:start}.ax .yl{text-anchor:end}.ax .xl{text-anchor:middle}
#hl{stroke:var(--ln2);stroke-dasharray:3 3}
.tip{position:absolute;display:none;pointer-events:none;z-index:2;padding:0;font-size:13px;line-height:1.5;white-space:nowrap;width:max-content;max-width:none}
.tip .tg{display:grid;grid-template-columns:auto auto minmax(3.5em,auto) auto;column-gap:12px;row-gap:3px;align-items:center}
#tip{font-size:14px}                 /* 좌측 상단 범례: 13px → 14px */
#tip .u{font-size:13px}
.htip{background:var(--sf);border:1px solid var(--ln2);border-radius:var(--r);padding:9px 12px;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:3}
.htip .tg{grid-template-columns:auto auto minmax(3.5em,auto) auto auto}
.tip .tr{display:contents}
.tip .tr>*{white-space:nowrap}
.tip .tn,.tip .tv{text-align:left}
.tip .tv{text-align:right;font-variant-numeric:tabular-nums}
.tip .u{color:var(--mute);font-size:12px}
.tip .th{font-weight:600;margin-bottom:4px}
.tip .tr b{font-variant-numeric:tabular-nums}
.tip .m{color:var(--mute);font-size:12px}
.emptyc{margin:30px 0;text-align:center;color:var(--mute)}
.sw-i{display:inline-block;vertical-align:middle;margin-right:8px}
.phead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.phead h2{margin:0}
.nav{position:relative;margin-top:10px;user-select:none;-webkit-user-select:none}
.nav-track{position:relative;height:32px;border-radius:6px;background:color-mix(in oklab,var(--mute) 18%,transparent);cursor:pointer;touch-action:none}
.nav-win{position:absolute;top:0;bottom:0;box-sizing:border-box;border:1px solid var(--g);border-radius:6px;background:color-mix(in oklab,var(--g) 26%,transparent);cursor:grab}
.nav-win.drag{cursor:grabbing}
.nav-h{position:absolute;top:-2px;bottom:-2px;width:12px;display:flex;align-items:center;justify-content:center;cursor:ew-resize;touch-action:none}
.nav-h[data-h="l"]{left:-6px}.nav-h[data-h="r"]{right:-6px}
.nav-h::after{content:"";width:4px;height:20px;border-radius:2px;background:var(--g)}
.nav .tip{background:var(--sf);border:1px solid var(--ln2);border-radius:var(--r);padding:8px 11px}
.nav .tip .th{margin:0}
</style>
</head>
<body>
<button class="skip" id="skip" type="button"></button>
<main class="wrap" id="app" tabindex="-1"></main>
<!-- 데이터: fetch_currency_history.py 가 스크립트와 같은 폴더에 생성 (currency_data.js). 이 HTML과 같은 폴더에 두고 실행하세요 -->
<script src="currency_data.js"></script>
<script>
/* 언어·테마는 site-bar.js 가 관리합니다. 현재 언어는 PoEPrefs.lang, 바뀌면 "sitebar:lang" 이벤트가 옵니다. */
let LANG=(window.PoEPrefs&&window.PoEPrefs.lang)||document.documentElement.lang||"ko";
if(LANG!=="en")LANG="ko";
const $=id=>document.getElementById(id);
const T=(ko,en)=>LANG==="en"?en:ko;

/* ========== 한글 이름표 (표시용) ==========
   키는 데이터의 영어 이름과 정확히 같아야 합니다. 새 리그·아이템이 생기면 한 줄 추가하세요. */
const NAME_KO={
  /* 리그: 따옴표 안에 한글 이름을 적으세요. 비워 두면("") 영어 그대로 표시됩니다. 왼쪽 영어 이름은 수정하지 마세요. */
  leagues:{
    "Conquerors of Wraeclast":     "",   /* 1.0.0, 2026-12-11 */
    "Forbidden Rites":             "",   /* 0.5.5, 2026-09-04 */
    "Runes of Aldur":              "",   /* 0.5.0, 2026-05-29 */
    "Fate of the Vaal":            "",   /* 0.4.0, 2025-12-12 */
    "Rise of the Abyssal":         "",   /* 0.3.0, 2025-08-29 */
    "Dawn of the Hunt":            "",   /* 0.2.0, 2025-04-04 */
    "Early Access":                "",   /* 0.1.0, 2024-12-06 */
  },
  /* 아이템(화폐) */
  items:{
    /* 기본 */
    "Mirror of Kalandra":          "칼란드라의 거울",
    "Hinekora's Lock":             "히네코라의 머리카락",
    "Divine Orb":                  "디바인 오브",
    "Perfect Chaos Orb":           "완벽한 카오스 오브",
    "Greater Chaos Orb":           "상위 카오스 오브",
    "Chaos Orb":                   "카오스 오브",
	"Fracturing Orb":              "분열의 오브",
    "Orb of Annulment":            "소멸의 오브",

    /* Abyss */
    "Preserved Collarbone":        "보존된 빗장뼈",
    "Preserved Cranium":           "보존된 두개골",
    "Ancient Jawbone":             "고대 턱뼈",
    "Ancient Rib":                 "고대 갈비뼈",
    "Ancient Collarbone":          "고대 빗장뼈",
    "Altered Collarbone":          "뒤바뀐 빗장뼈",

    /* Omen */
    "Omen of Light":               "빛의 징조",
    "Omen of Whittling":           "절사의 징조",
    "Omen of Sinistral Annulment": "좌측 소멸의 징조",
    "Omen of Sinistral Erasure":   "좌측 말소의 징조",
    "Omen of Dextral Annulment":   "우측 소멸의 징조",
    "Omen of Dextral Erasure":     "우측 말소의 징조",

    /* Essences */
    "Essence of the Breach":       "균열 에센스",

    /* Lineage Gem */
    "Uul-Netol's Embrace":         "울네톨의 포옹",
    "Uhtred's Exodus":             "우트레드의 탈출",
    "Uhtred's Augury":             "우트레드의 징조",

    /* Temple */
    "Architect's Orb":             "건축가의 오브",
    "Vaal Cultivation Orb":        "바알 함양 오브",
    "Crystallised Corruption":     "결정화된 타락",
	"Vaal Catalysing Infuser":     "바알 촉진시키는 주입기",
  },
  /* 카테고리(드롭다운 그룹 제목): API가 주는 id가 영어 소문자로 보입니다. 필요하면 아래에 "id":"한글" 형태로 추가하세요. */
  categories:{
  },
};
const nm=(kind,name)=>(LANG!=="en"&&NAME_KO[kind][name])||name; /* 한글 이름이 있으면 한글, 없으면 영어 */

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const PAL=["var(--g)","var(--b)","var(--p)","var(--y)","var(--gem)","#f97316","#ec4899","#06b6d4"]; /* 앞 5개는 theme.css 변수, 나머지는 리그가 많을 때 쓰는 고정색 */
const DAY=864e5;
const S={sel:new Set(),cur:null,metric:"average",x:"day",scale:"lin",hideLow:true,unit:"auto",view:null}; /* view: 확대해서 볼 x 구간 {a,b}, null이면 전체 */
let DATA=null,CUR=[],LG=[],SR=[],drawnW=0,UEFF="exalted",HAVE={divine:false,chaos:false};
const UNITS={exalted:{n:"Exalted Orb",ko:"엑잘티드",en:"Exalted"},chaos:{n:"Chaos Orb",ko:"카오스",en:"Chaos"},divine:{n:"Divine Orb",ko:"디바인",en:"Divine"}};
const uname=u=>T(UNITS[u].ko,UNITS[u].en);
const LCOLOR={"Forbidden Rites":"var(--p)","Fate of the Vaal":"#d4414b","Rise of the Abyssal":"#3d9a5f"}; /* 시즌별 고정색, 없으면 순서대로 PAL */
const styleOf=i=>({color:(LG[i]&&LCOLOR[LG[i].name])||PAL[i%PAL.length]});

const ts=s=>Date.parse(s+"T00:00:00Z");
const fmtDate=ms=>new Date(ms).toISOString().slice(0,10);
const fmt=v=>v==null?"-":v>=100?Math.round(v).toLocaleString("en-US"):v>=10?v.toFixed(1):v>=1?v.toFixed(2):String(+v.toPrecision(2));
const axf=v=>v>=100?Math.round(v).toLocaleString("en-US"):String(+v.toPrecision(2));
const cmp=v=>v==null?"-":v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?Math.round(v/1e3)+"k":String(Math.round(v));
const swatch=(c,w=24)=>`<svg class="sw-i" width="${w}" height="8" aria-hidden="true"><line x1="0" y1="4" x2="${w}" y2="4" stroke="${c}" stroke-width="3"/></svg>`;

/* ---------- 데이터 ---------- */
/* DATA.leagues[리그].currencies[화폐].days[] 구조 (fetch_currency_history.py 출력). 가격은 모두 Exalted 기준 */
const dayMap=c=>new Map(((c&&c.days)||[]).map(d=>[d.date,d]));
function prep(){
  const seen=new Map();
  HAVE={divine:false,chaos:false};
  for(const lv of Object.values((DATA&&DATA.leagues)||{})){
    const cs=lv.currencies||{};
    for(const [cn,cv] of Object.entries(cs))
      if(!seen.has(cn))seen.set(cn,String((cv&&cv.category)||""));
    for(const u of ["divine","chaos"])if(((cs[UNITS[u].n]||{}).days||[]).length)HAVE[u]=true;
  }
  CUR=[...seen].map(([name,category])=>({name,category}));
  if(!seen.has(S.cur))S.cur=seen.has("Divine Orb")?"Divine Orb":(CUR[0]?CUR[0].name:null);
  prepLeagues();
}
function prepLeagues(){
  LG=Object.entries((DATA&&DATA.leagues)||{}).map(([name,v])=>{
    const cs=v.currencies||{},c=cs[S.cur];
    const days=c?(c.days||[]).slice().sort((a,b)=>a.date<b.date?-1:1):[];
    if(!days.length)return null;
    const start=v.start_date||days[0].date,t0=ts(start); /* 1일차 = 시즌 시작일 */
    const vols=days.map(d=>d.volume).filter(x=>x>0).sort((a,b)=>a-b);
    const med=vols.length?vols[vols.length>>1]:0;
    days.forEach(d=>{d.t=ts(d.date);d.n=Math.round((d.t-t0)/DAY)+1;d.lowv=med>0&&(d.volume||0)<med*0.01});
    return {name,days,start,patch:v.patch||"",first:days[0].date,last:days[days.length-1].date,
      rates:{divine:dayMap(cs[UNITS.divine.n]),chaos:dayMap(cs[UNITS.chaos.n])}};
  }).filter(Boolean).sort((a,b)=>a.start<b.start?1:-1); /* 최신 시즌이 앞 */
  const keep=[...S.sel].filter(n=>LG.some(l=>l.name===n));
  S.sel=new Set(keep.length?keep:LG.filter(l=>l.name!=="Dawn of the Hunt").map(l=>l.name));
}
/* 같은 날 Divine/Chaos 가격(Exalted)으로 나눠 환산. 시가·종가·평균은 같은 항목, 고가·저가는 평균을 사용 */
function rateOf(lg,u,d){
  if(u==="exalted")return 1;
  const r=lg.rates[u]&&lg.rates[u].get(d.date);
  if(!r)return null;
  const k=(S.metric==="open"||S.metric==="close"||S.metric==="average")?S.metric:"average";
  return [r[k],r.average,r.close].find(x=>x>0)||null;
}
/* 실제로 쓸 단위. 자동 = 모든 리그의 중앙값이 1 Divine 이상이면 Divine, 아니면 Exalted */
function unitFor(){
  const self=Object.keys(UNITS).find(k=>UNITS[k].n===S.cur);
  let u=S.unit;
  if(u==="auto"){
    u="exalted";
    if(HAVE.divine&&self!=="divine"){
      const vals=[];
      for(const lg of LG)for(const d of lg.days){
        const y=d[S.metric],r=rateOf(lg,"divine",d);
        if(y>0&&r&&!(S.hideLow&&d.lowv))vals.push(y/r);
      }
      vals.sort((a,b)=>a-b);
      if(vals.length&&vals[vals.length>>1]>=1)u="divine";
    }
  }
  if(u!=="exalted"&&(u===self||!HAVE[u]))u="exalted"; /* 자기 자신 단위이거나 환산 데이터가 없으면 Exalted */
  return u;
}
function getSeries(){
  UEFF=unitFor();
  return LG.map((lg,i)=>({lg,i})).filter(o=>S.sel.has(o.lg.name)).map(o=>{
    const pts=[];
    for(const d of o.lg.days){
      const v=d[S.metric];
      if(!(v>0)||(S.hideLow&&d.lowv))continue;
      const r=rateOf(o.lg,UEFF,d);
      if(!r)continue;
      pts.push({x:S.x==="day"?d.n:d.t,y:v/r,d});
    }
    return {...o,pts,...styleOf(o.i),map:new Map(pts.map(p=>[p.x,p]))};
  }).filter(s=>s.pts.length);
}
function noteText(){
  const cn=esc(nm("items",S.cur)),u=uname(UEFF);
  let s="";
  if(S.unit!=="auto"&&S.unit!==UEFF)s+=" "+T("선택한 단위로 환산할 수 없어 Exalted로 표시합니다.","Can't convert to the selected unit, so Exalted is shown.");
  else if(UEFF!=="exalted")s+=" "+T(`같은 날의 ${u} 오브 가격으로 환산했습니다.`,`Converted with the same day's ${u} Orb price.`);
  return (s?s+" ":"")+T("마우스 휠로 확대·축소하고, 아래 바의 양 끝을 끌어 표시할 날짜 폭을, 바 자체를 끌어 구간을 옮길 수 있습니다.","Scroll to zoom. Drag the ends of the bar below to set how many days are shown, or drag the bar to move the range.");
}

/* ---------- 화면 ---------- */
function build(){
  const cn=S.cur?esc(nm("items",S.cur)):"";
  document.documentElement.lang=LANG;
  document.title=T("시즌 스냅샷","Season Snapshot")+" | PoE Tools";
  $("skip").textContent=T("본문으로 건너뛰기","Skip to content");
  const head=`<div class="ghead sm"><span class="mini" aria-hidden="true">2</span><div><a class="game" href="../poe2.html">PoE 2</a><h1>${T("시즌 스냅샷","Season Snapshot")}</h1></div></div>`;
  if(!CUR.length){
    $("app").innerHTML=head+`<section class="panel"><h2>${T("가격 데이터가 없습니다","No price data found")}</h2><p>${T("<code>fetch_currency_history.py</code>를 실행해 만든 <code>currency_data.js</code> 파일을 이 페이지와 같은 폴더에 두세요.","Run <code>fetch_currency_history.py</code> and put the generated <code>currency_data.js</code> in the same folder as this page.")}</p></section>`;
    return;
  }
  const chips=LG.map((l,i)=>{const st=styleOf(i);return `<label class="chip" style="--sw:${st.color}"><input type="checkbox" data-lg="${esc(l.name)}">${swatch(st.color)}${esc(nm("leagues",l.name))}<small>${l.patch?esc(l.patch):""}</small></label>`}).join("");
  const unitOpts=`<option value="auto">${uname("exalted")} ${T("(자동)","(Auto)")}</option>`+["exalted","chaos","divine"].map(u=>`<option value="${u}"${u!=="exalted"&&!HAVE[u]?" disabled":""}>${uname(u)}</option>`).join("");
  const cats=[...new Set(CUR.map(c=>c.category))];
  const curOpts=cats.map(cat=>`<optgroup label="${esc(nm("categories",cat))}">${CUR.filter(c=>c.category===cat).map(c=>`<option value="${esc(c.name)}">${esc(nm("items",c.name))}</option>`).join("")}</optgroup>`).join("");
  const gen=DATA.generated_at?DATA.generated_at.replace("T"," ").slice(0,16)+" UTC":"";
  $("app").innerHTML=head+`
<section class="panel"><div class="phead"><h2>${T("일별 가격 추이","Daily price trend")}</h2></div>
 <div class="ctrls">
  <div class="row"><div class="fld"><div class="grp" role="group" aria-label="${T("리그 선택","Leagues")}">${chips}</div></div></div>
  <div class="row">
   <div class="fld"><label class="lbl" for="cur">${T("화폐","Currency")}</label><select id="cur">${curOpts}</select></div>
   <div class="fld"><label class="lbl" for="unit">${T("표시 단위","Unit")}</label><select id="unit">${unitOpts}</select></div>
  </div>
 </div>
 <div class="chart" id="chart"></div>
 <p class="note" id="pnote"></p>
</section>
${gen?`<p class="note">${T("데이터","Data")}: ${gen}</p>`:""}`;
  update();
}

function update(){
  if(!$("chart"))return;
  document.querySelectorAll("[data-lg]").forEach(i=>i.checked=S.sel.has(i.dataset.lg));
  $("cur").value=S.cur;
  SR=getSeries();
  $("unit").value=S.unit;$("unit").options[0].textContent=uname(UEFF)+" "+T("(자동)","(Auto)");
  $("pnote").innerHTML=noteText();
  drawChart();
}

function niceStep(range,n){const raw=range/n,p=10**Math.floor(Math.log10(raw)),f=raw/p;return(f<1.5?1:f<3?2:f<7?5:10)*p}

/* ---------- 차트 ---------- */
/* LAY: 현재 차트의 크기와 전체 x 범위. 본 차트(#plot)와 하단 범위 바(#nav)는 따로 그립니다.
   바를 끄는 동안 바 요소가 교체되면 드래그가 끊기므로, 드래그 중에는 본 차트만 다시 그립니다. */
let LAY=null;
const curView=()=>S.view?[S.view.a,S.view.b]:[LAY.X0,LAY.X1];
function setView(a,b){
  const {X0,X1}=LAY;
  a=Math.max(X0,a);b=Math.min(X1,b);
  S.view=(a<=X0&&b>=X1)?null:{a,b};
  drawPlot();syncNav();
}
function syncNav(){
  const w=$("nwin");if(!w||!LAY)return;
  const [a,b]=curView(),{X0,X1}=LAY,span=X1-X0;
  w.style.left=((a-X0)/span*100)+"%";w.style.width=((b-a)/span*100)+"%";
}
/* 구간 [a,b] 안의 점 + 양옆으로 한 점씩(구간 경계를 가로지르는 선분을 그리기 위해) */
const around=(pts,a,b)=>{let i=0,j=pts.length-1;while(i<pts.length&&pts[i].x<a)i++;while(j>=0&&pts[j].x>b)j--;return pts.slice(Math.max(0,i-1),Math.min(pts.length,j+2))};

function drawChart(){
  const box=$("chart");if(!box)return;
  if(!SR.length){LAY=null;box.innerHTML=`<p class="emptyc">${T("표시할 데이터가 없습니다. 위에서 리그를 선택하세요.","Nothing to show. Select a league above.")}</p>`;return}
  drawnW=box.clientWidth;
  const W=Math.max(320,drawnW),H=Math.round(Math.min(600,Math.max(300,W*.4)));
  const M={l:60,r:48,t:28,b:36},unit=S.x==="day"?1:DAY;
  let X0=Infinity,X1=-Infinity;
  for(const s of SR)for(const p of s.pts){X0=Math.min(X0,p.x);X1=Math.max(X1,p.x)}
  if(X0===X1){X0-=unit;X1+=unit}
  const minW=Math.min(2*unit,X1-X0); /* 최소 3일 */
  LAY={W,H,M,iw:W-M.l-M.r,ih:H-M.t-M.b,X0,X1,unit,minW};
  if(S.view){ /* 리그·단위가 바뀌어 전체 범위가 달라졌으면 보이는 구간을 새 범위 안으로 맞춤 */
    const a=Math.max(S.view.a,X0),b=Math.min(S.view.b,X1);
    S.view=(b-a<minW-1e-9||(a<=X0&&b>=X1))?null:{a,b};
  }
  const k=drawnW?drawnW/W:1; /* 바를 본 차트의 x축 영역과 맞추기 위한 여백 */
  box.innerHTML=`<div id="plot"></div><div class="nav" id="nav" style="margin-left:${(M.l*k).toFixed(1)}px;margin-right:${(M.r*k).toFixed(1)}px"><div class="nav-track" id="ntrack"><div class="nav-win" id="nwin"><span class="nav-h" data-h="l"></span><span class="nav-h" data-h="r"></span></div></div><div class="tip" id="ntip"></div></div>`;
  const pn=$("pnote");if(pn){pn.style.marginLeft=(M.l*k).toFixed(1)+"px";pn.style.marginRight=(M.r*k).toFixed(1)+"px"} /* 안내 문구 시작 위치를 하단 바와 맞춤 */
  drawPlot();syncNav();bindNav();
}

function drawPlot(){
  const host=$("plot");if(!host||!LAY)return;
  const {W,H,M,iw,ih}=LAY,log=S.scale==="log",[x0,x1]=curView();
  let y0=Infinity,y1=-Infinity; /* 세로축은 보이는 구간의 값에 맞춤 */
  for(const s of SR)for(const p of s.pts)if(p.x>=x0&&p.x<=x1){y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}
  if(y0===Infinity)for(const s of SR)for(const p of around(s.pts,x0,x1)){y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}
  let Y0,Y1;const yt=[];
  if(log){
    Y0=y0/1.15;Y1=y1*1.15;
    const r=Y1/Y0,mult=r>300?[1]:r>12?[1,2,5]:[1,1.5,2,3,4,5,6,7,8,9];
    for(let e=Math.floor(Math.log10(Y0));e<=Math.ceil(Math.log10(Y1));e++)for(const m of mult){const v=m*10**e;if(v>=Y0&&v<=Y1)yt.push(v)}
  }else{
    const st=niceStep(y1*1.06,5);Y0=0;Y1=Math.ceil(y1*1.06/st)*st;
    for(let v=0;v<=Y1+1e-9;v+=st)yt.push(v);
  }
  const px=x=>M.l+(x-x0)/(x1-x0)*iw;
  const py=log?y=>M.t+(1-(Math.log(y)-Math.log(Y0))/(Math.log(Y1)-Math.log(Y0)))*ih:y=>M.t+(1-(y-Y0)/(Y1-Y0))*ih;
  const xt=[];
  if(S.x==="day"){const st=Math.max(1,niceStep(x1-x0,Math.max(3,Math.floor(iw/80))));for(let v=Math.ceil(x0/st)*st;v<=x1;v+=st)xt.push(v)}
  else if(S.view){const st=Math.max(1,Math.round(niceStep((x1-x0)/DAY,Math.max(2,Math.floor(iw/120)))))*DAY;for(let v=Math.ceil(x0/st)*st;v<=x1;v+=st)xt.push(v)}
  else{const n=Math.max(2,Math.floor(iw/120));for(let k=0;k<=n;k++)xt.push(Math.round((x0+(x1-x0)*k/n)/DAY)*DAY)}
  let g=`<svg id="svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T("시즌별 화폐 가격 추이 차트","Chart of currency price by season"))}"><defs><clipPath id="clipP"><rect x="${M.l}" y="${M.t}" width="${iw}" height="${ih}"/></clipPath></defs><g class="grid">`;
  for(const v of yt)g+=`<line x1="${M.l}" x2="${W-M.r}" y1="${py(v).toFixed(1)}" y2="${py(v).toFixed(1)}"/>`;
  g+=`</g><g class="ax">`;
  for(const v of yt)g+=`<text class="yl" x="${M.l-8}" y="${(py(v)+4).toFixed(1)}">${axf(v)}</text>`;
  g+=`<text class="yu" x="4" y="${M.t-12}">(${UNITS[UEFF].n})</text>`; /* 세로축 끝: 가격 단위 */
  if(S.x==="day")g+=`<text class="xu" x="${W-M.r+14}" y="${H-M.b+20}">(${T("일","Day")})</text>`; /* 가로축 끝: 경과일 단위 */
  for(const v of xt)g+=`<text class="xl" x="${px(v).toFixed(1)}" y="${H-M.b+20}">${S.x==="day"?v:fmtDate(v)}</text>`;
  g+=`</g><g${S.view?' clip-path="url(#clipP)"':""}>`; /* 확대했을 때만 영역 밖을 잘라냄 */
  for(const s of SR){
    const pts=around(s.pts,x0,x1);
    g+=`<path d="${pts.map((p,k)=>(k?"L":"M")+px(p.x).toFixed(1)+","+py(p.y).toFixed(1)).join("")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    for(const p of pts)if(p.d.partial)g+=`<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="4" fill="var(--sf)" stroke="${s.color}" stroke-width="2"/>`;
  }
  g+=`</g><line id="hl" x1="0" x2="0" y1="${M.t}" y2="${H-M.b}" visibility="hidden"/><g id="hd"></g><rect id="cap" x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip" id="tip"></div><div class="tip htip" id="htip"></div>`;
  host.innerHTML=g;

  const svg=$("svg"),tip=$("tip"),htip=$("htip"),hl=$("hl"),hd=$("hd");
  const XS=[...new Set(SR.flatMap(s=>s.pts.map(p=>p.x)))].filter(v=>v>=x0&&v<=x1).sort((a,b)=>a-b);
  const nearest=v=>{let lo=0,hi=XS.length-1;while(hi-lo>1){const m=(lo+hi)>>1;XS[m]<v?lo=m:hi=m}return Math.abs(XS[lo]-v)<=Math.abs(XS[hi]-v)?XS[lo]:XS[hi]};
  /* 좌측 상단 범례: 항상 표시. 마우스를 올리면 그 날 값, 아니면 보이는 구간의 마지막 값 */
  const showLegend=xv=>{
    const r=svg.getBoundingClientRect();
    tip.innerHTML=`<div class="tg">`+SR.map(s=>{
      const p=xv==null?[...s.pts].reverse().find(q=>q.x>=x0&&q.x<=x1):s.map.get(xv);
      return `<div class="tr">${swatch(s.color,18)}<span class="tn">${esc(nm("leagues",s.lg.name))}</span><b class="tv">${p?fmt(p.y):"–"}</b><span class="u">${p?UNITS[UEFF].n:""}</span></div>`}).join("")+`</div>`;
    tip.style.display=SR.length?"block":"none";
    tip.style.left=(M.l*(r.width/W)+8).toFixed(0)+"px";tip.style.top=(M.t*(r.height/H)+6).toFixed(0)+"px";
  };
  /* 마우스 오버 툴팁: 강조선 옆(커서 높이)에 날짜/경과일과 시즌별 값을 표시 */
  const showHover=(xv,rows,X,ey)=>{
    const day=S.x==="day";
    htip.innerHTML=`<div class="th">${day?T(`${xv}일차`,`Day ${xv}`):fmtDate(xv)}</div><div class="tg">`+rows.map(({s,p})=>{
      const meta=[];
      if(day)meta.push(p.d.date);
      if(p.d.volume!=null)meta.push(T("거래량","Vol")+" "+cmp(p.d.volume));
      return `<div class="tr">${swatch(s.color,18)}<span class="tn">${esc(nm("leagues",s.lg.name))}</span><b class="tv">${fmt(p.y)}</b><span class="u">${UNITS[UEFF].n}</span><span class="m">${meta.join(" · ")}</span></div>`}).join("")+`</div>`;
    htip.style.display="block";
    const r=svg.getBoundingClientRect(),cb=$("chart").getBoundingClientRect();
    const tw=htip.offsetWidth,th=htip.offsetHeight,ox=r.left-cb.left,oy=r.top-cb.top;
    const lx=ox+X*(r.width/W);
    let left=lx+14;if(left+tw>cb.width)left=lx-14-tw; /* 오른쪽이 모자라면 왼쪽에 표시 */
    let top=ey-cb.top+14;if(top+th>oy+r.height)top=ey-cb.top-14-th;
    htip.style.left=Math.max(0,left).toFixed(0)+"px";htip.style.top=Math.max(0,top).toFixed(0)+"px";
  };
  const hide=()=>{hl.setAttribute("visibility","hidden");hd.innerHTML="";htip.style.display="none";showLegend(null)};
  svg.addEventListener("pointerleave",hide);
  svg.addEventListener("pointermove",e=>{
    const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*(W/r.width);
    if(!XS.length||sx<M.l-4||sx>W-M.r+4){hide();return}
    const xv=nearest(x0+(sx-M.l)/iw*(x1-x0));
    const rows=SR.map(s=>({s,p:s.map.get(xv)})).filter(o=>o.p);
    if(!rows.length){hide();return}
    const X=px(xv);
    hl.setAttribute("x1",X);hl.setAttribute("x2",X);hl.setAttribute("visibility","visible");
    hd.innerHTML=rows.map(({s,p})=>`<circle cx="${X}" cy="${py(p.y)}" r="4.5" fill="${s.color}"/>`).join("");
    showLegend(xv);
    showHover(xv,rows,X,e.clientY);
  });
  showLegend(null);
}

/* ---------- 하단 범위 바 ---------- */
/* 양 끝(핸들)을 끌면 표시할 날짜 폭 조절, 바 자체를 끌면 전체 범위 안에서 구간 이동,
   바 밖의 트랙을 누르면 그 위치로 구간을 옮긴 뒤 계속 끌 수 있습니다. 누르고 있는 동안 일수를 툴팁으로 보여줍니다. */
function bindNav(){
  const tr=$("ntrack"),win=$("nwin"),nav=$("nav"),ntip=$("ntip");
  if(!tr||!LAY)return;
  let drag=null;
  const showTip=cx=>{
    const [a,b]=curView(),n=Math.round((b-a)/LAY.unit)+1;
    ntip.innerHTML=`<div class="th">${T(`${n}일`,`${n} ${n===1?"day":"days"}`)}</div>`;
    ntip.style.display="block";
    const r=nav.getBoundingClientRect(),tw=ntip.offsetWidth;
    ntip.style.left=Math.max(tw/2,Math.min(r.width-tw/2,cx-r.left))+"px";
    ntip.style.transform="translateX(-50%)";ntip.style.top="auto";ntip.style.bottom="calc(100% + 6px)";
  };
  const end=()=>{if(!drag)return;drag=null;win.classList.remove("drag");ntip.style.display="none"};
  tr.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;
    const {X0,X1,unit}=LAY,r=tr.getBoundingClientRect(),hd=e.target.closest(".nav-h");
    let [a,b]=curView(),mode=hd?hd.dataset.h:"m";
    if(!hd&&!e.target.closest("#nwin")){ /* 트랙 클릭: 클릭한 위치가 구간의 중앙이 되도록 이동 */
      const w=b-a,c=X0+(e.clientX-r.left)/r.width*(X1-X0);
      a=Math.min(Math.max(X0+Math.round((c-w/2-X0)/unit)*unit,X0),X1-w);b=a+w;
      setView(a,b);
    }
    drag={mode,sx:e.clientX,a,b,r};
    tr.setPointerCapture(e.pointerId);
    win.classList.add("drag");e.preventDefault();showTip(e.clientX);
  });
  tr.addEventListener("pointermove",e=>{
    if(!drag)return;
    const {X0,X1,unit,minW}=LAY,snap=v=>X0+Math.round((v-X0)/unit)*unit;
    const dx=(e.clientX-drag.sx)/drag.r.width*(X1-X0);
    let a=drag.a,b=drag.b;
    if(drag.mode==="l")a=Math.min(Math.max(snap(drag.a+dx),X0),b-minW);
    else if(drag.mode==="r")b=Math.max(Math.min(snap(drag.b+dx),X1),a+minW);
    else{const w=drag.b-drag.a;a=Math.min(Math.max(snap(drag.a+dx),X0),X1-w);b=a+w}
    setView(a,b);showTip(e.clientX);
  });
  tr.addEventListener("pointerup",end);
  tr.addEventListener("pointercancel",end);
  tr.addEventListener("lostpointercapture",end);
}

/* ---------- 이벤트 ---------- */
$("app").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.lg!==undefined){t.checked?S.sel.add(t.dataset.lg):S.sel.delete(t.dataset.lg);update()}
  else if(t.id==="cur"){S.cur=t.value;prepLeagues();build();const c=$("cur");if(c)c.focus()}
  else if(t.id==="unit"){S.unit=t.value;update()}
});
/* 휠: 커서 위치를 기준으로 확대/축소. 이미 전체 범위에서 축소하려는 휠은 페이지 스크롤에 양보합니다. */
$("app").addEventListener("wheel",e=>{
  if(!LAY||!e.target.closest||!e.target.closest("#svg"))return;
  const dy=e.deltaY*(e.deltaMode===1?33:e.deltaMode===2?400:1);
  if(!dy||(!S.view&&dy>0))return;
  e.preventDefault();
  const {X0,X1,W,M,iw,minW}=LAY,[a,b]=curView(),r=$("svg").getBoundingClientRect();
  const f=Math.min(1,Math.max(0,((e.clientX-r.left)*(W/r.width)-M.l)/iw)); /* 커서가 플롯 안에서 차지하는 비율 */
  const nw=Math.min(X1-X0,Math.max(minW,(b-a)*Math.exp(Math.max(-300,Math.min(300,dy))*0.0015)));
  const na=Math.min(Math.max(a+(b-a)*f-nw*f,X0),X1-nw);
  setView(na,na+nw);
},{passive:false});
$("skip").addEventListener("click",()=>$("app").focus());
new ResizeObserver(()=>{const b=$("chart");if(b&&SR.length&&b.clientWidth!==drawnW)drawChart()}).observe(document.body);
/* 언어가 바뀌면 site-bar.js 가 이 이벤트를 보냅니다 (상단 바 버튼, 다른 탭, 뒤로가기 모두) */
addEventListener("sitebar:lang",e=>{if(e.detail!==LANG){LANG=e.detail;build()}});

DATA=window.CURRENCY_DATA||null;
prep();build();
</script>

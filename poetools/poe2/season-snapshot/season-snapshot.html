<!DOCTYPE html>
<html lang="ko" data-game="poe2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Season Snapshot | PoE Tools</title>
<meta name="description" content="PoE 2 시즌별 화폐 일별 가격 비교">
<!-- 위치: poetools/poe2/season-snapshot/season-snapshot.html
     상단 바·푸터·배경·언어/테마는 site-bar.js가 처리합니다 (경로는 poetools/style/ 기준). -->
<link rel="stylesheet" href="../../style/theme.css">
<script src="../../style/site-bar.js"></script>
<style>
/* 폰트·색·패널·표·버튼 등 공통 모양은 style/theme.css. 여기에는 이 서비스 전용 스타일만 둡니다. */
main#app.wrap{max-width:min(1440px,100%);width:100%} /* 메인 영역(표·그래프 포함) 폭: 기존 1800px의 80% */
.ctrls{display:flex;flex-direction:column;gap:14px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--ln)}
.row{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
.fld{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.fld>.lbl{font-size:12px;margin:0}
.fld select{min-width:150px}
.row .fld:has(select){flex-direction:row;align-items:center;gap:10px}
.row .fld:has(select)>.lbl{white-space:nowrap}
.row .fld:has(#unit){margin-left:auto} /* 표시 단위: 오른쪽 끝 정렬 */
.fld .grp{gap:6px}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{color:var(--mute);font-size:13px}
.grp>label.lbl{margin:0}
.chip{position:relative;display:inline-flex;justify-content:flex-start;gap:8px;margin:0;padding:5px 12px;border:1px solid var(--ln2);border-radius:999px;cursor:pointer;user-select:none;font-size:13.5px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){border-color:var(--sw);background:color-mix(in oklab,var(--sw) 12%,transparent)}
.chip{-webkit-tap-highlight-color:transparent}
.chip:has(input:focus-visible){outline:2px solid var(--g);outline-offset:2px} /* 마우스 클릭 시에는 표시되지 않고, 키보드 탐색 때만 표시 */
.chip small{color:var(--mute);font-size:12px}
.chk{display:inline-flex;justify-content:flex-start;gap:8px;margin:0}
.chk small{color:var(--mute)}
.chart{position:relative}
.chart svg#svg{width:100%;height:auto;display:block;touch-action:pan-y}
.grid line{stroke:var(--ln)}
.ax text{fill:var(--mute);font-size:11.5px}
.ax .xl,.ax .xu{font-size:12.5px} /* 가로축(일) 숫자·단위: 11.5 → 12.5px */
.ax .yu,.ax .xu{text-anchor:start}.ax .yl{text-anchor:end}.ax .xl{text-anchor:middle}
#hl{stroke:var(--ln2);stroke-dasharray:3 3}
.tip{position:absolute;display:none;pointer-events:none;z-index:2;padding:0;font-size:13px;line-height:1.5;white-space:nowrap;width:max-content;max-width:none}
.tip .tg{display:grid;grid-template-columns:auto auto minmax(3.5em,auto) auto;column-gap:12px;row-gap:3px;align-items:center}
#tip{font-size:14px}                 /* 좌측 상단 범례: 13px → 14px */
#tip .u{font-size:13px}
.htip{background:var(--sf);border:1px solid var(--ln2);border-radius:var(--r);padding:9px 12px;box-shadow:0 4px 14px rgba(0,0,0,.28);z-index:3}
.htip .tg{grid-template-columns:auto auto minmax(3.5em,auto) auto auto}
.tip .tr{display:contents}
.tip .tr>*{white-space:nowrap}
.tip .tn,.tip .tv{text-align:left}
.tip .tv{text-align:right;font-variant-numeric:tabular-nums}
.tip .u{color:var(--mute);font-size:12px}
.tip .th{font-weight:600;margin-bottom:4px}
.tip .tr b{font-variant-numeric:tabular-nums}
.tip .m{color:var(--mute);font-size:12px}
.emptyc{margin:30px 0;text-align:center;color:var(--mute)}
.sw-i{display:inline-block;vertical-align:middle;margin-right:8px}
.phead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.phead h2{margin:0}
.nav{position:relative;margin-top:10px;user-select:none;-webkit-user-select:none}
.nav-track{position:relative;height:44px;border-radius:6px;background:color-mix(in oklab,var(--mute) 18%,transparent);cursor:pointer;touch-action:none}
.nav-win{position:absolute;top:0;bottom:0;box-sizing:border-box;border:1px solid var(--g);border-radius:6px;background:color-mix(in oklab,var(--g) 9%,transparent);cursor:grab} /* 뒤의 배경 그래프가 비쳐 보이도록 옅게 */
.nav-win.drag{cursor:grabbing}
.nav-bg{position:absolute;inset:0;width:100%;height:100%;border-radius:6px;pointer-events:none;overflow:hidden} /* 시간 바 배경 그래프 (바 창 뒤에 투명하게) */
.nav-bg .a{fill:var(--g);fill-opacity:.12}
.nav-bg .l{fill:none;stroke:var(--g);stroke-opacity:.5;stroke-width:1.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.nav-h{position:absolute;top:-2px;bottom:-2px;width:12px;display:flex;align-items:center;justify-content:center;cursor:ew-resize;touch-action:none}
.nav-h[data-h="l"]{left:-6px}.nav-h[data-h="r"]{right:-6px}
.nav-h::after{content:"";width:4px;height:min(28px,70%);border-radius:2px;background:var(--g)}
.nav .tip{background:var(--sf);border:1px solid var(--ln2);border-radius:var(--r);padding:8px 11px}
.nav .tip .th{margin:0}

.v{color:var(--g);font-weight:600;font-variant-numeric:tabular-nums} /* 가변 텍스트(숫자·선택값): 고정 문구와 구분 */
.foot{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-start;justify-content:space-between;margin-top:14px} /* 맨 아래: 좌측 미표시 화폐 목록, 우측 데이터 일자 */
.foot .note{margin:0}
.foot .unused{flex:1 1 320px;min-width:0;text-align:left;line-height:1.7}
.foot .unused b{font-weight:600;margin-right:6px}
.foot .gen{margin-left:auto;text-align:right;white-space:nowrap}
.fold>h2{cursor:text} /* 제목 텍스트를 드래그해 선택·복사할 수 있음 (더블클릭은 접기/펼치기) */
.fold.folded>*:not(h2){display:none}
.fold.folded>h2{margin-bottom:-16px;border-bottom:0} /* 접었을 때 제목 아래 빈 공간 제거 (theme.css 패널 여백 기준) */
/* 진입 시점별 추천: 진입 구간마다 독립된 표 */
.recg{display:grid;grid-template-columns:repeat(auto-fit,minmax(188px,1fr));gap:10px;align-items:start}
.rec table{font-size:calc(var(--fs) - 1px);table-layout:auto;width:100%;min-width:0;border-collapse:separate;border-spacing:0;border:1px solid var(--ln2);border-radius:var(--r);background:var(--sf2)}
.rec th{text-align:left;padding:8px 10px;font:600 15px/1.4 var(--serif);color:var(--g);border-bottom:1px solid var(--g);white-space:nowrap}
.rec th small{font:400 12.5px var(--sans);color:var(--mute)}
.rec td{padding:7px 10px;border-bottom:1px solid var(--ln);vertical-align:baseline;word-break:keep-all}
.rec tr:last-child td{border-bottom:0}
.rec tr.sep td{border-bottom:2px solid var(--ln2)} /* 고정 항목(디바인·카오스)과 추천 목록 구분선 */
.rec td:first-child{text-align:left}
.rec .ci{margin-right:6px;vertical-align:middle;object-fit:contain} /* 화폐 아이콘 */
.rec td.rx .xm{font-size:calc(var(--fs) - 4px)}
.rec td.mn .xm{font-size:calc(var(--fs) - 6px)}
.rec td.rx{width:1%;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:0;padding-right:4px}
.rec td.rx.up{color:var(--pos)}.rec td.rx.dn{color:var(--bad)} /* 배율: 디바인·카오스보다 높으면 녹색, 낮으면 적색, 사이는 기본색 */
.rec td.mn{padding-right:3px;font-size:calc(var(--fs) - 3px);color:color-mix(in oklab,var(--mute) 60%,var(--sf2))} /* 괄호 값은 더 흐리게 */
.rec th small.sub{display:inline;margin-left:2px;white-space:normal} /* 투자 기간 표 머리글: 같은 줄에 진입→종료 일차 (일차 숫자는 줄바꿈 안 함, 뒤의 리그 수만 필요 시 줄바꿈) */
.rec th small.sub .nw{white-space:nowrap} /* 투자 기간 표 머리글: 둘째 줄에 진입→종료 일차 */
.rec td.na{color:var(--mute);text-align:center}
</style>
</head>
<body>
<button class="skip" id="skip" type="button"></button>
<main class="wrap" id="app" tabindex="-1"></main>
<!-- 데이터: fetch_currency_history.py 가 스크립트와 같은 폴더에 생성 (currency_data.js). 이 HTML과 같은 폴더에 두고 실행하세요 -->
<script src="currency_data.js"></script>
<script>
/* 언어·테마는 site-bar.js 가 관리합니다. 현재 언어는 PoEPrefs.lang, 바뀌면 "sitebar:lang" 이벤트가 옵니다. */
let LANG=(window.PoEPrefs&&window.PoEPrefs.lang)||document.documentElement.lang||"ko";
if(LANG!=="en")LANG="ko";
/* ================= 설정값 (여기 숫자만 고치면 됩니다) =================
   진입 시점별 추천 계산에 쓰는 값들. 아래 설명은 하단 바가 1~100일차인 경우를 예로 듭니다. */
const CFG={
  firstDay:2,              /* 진입 가능한 가장 이른 일차. 1일차는 가격이 불안정해서 2부터 */
  endTrimRatio:0.20,       /* 구간 끝에서 제외할 비율. 0.20 = 끝 20% (100일 → 약 20일) */
  endTrimMin:2,            /* 위 비율로 계산한 값이 이보다 작으면 최소 이 일수만큼 제외 */
  bandWeights:[6,7,12,25,50], /* 진입 구간의 개수와 비율 (5개). 합이 100이 아니어도 자동으로 비율 계산됨. 개수를 바꾸면 구간 수도 바뀜 */
  minDaysPerBand:3,        /* 구간 하나에 최소 이 일수가 있어야 함. 후보일이 적으면 구간 수를 줄임 */
  minCandidates:3,         /* 진입 후보일이 이보다 적으면 "구간이 너무 짧음"으로 표시 */
  listSize:7,              /* 구간별 추천 목록 개수 (디바인·카오스 오브 고정 줄 제외) */
  pin:["Divine Orb","Chaos Orb"], /* 목록 맨 위에 고정할 화폐 (영어 이름, 순위 계산에서는 제외) */
  priceTolDays:1,          /* 해당 일차에 가격이 없을 때 앞뒤 며칠까지 대체값으로 쓸지 */
  iconDir:"../icon/",      /* 화폐 아이콘 폴더 (이 HTML 기준 상대경로). poetools/poe2/icon/ */
  iconExt:".webp",         /* 아이콘 확장자 */
  iconSize:28,             /* 추천 표의 아이콘 크기(px) */
  chartRatio:0.33,         /* 그래프 높이 = 폭 × 이 값 (최소 250px, 최대 500px). 이전 값 0.4 */
  navHeight:44,            /* 하단 시간 바 세로 길이(px). 이전 값 32 */
  minDays:60,              /* 데이터가 이 일수 미만인 리그는 처음에 선택 해제된 상태로 시작 (칩을 눌러 직접 켤 수 있음). 0 = 사용 안 함 */
  lowVolRatio:0.01,        /* 거래량이 중앙값의 이 비율 미만인 날은 "거래 거의 없음"으로 보고 제외 (0.01 = 1%) */
  invPeriods:[5,9,14,30,60], /* 투자 기간(일) 목록. 숫자 하나가 표 하나. Infinity = 시즌 종료(마지막 데이터 일차)까지 */
  invWindow:2,             /* 진입일(바 시작 일차) 앞뒤 며칠을 함께 볼지. 2 = ±2일(5일)의 중앙값을 써서 하루치 가격 흔들림을 줄임 */
};
const $=id=>document.getElementById(id);
const T=(ko,en)=>LANG==="en"?en:ko;

/* ========== 한글 이름표 (표시용) ==========
   키는 데이터의 영어 이름과 정확히 같아야 합니다. 새 리그·아이템이 생기면 한 줄 추가하세요. */
const NAME_KO={
  /* 리그: 따옴표 안에 한글 이름을 적으세요. 비워 두면("") 영어 그대로 표시됩니다. 왼쪽 영어 이름은 수정하지 마세요. */
  leagues:{
    "Conquerors of Wraeclast":     "",   /* 1.0.0, 2026-12-11 */
    "Forbidden Rites":             "",   /* 0.5.5, 2026-09-04 */
    "Runes of Aldur":              "",   /* 0.5.0, 2026-05-29 */
    "Fate of the Vaal":            "",   /* 0.4.0, 2025-12-12 */
    "Rise of the Abyssal":         "",   /* 0.3.0, 2025-08-29 */
    "Dawn of the Hunt":            "",   /* 0.2.0, 2025-04-04 */
    "Early Access":                "",   /* 0.1.0, 2024-12-06 */
  },
  /* 아이템(화폐) */
  items:{
  
    /* General */
    "Mirror of Kalandra":          "칼란드라의 거울",
    "Hinekora's Lock":             "히네코라의 머리카락",
    "Divine Orb":                  "디바인 오브",
    "Perfect Chaos Orb":           "완벽한 카오스 오브",
    "Greater Chaos Orb":           "상위 카오스 오브",
    "Chaos Orb":                   "카오스 오브",
	"Fracturing Orb":              "분열의 오브",
    "Orb of Annulment":            "소멸의 오브",
	"Perfect Jewellers Orb":       "완벽한 주얼러의 오브",
	
    /* Abyss */
    "Preserved Collarbone":        "보존된 빗장뼈",
    "Preserved Cranium":           "보존된 두개골",
    "Ancient Jawbone":             "고대 턱뼈",
    "Ancient Rib":                 "고대 갈비뼈",
    "Ancient Collarbone":          "고대 빗장뼈",
    "Altered Collarbone":          "뒤바뀐 빗장뼈",
	"Omen of Light":               "빛의 징조",
	
    /* Ritual */
    "Omen of Whittling":           "절사의 징조",
    "Omen of Sinistral Annulment": "좌측 소멸의 징조",
    "Omen of Sinistral Erasure":   "좌측 말소의 징조",
    "Omen of Dextral Annulment":   "우측 소멸의 징조",
    "Omen of Dextral Erasure":     "우측 말소의 징조",

    /* Essence */
    "Essence of the Breach":       "균열 에센스",

    /* Lineage Gem */
    "Uul-Netol's Embrace":         "울네톨의 포옹",
    "Uhtred's Exodus":             "우트레드의 탈출",
    "Uhtred's Augury":             "우트레드의 징조",
	"Garukhan's Resolve":          "가루칸의 투지",
	"Dialla's Desire":             "디알라의 갈망",
	"Rakiata's Flow":              "라키아타의 흐름",
	"Rigwald's Ferocity":          "리그왈드의 흉포함",

    /* Temple */
    "Architect's Orb":             "건축가의 오브",
    "Vaal Cultivation Orb":        "바알 함양 오브",
    "Crystallised Corruption":     "결정화된 타락",
	"Vaal Catalysing Infuser":     "바알 촉진시키는 주입기",
	
	/* Key */
	"Ancient Crisis Fragment":     "고대 위기 조각",
	"Weathered Crisis Fragment":   "풍화된 위기 조각",
	"Faded Crisis Fragment":       "빛바랜 위기 조각",
	"Origin Cradle":               "",
	"Origin Spark":                "",

  },
  /* 카테고리(드롭다운 그룹 제목): API가 주는 id가 영어 소문자로 보입니다. 필요하면 아래에 "id":"한글" 형태로 추가하세요. */
  categories:{
  },
};
const nm=(kind,name)=>(LANG!=="en"&&NAME_KO[kind][name])||name; /* 한글 이름이 있으면 한글, 없으면 영어 */

const V=x=>`<span class="v">${x}</span>`; /* 가변 텍스트 표시용 */
/* 아이콘 파일명: 영어 이름을 소문자로, 아포스트로피 제거, 나머지 기호·공백은 하이픈. 예) Hinekora's Lock → hinekoras-lock.webp */
const iconSlug=n=>String(n).toLowerCase().replace(/['’]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const icon=n=>`<img class="ci" src="${CFG.iconDir}${iconSlug(n)}${CFG.iconExt}" alt="" width="${CFG.iconSize}" height="${CFG.iconSize}" loading="lazy" onerror="this.style.visibility='hidden'">`; /* 파일이 없으면 숨기되 자리는 유지해 이름 정렬이 흐트러지지 않음 */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const PAL=["var(--g)","var(--b)","var(--p)","var(--y)","var(--gem)","#f97316","#ec4899","#06b6d4"]; /* 앞 5개는 theme.css 변수, 나머지는 리그가 많을 때 쓰는 고정색 */
const DAY=864e5;
const FOLD=new Set(); /* 접힌 섹션 */
const S={sel:new Set(),cur:null,metric:"average",x:"day",scale:"lin",hideLow:true,unit:"auto",view:null}; /* view: 확대해서 볼 x 구간 {a,b}, null이면 전체 */
let DATA=null,CUR=[],LG=[],SR=[],drawnW=0,UEFF="exalted",HAVE={divine:false,chaos:false};
const UNITS={exalted:{n:"Exalted Orb",ko:"엑잘티드",en:"Exalted"},chaos:{n:"Chaos Orb",ko:"카오스",en:"Chaos"},divine:{n:"Divine Orb",ko:"디바인",en:"Divine"}};
const uname=u=>T(UNITS[u].ko,UNITS[u].en);
const LCOLOR={"Forbidden Rites":"var(--p)","Fate of the Vaal":"#d4414b","Rise of the Abyssal":"#3d9a5f"}; /* 시즌별 고정색, 없으면 순서대로 PAL */
const styleOf=i=>({color:(LG[i]&&LCOLOR[LG[i].name])||PAL[i%PAL.length]});

const ts=s=>Date.parse(s+"T00:00:00Z");
const fmtDate=ms=>new Date(ms).toISOString().slice(0,10);
const fmt=v=>v==null?"-":v>=100?Math.round(v).toLocaleString("en-US"):v>=10?v.toFixed(1):v>=1?v.toFixed(2):String(+v.toPrecision(2));
const axf=v=>v>=100?Math.round(v).toLocaleString("en-US"):String(+v.toPrecision(2));
const cmp=v=>v==null?"-":v>=1e6?(v/1e6).toFixed(1)+"M":v>=1e3?Math.round(v/1e3)+"k":String(Math.round(v));
const swatch=(c,w=24)=>`<svg class="sw-i" width="${w}" height="8" aria-hidden="true"><line x1="0" y1="4" x2="${w}" y2="4" stroke="${c}" stroke-width="3"/></svg>`;

/* ---------- 데이터 ---------- */
/* DATA.leagues[리그].currencies[화폐].days[] 구조 (fetch_currency_history.py 출력). 가격은 모두 Exalted 기준 */
const dayMap=c=>new Map(((c&&c.days)||[]).map(d=>[d.date,d]));
function prep(){
  const seen=new Map();
  HAVE={divine:false,chaos:false};
  for(const lv of Object.values((DATA&&DATA.leagues)||{})){
    const cs=lv.currencies||{};
    for(const [cn,cv] of Object.entries(cs))
      if(!seen.has(cn))seen.set(cn,String((cv&&cv.category)||""));
    for(const u of ["divine","chaos"])if(((cs[UNITS[u].n]||{}).days||[]).length)HAVE[u]=true;
  }
  CUR=[...seen].map(([name,category])=>({name,category}));
  if(!seen.has(S.cur))S.cur=seen.has("Divine Orb")?"Divine Orb":(CUR[0]?CUR[0].name:null);
  prepLeagues();
}
function prepLeagues(){
  LG=Object.entries((DATA&&DATA.leagues)||{}).map(([name,v])=>{
    const cs=v.currencies||{},c=cs[S.cur];
    const days=c?(c.days||[]).slice().sort((a,b)=>a.date<b.date?-1:1):[];
    if(!days.length)return null;
    const start=v.start_date||days[0].date,t0=ts(start); /* 1일차 = 시즌 시작일 */
    const vols=days.map(d=>d.volume).filter(x=>x>0).sort((a,b)=>a-b);
    const med=vols.length?vols[vols.length>>1]:0;
    days.forEach(d=>{d.t=ts(d.date);d.n=Math.round((d.t-t0)/DAY)+1;d.lowv=med>0&&(d.volume||0)<med*CFG.lowVolRatio});
    return {name,days,start,patch:v.patch||"",first:days[0].date,last:days[days.length-1].date,
      rates:{divine:dayMap(cs[UNITS.divine.n]),chaos:dayMap(cs[UNITS.chaos.n])}};
  }).filter(Boolean).sort((a,b)=>a.start<b.start?1:-1); /* 최신 시즌이 앞 */
  const keep=[...S.sel].filter(n=>LG.some(l=>l.name===n));
  if(keep.length)S.sel=new Set(keep);
  else{ /* 처음 상태: Dawn of the Hunt와 데이터가 CFG.minDays일 미만인 리그는 기본 해제. 전부 해제되면 비어 보이지 않게 전체 선택 */
    const def=LG.filter(l=>l.name!=="Dawn of the Hunt"&&l.days.length>=CFG.minDays).map(l=>l.name);
    S.sel=new Set(def.length?def:LG.map(l=>l.name));
  }
}
/* 같은 날 Divine/Chaos 가격(Exalted)으로 나눠 환산. 시가·종가·평균은 같은 항목, 고가·저가는 평균을 사용 */
function rateOf(lg,u,d){
  if(u==="exalted")return 1;
  const r=lg.rates[u]&&lg.rates[u].get(d.date);
  if(!r)return null;
  const k=(S.metric==="open"||S.metric==="close"||S.metric==="average")?S.metric:"average";
  return [r[k],r.average,r.close].find(x=>x>0)||null;
}
/* 실제로 쓸 단위. 자동 = 모든 리그의 중앙값이 1 Divine 이상이면 Divine, 아니면 Exalted */
function unitFor(){
  const self=Object.keys(UNITS).find(k=>UNITS[k].n===S.cur);
  let u=S.unit;
  if(u==="auto"){
    u="exalted";
    if(HAVE.divine&&self!=="divine"){
      const vals=[];
      for(const lg of LG)for(const d of lg.days){
        const y=d[S.metric],r=rateOf(lg,"divine",d);
        if(y>0&&r&&!(S.hideLow&&d.lowv))vals.push(y/r);
      }
      vals.sort((a,b)=>a-b);
      if(vals.length&&vals[vals.length>>1]>=1)u="divine";
    }
  }
  if(u!=="exalted"&&(u===self||!HAVE[u]))u="exalted"; /* 자기 자신 단위이거나 환산 데이터가 없으면 Exalted */
  return u;
}
function getSeries(){
  UEFF=unitFor();
  return LG.map((lg,i)=>({lg,i})).filter(o=>S.sel.has(o.lg.name)).map(o=>{
    const pts=[];
    for(const d of o.lg.days){
      const v=d[S.metric];
      if(!(v>0)||(S.hideLow&&d.lowv))continue;
      const r=rateOf(o.lg,UEFF,d);
      if(!r)continue;
      pts.push({x:S.x==="day"?d.n:d.t,y:v/r,d});
    }
    return {...o,pts,...styleOf(o.i),map:new Map(pts.map(p=>[p.x,p]))};
  }).filter(s=>s.pts.length);
}
function noteText(){
  const cn=esc(nm("items",S.cur)),u=uname(UEFF);
  let s="";
  if(S.unit!=="auto"&&S.unit!==UEFF)s+=" "+T("선택한 단위로 환산할 수 없어 Exalted로 표시합니다.","Can't convert to the selected unit, so Exalted is shown.");
  else if(UEFF!=="exalted")s+=" "+T(`같은 날의 ${V(u)} 오브 가격으로 환산했습니다.`,`Converted with the same day's ${V(u)} Orb price.`);
  return (s?s+" ":"")+T("마우스 휠로 확대·축소하고, 아래 바의 양 끝을 끌어 표시할 날짜 폭을, 바 자체를 끌어 구간을 옮길 수 있습니다. 바를 조절하면 하단 추천 화폐 정보도 함께 변경됩니다.","Scroll to zoom. Drag the ends of the bar below to set how many days are shown, or drag the bar to move the range. Adjusting the bar also updates the recommended currencies below.");
}

}

function niceStep(range,n){const raw=range/n,p=10**Math.floor(Math.log10(raw)),f=raw/p;return(f<1.5?1:f<3?2:f<7?5:10)*p}

/* ---------- 차트 ---------- */
/* LAY: 현재 차트의 크기와 전체 x 범위. 본 차트(#plot)와 하단 범위 바(#nav)는 따로 그립니다.
   바를 끄는 동안 바 요소가 교체되면 드래그가 끊기므로, 드래그 중에는 본 차트만 다시 그립니다. */
let LAY=null;
const curView=()=>S.view?[S.view.a,S.view.b]:[LAY.X0,LAY.X1];
function setView(a,b){
  const {X0,X1}=LAY;
  a=Math.max(X0,a);b=Math.min(X1,b);
  S.view=(a<=X0&&b>=X1)?null:{a,b};
  drawPlot();syncNav();recSched();
}
function syncNav(){
  const w=$("nwin");if(!w||!LAY)return;
  const [a,b]=curView(),{X0,X1}=LAY,span=X1-X0;
  w.style.left=((a-X0)/span*100)+"%";w.style.width=((b-a)/span*100)+"%";
}
/* 구간 [a,b] 안의 점 + 양옆으로 한 점씩(구간 경계를 가로지르는 선분을 그리기 위해) */
const around=(pts,a,b)=>{let i=0,j=pts.length-1;while(i<pts.length&&pts[i].x<a)i++;while(j>=0&&pts[j].x>b)j--;return pts.slice(Math.max(0,i-1),Math.min(pts.length,j+2))};

/* 시간 바 배경 그래프: 선택한 리그들의 일별 가격을 각 리그의 기하평균으로 나눠(규모 차이 제거) 같은 일차끼리 기하평균한 값.
   모양(언제 비싸고 언제 싼지)만 보여 주며, 세로 스케일은 본 차트(S.scale)를 따릅니다. 하단 바의 좌우 범위와 같은 x축을 씁니다. */
function navBg(){
  if(!LAY||!SR.length)return "";
  const {X0,X1}=LAY,span=X1-X0,log=S.scale==="log";
  const gm=new Map(SR.map(o=>[o,o.pts.reduce((a,p)=>a+Math.log(p.y),0)/o.pts.length]));
  const xs=[...new Set(SR.flatMap(o=>o.pts.map(p=>p.x)))].sort((a,b)=>a-b);
  let lv=xs.map(x=>{let sum=0,n=0;for(const o of SR){const p=o.map.get(x);if(p){sum+=Math.log(p.y)-gm.get(o);n++}}return n?sum/n:null});
  lv=lv.map((v,i)=>{ /* 앞뒤 한 점씩 평균내 하루짜리 튐을 완화 */
    let sum=0,n=0;for(let k=i-1;k<=i+1;k++)if(lv[k]!=null){sum+=lv[k];n++}return sum/n});
  if(xs.length<2||lv.some(v=>!isFinite(v)))return "";
  const vs=lv.map(Math.exp),mx=Math.max(...vs),mn=Math.min(...vs),W=1000,H=100,pad=8;
  const t=log?(mx>mn?v=>Math.log(v/mn*1.05)/Math.log(mx/mn*1.1):()=>.5):v=>v/(mx*1.05);
  const P=xs.map((x,i)=>((x-X0)/span*W).toFixed(1)+","+(H-(H-pad)*Math.max(0,Math.min(1,t(vs[i])))).toFixed(1));
  const line="M"+P.join("L");
  const x0=P[0].split(",")[0],x1=P[P.length-1].split(",")[0];
  return `<svg class="nav-bg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="${line}L${x1},${H}L${x0},${H}Z"/><path class="l" d="${line}"/></svg>`;
}

function drawChart(){
  const box=$("chart");if(!box)return;
  if(!SR.length){LAY=null;box.innerHTML=`<p class="emptyc">${T("표시할 데이터가 없습니다. 위에서 리그를 선택하세요.","Nothing to show. Select a league above.")}</p>`;return}
  drawnW=box.clientWidth;
  const W=Math.max(320,drawnW),H=Math.round(Math.min(500,Math.max(250,W*CFG.chartRatio)));
  const M={l:60,r:48,t:28,b:36},unit=S.x==="day"?1:DAY;
  let X0=Infinity,X1=-Infinity;
  for(const s of SR)for(const p of s.pts){X0=Math.min(X0,p.x);X1=Math.max(X1,p.x)}
  if(X0===X1){X0-=unit;X1+=unit}
  const minW=Math.min(2*unit,X1-X0); /* 최소 3일 */
  LAY={W,H,M,iw:W-M.l-M.r,ih:H-M.t-M.b,X0,X1,unit,minW};
  if(S.view){ /* 리그·단위가 바뀌어 전체 범위가 달라졌으면 보이는 구간을 새 범위 안으로 맞춤 */
    const a=Math.max(S.view.a,X0),b=Math.min(S.view.b,X1);
    S.view=(b-a<minW-1e-9||(a<=X0&&b>=X1))?null:{a,b};
  }
  const k=drawnW?drawnW/W:1; /* 바를 본 차트의 x축 영역과 맞추기 위한 여백 */
  box.innerHTML=`<div id="plot"></div><div class="nav" id="nav" style="margin-left:${(M.l*k).toFixed(1)}px;margin-right:${(M.r*k).toFixed(1)}px"><div class="nav-track" id="ntrack" style="height:${CFG.navHeight}px">${navBg()}<div class="nav-win" id="nwin"><span class="nav-h" data-h="l"></span><span class="nav-h" data-h="r"></span></div></div><div class="tip" id="ntip"></div></div>`;
  const pn=$("pnote");if(pn){pn.style.marginLeft=(M.l*k).toFixed(1)+"px";pn.style.marginRight=(M.r*k).toFixed(1)+"px"} /* 안내 문구 시작 위치를 하단 바와 맞춤 */
  drawPlot();syncNav();bindNav();
}

function drawPlot(){
  const host=$("plot");if(!host||!LAY)return;
  const {W,H,M,iw,ih}=LAY,log=S.scale==="log",[x0,x1]=curView();
  let y0=Infinity,y1=-Infinity; /* 세로축은 보이는 구간의 값에 맞춤 */
  for(const s of SR)for(const p of s.pts)if(p.x>=x0&&p.x<=x1){y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}
  if(y0===Infinity)for(const s of SR)for(const p of around(s.pts,x0,x1)){y0=Math.min(y0,p.y);y1=Math.max(y1,p.y)}
  let Y0,Y1;const yt=[];
  if(log){
    Y0=y0/1.15;Y1=y1*1.15;
    const r=Y1/Y0,mult=r>300?[1]:r>12?[1,2,5]:[1,1.5,2,3,4,5,6,7,8,9];
    for(let e=Math.floor(Math.log10(Y0));e<=Math.ceil(Math.log10(Y1));e++)for(const m of mult){const v=m*10**e;if(v>=Y0&&v<=Y1)yt.push(v)}
  }else{
    const st=niceStep(y1*1.06,5);Y0=0;Y1=Math.ceil(y1*1.06/st)*st;
    for(let v=0;v<=Y1+1e-9;v+=st)yt.push(v);
  }
  const px=x=>M.l+(x-x0)/(x1-x0)*iw;
  const py=log?y=>M.t+(1-(Math.log(y)-Math.log(Y0))/(Math.log(Y1)-Math.log(Y0)))*ih:y=>M.t+(1-(y-Y0)/(Y1-Y0))*ih;
  const xt=[];
  if(S.x==="day"){const st=Math.max(1,niceStep(x1-x0,Math.max(3,Math.floor(iw/80))));for(let v=Math.ceil(x0/st)*st;v<=x1;v+=st)xt.push(v)}
  else if(S.view){const st=Math.max(1,Math.round(niceStep((x1-x0)/DAY,Math.max(2,Math.floor(iw/120)))))*DAY;for(let v=Math.ceil(x0/st)*st;v<=x1;v+=st)xt.push(v)}
  else{const n=Math.max(2,Math.floor(iw/120));for(let k=0;k<=n;k++)xt.push(Math.round((x0+(x1-x0)*k/n)/DAY)*DAY)}
  let g=`<svg id="svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T("시즌별 화폐 가격 추이 차트","Chart of currency price by season"))}"><defs><clipPath id="clipP"><rect x="${M.l}" y="${M.t}" width="${iw}" height="${ih}"/></clipPath></defs><g class="grid">`;
  for(const v of yt)g+=`<line x1="${M.l}" x2="${W-M.r}" y1="${py(v).toFixed(1)}" y2="${py(v).toFixed(1)}"/>`;
  g+=`</g><g class="ax">`;
  for(const v of yt)g+=`<text class="yl" x="${M.l-8}" y="${(py(v)+4).toFixed(1)}">${axf(v)}</text>`;
  g+=`<text class="yu" x="4" y="${M.t-12}">(${UNITS[UEFF].n})</text>`; /* 세로축 끝: 가격 단위 */
  if(S.x==="day")g+=`<text class="xu" x="${W-M.r+14}" y="${H-M.b+20}">(${T("일","Day")})</text>`; /* 가로축 끝: 경과일 단위 */
  for(const v of xt)g+=`<text class="xl" x="${px(v).toFixed(1)}" y="${H-M.b+20}">${S.x==="day"?v:fmtDate(v)}</text>`;
  g+=`</g><g${S.view?' clip-path="url(#clipP)"':""}>`; /* 확대했을 때만 영역 밖을 잘라냄 */
  for(const s of SR){
    const pts=around(s.pts,x0,x1);
    g+=`<path d="${pts.map((p,k)=>(k?"L":"M")+px(p.x).toFixed(1)+","+py(p.y).toFixed(1)).join("")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    for(const p of pts)if(p.d.partial)g+=`<circle cx="${px(p.x).toFixed(1)}" cy="${py(p.y).toFixed(1)}" r="4" fill="var(--sf)" stroke="${s.color}" stroke-width="2"/>`;
  }
  g+=`</g><line id="hl" x1="0" x2="0" y1="${M.t}" y2="${H-M.b}" visibility="hidden"/><g id="hd"></g><rect id="cap" x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip" id="tip"></div><div class="tip htip" id="htip"></div>`;
  host.innerHTML=g;

  const svg=$("svg"),tip=$("tip"),htip=$("htip"),hl=$("hl"),hd=$("hd");
  const XS=[...new Set(SR.flatMap(s=>s.pts.map(p=>p.x)))].filter(v=>v>=x0&&v<=x1).sort((a,b)=>a-b);
  const nearest=v=>{let lo=0,hi=XS.length-1;while(hi-lo>1){const m=(lo+hi)>>1;XS[m]<v?lo=m:hi=m}return Math.abs(XS[lo]-v)<=Math.abs(XS[hi]-v)?XS[lo]:XS[hi]};
  /* 좌측 상단 범례: 항상 표시. 마우스를 올리면 그 날 값, 아니면 보이는 구간의 마지막 값 */
  const showLegend=xv=>{
    const r=svg.getBoundingClientRect();
    tip.innerHTML=`<div class="tg">`+SR.map(s=>{
      const p=xv==null?[...s.pts].reverse().find(q=>q.x>=x0&&q.x<=x1):s.map.get(xv);
      return `<div class="tr">${swatch(s.color,18)}<span class="tn">${esc(nm("leagues",s.lg.name))}</span><b class="tv">${p?fmt(p.y):"–"}</b><span class="u">${p?UNITS[UEFF].n:""}</span></div>`}).join("")+`</div>`;
    tip.style.display=SR.length?"block":"none";
    tip.style.left=(M.l*(r.width/W)+8).toFixed(0)+"px";tip.style.top=(M.t*(r.height/H)+6).toFixed(0)+"px";
  };
  /* 마우스 오버 툴팁: 강조선 옆(커서 높이)에 날짜/경과일과 시즌별 값을 표시 */
  const showHover=(xv,rows,X,ey)=>{
    const day=S.x==="day";
    htip.innerHTML=`<div class="th">${day?T(`${xv}일차`,`Day ${xv}`):fmtDate(xv)}</div><div class="tg">`+rows.map(({s,p})=>{
      const meta=[];
      if(day)meta.push(p.d.date);
      if(p.d.volume!=null)meta.push(T("거래량","Vol")+" "+cmp(p.d.volume));
      return `<div class="tr">${swatch(s.color,18)}<span class="tn">${esc(nm("leagues",s.lg.name))}</span><b class="tv">${fmt(p.y)}</b><span class="u">${UNITS[UEFF].n}</span><span class="m">${meta.join(" · ")}</span></div>`}).join("")+`</div>`;
    htip.style.display="block";
    const r=svg.getBoundingClientRect(),cb=$("chart").getBoundingClientRect();
    const tw=htip.offsetWidth,th=htip.offsetHeight,ox=r.left-cb.left,oy=r.top-cb.top;
    const lx=ox+X*(r.width/W);
    let left=lx+14;if(left+tw>cb.width)left=lx-14-tw; /* 오른쪽이 모자라면 왼쪽에 표시 */
    let top=ey-cb.top+14;if(top+th>oy+r.height)top=ey-cb.top-14-th;
    htip.style.left=Math.max(0,left).toFixed(0)+"px";htip.style.top=Math.max(0,top).toFixed(0)+"px";
  };
  const hide=()=>{hl.setAttribute("visibility","hidden");hd.innerHTML="";htip.style.display="none";showLegend(null)};
  svg.addEventListener("pointerleave",hide);
  svg.addEventListener("pointermove",e=>{
    const r=svg.getBoundingClientRect(),sx=(e.clientX-r.left)*(W/r.width);
    if(!XS.length||sx<M.l-4||sx>W-M.r+4){hide();return}
    const xv=nearest(x0+(sx-M.l)/iw*(x1-x0));
    const rows=SR.map(s=>({s,p:s.map.get(xv)})).filter(o=>o.p);
    if(!rows.length){hide();return}
    const X=px(xv);
    hl.setAttribute("x1",X);hl.setAttribute("x2",X);hl.setAttribute("visibility","visible");
    hd.innerHTML=rows.map(({s,p})=>`<circle cx="${X}" cy="${py(p.y)}" r="4.5" fill="${s.color}"/>`).join("");
    showLegend(xv);
    showHover(xv,rows,X,e.clientY);
  });
  showLegend(null);
}

/* ---------- 하단 범위 바 ---------- */
/* 양 끝(핸들)을 끌면 표시할 날짜 폭 조절, 바 자체를 끌면 전체 범위 안에서 구간 이동,
   바 밖의 트랙을 누르면 그 위치로 구간을 옮긴 뒤 계속 끌 수 있습니다. 누르고 있는 동안 일수를 툴팁으로 보여줍니다. */
function bindNav(){
  const tr=$("ntrack"),win=$("nwin"),nav=$("nav"),ntip=$("ntip");
  if(!tr||!LAY)return;
  let drag=null;
  const showTip=cx=>{
    const [a,b]=curView(),n=Math.round((b-a)/LAY.unit)+1;
    ntip.innerHTML=`<div class="th">${T(`${n}일`,`${n} ${n===1?"day":"days"}`)}</div>`;
    ntip.style.display="block";
    const r=nav.getBoundingClientRect(),tw=ntip.offsetWidth;
    ntip.style.left=Math.max(tw/2,Math.min(r.width-tw/2,cx-r.left))+"px";
    ntip.style.transform="translateX(-50%)";ntip.style.top="auto";ntip.style.bottom="calc(100% + 6px)";
  };
  const end=()=>{if(!drag)return;drag=null;win.classList.remove("drag");ntip.style.display="none"};
  tr.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;
    const {X0,X1,unit}=LAY,r=tr.getBoundingClientRect(),hd=e.target.closest(".nav-h");
    let [a,b]=curView(),mode=hd?hd.dataset.h:"m";
    if(!hd&&!e.target.closest("#nwin")){ /* 트랙 클릭: 클릭한 위치가 구간의 중앙이 되도록 이동 */
      const w=b-a,c=X0+(e.clientX-r.left)/r.width*(X1-X0);
      a=Math.min(Math.max(X0+Math.round((c-w/2-X0)/unit)*unit,X0),X1-w);b=a+w;
      setView(a,b);
    }
    drag={mode,sx:e.clientX,a,b,r};
    tr.setPointerCapture(e.pointerId);
    win.classList.add("drag");e.preventDefault();showTip(e.clientX);
  });
  tr.addEventListener("pointermove",e=>{
    if(!drag)return;
    const {X0,X1,unit,minW}=LAY,snap=v=>X0+Math.round((v-X0)/unit)*unit;
    const dx=(e.clientX-drag.sx)/drag.r.width*(X1-X0);
    let a=drag.a,b=drag.b;
    if(drag.mode==="l")a=Math.min(Math.max(snap(drag.a+dx),X0),b-minW);
    else if(drag.mode==="r")b=Math.max(Math.min(snap(drag.b+dx),X1),a+minW);
    else{const w=drag.b-drag.a;a=Math.min(Math.max(snap(drag.a+dx),X0),X1-w);b=a+w}
    setView(a,b);showTip(e.clientX);
  });
  tr.addEventListener("pointerup",end);
  tr.addEventListener("pointercancel",end);
  tr.addEventListener("lostpointercapture",end);
}

/* ---------- 진입 시점별 추천 ---------- */
/* REC-START */
/* 선택한 리그들에서, 하단 바 구간 [a,b] 안의 각 진입일 가격 대비 b일차 가격의 배수를 계산합니다.
   진입일을 구간 길이에 비례한 여러 구간(비율은 CFG.bandWeights)으로 나누고, 리그별 중앙값 → 리그 간 기하평균으로 순위를 매깁니다. */
const PX=new Map(); /* "리그|화폐|…" -> {pr:일차→가격, last:마지막 일차} */
function pxOf(ln,item){
  const key=ln+"|"+item+"|"+S.metric+"|"+S.hideLow;
  if(PX.has(key))return PX.get(key);
  const lv=DATA.leagues[ln],c=lv&&lv.currencies&&lv.currencies[item];
  let r=null;
  if(c&&(c.days||[]).length){
    const days=c.days,t0=ts(lv.start_date||days.map(d=>d.date).sort()[0]);
    const vols=days.map(d=>d.volume).filter(x=>x>0).sort((a,b)=>a-b),med=vols.length?vols[vols.length>>1]:0;
    const pr=new Map();let last=0;
    for(const d of days){
      const v=d[S.metric];if(!(v>0))continue;
      if(S.hideLow&&med>0&&(d.volume||0)<med*CFG.lowVolRatio)continue; /* 거래가 거의 없는 날은 제외 */
      const n=Math.round((ts(d.date)-t0)/DAY)+1;
      pr.set(n,v);if(n>last)last=n;
    }
    r={pr,last};
  }
  PX.set(key,r);return r;
}
const priceAt=(r,n)=>{for(let k=0;k<=CFG.priceTolDays;k++)for(const o of(k?[-k,k]:[0])){const v=r.pr.get(n+o);if(v)return v}return null}; /* 같은 날 → ±1일 → ±2일 … 순서 */
const PIN=CFG.pin; /* 목록 맨 위에 항상 표시할 화폐 */
const median=a=>{const s=a.slice().sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
function recCalc(){
  if(!LAY||!DATA||S.x!=="day")return null;
  const names=[...S.sel].filter(n=>DATA.leagues[n]);
  if(!names.length)return null;
  const [va,vb]=curView(),a=Math.ceil(va-1e-9),b=Math.floor(vb+1e-9);
  const first=Math.max(a,CFG.firstDay),last=b-Math.max(CFG.endTrimMin,Math.round((b-a)*CFG.endTrimRatio)),cnt=last-first+1; /* 진입 가능한 날: 1일차(가격 불안정)와 끝 며칠은 제외 */
  let items=null;
  for(const n of names){const ks=Object.keys(DATA.leagues[n].currencies||{});items=items?items.filter(k=>ks.includes(k)):ks}
  const R={names,a,b,items:items.length,bands:[]};
  if(cnt<CFG.minCandidates||!items.length){R.short=true;return R}
  const BW=CFG.bandWeights,nb=Math.max(1,Math.min(BW.length,Math.floor(cnt/CFG.minDaysPerBand))),bsum=BW.reduce((x,y)=>x+y,0),w=nb===BW.length?BW.map(x=>x/bsum):Array(nb).fill(1/nb);
  /* 구간 폭 = 후보일 × 비율의 정수 부분 + 남은 일수는 소수 부분이 큰 구간부터 1일씩 (최대잔여법).
     누적 경계를 반올림하던 방식에서는 비율이 큰 구간이 더 짧아지는 역전이 생길 수 있었음 */
  const ideal=w.map(x=>cnt*x),wd=ideal.map(Math.floor);
  let rem=cnt-wd.reduce((x,y)=>x+y,0);
  ideal.map((x,i)=>[x-wd[i],i]).sort((p,q)=>q[0]-p[0]||q[1]-p[1]).slice(0,rem).forEach(([,i])=>wd[i]++);
  let s0=first;
  for(let i=0;i<nb;i++){
    if(wd[i]>0)R.bands.push({s:s0,e:s0+wd[i]-1});
    s0+=wd[i];
  }
  for(const bd of R.bands){
    const rows=[];
    for(const it of items){
      const lgv=[];
      for(const ln of names){
        const r=pxOf(ln,it);if(!r)continue;
        const exD=Math.min(b,r.last),pe=priceAt(r,exD);if(!pe)continue;
        const rt=[];
        for(let t=bd.s;t<=bd.e;t++){
          if(t>=exD)continue;
          const p0=priceAt(r,t);if(p0)rt.push(pe/p0);
        }
        if(rt.length)lgv.push(median(rt)); /* 이 진입 구간에 데이터가 없는 리그는 건너뜀 */
      }
      if(!lgv.length)continue;
      rows.push({nl:lgv.length,name:it,gm:Math.exp(lgv.reduce((s,x)=>s+Math.log(x),0)/lgv.length),mn:Math.min(...lgv)});
    }
    const rest=rows.filter(o=>!PIN.includes(o.name)); /* 디바인·카오스 오브는 순위에서 빼고 맨 위에 따로 표시 */
    bd.nl=rest.length?Math.max(...rest.map(o=>o.nl)):0;
    const same=rest.filter(o=>o.nl===bd.nl); /* 같은 리그 수로 비교되는 품목만 */
    same.sort((x,y)=>y.gm-x.gm);
    bd.top=same.slice(0,CFG.listSize);
    bd.pin=PIN.map(n=>rows.find(o=>o.name===n)).filter(Boolean);
  }
  return R;
}
function renderRec(){
  const host=$("rec"),note=$("recnote");if(!host||!note)return;
  SHOWN.rec=new Set();
  const R=recCalc();
  if(!R){note.textContent="";host.innerHTML=`<p class="emptyc">${T("표시할 데이터가 없습니다. 리그를 선택하세요.","Nothing to show. Select a league above.")}</p>`;return}
  note.innerHTML=T(`각 진입 시점 대비 ${V(R.b)}일차까지의 가격 배수의 리그별 중앙값의 기하평균. 선택한 리그 ${V(R.names.length)}개 · 아래 바 ${V(R.a+"~"+R.b)}일차 · 공통 화폐 ${V(R.items)}종 기준. 괄호 안은 최저 리그 값.`,
    `Geometric mean of the per-league medians of the price multiple from each entry time to day ${V(R.b)}. Based on ${V(R.names.length)} selected league(s), day ${V(R.a+"–"+R.b)} of the bar below, ${V(R.items)} shared currencies. Parentheses: lowest league value.`);
  if(R.short){host.innerHTML=`<p class="emptyc">${T("구간이 너무 짧거나 공통 화폐가 없습니다. 아래 바에서 구간을 넓혀 보세요.","The range is too short or there are no shared currencies. Widen it with the bar below.")}</p>`;return}
  R.bands.forEach(bd=>[...bd.pin,...bd.top].forEach(o=>SHOWN.rec.add(o.name)));
  const lab=bd=>bd.s===bd.e?T(`${bd.s}일차`,`Day ${bd.s}`):T(`${bd.s}~${bd.e}일차`,`Day ${bd.s}–${bd.e}`);
  const mx=v=>`<span class="xm">x</span>`+(v>=100?Math.round(v).toLocaleString("en-US"):v>=10?v.toFixed(0):v.toFixed(1));
    const rc=(bd,o)=>{ /* 디바인·카오스 오브 배율과 비교: 둘 다보다 높으면 up, 둘 다보다 낮으면 dn */
    if(PIN.includes(o.name)||!bd.pin.length)return "";
    const hi=Math.max(...bd.pin.map(q=>q.gm)),lo=Math.min(...bd.pin.map(q=>q.gm));
    return o.gm>hi?" up":o.gm<lo?" dn":"";
  };
    host.innerHTML=`<div class="recg">${R.bands.map(bd=>`<table><thead><tr><th colspan="3">${lab(bd)}${bd.nl&&bd.nl<R.names.length?` <small>${T(`(${bd.nl}/${R.names.length}개 리그)`,`(${bd.nl}/${R.names.length} leagues)`)}</small>`:""}</th></tr></thead><tbody>${[...bd.pin.map((o,i)=>[o,bd.top.length&&i===bd.pin.length-1]),...bd.top.map(o=>[o,false])].map(([o,sep])=>`<tr${sep?' class="sep"':""}><td>${icon(o.name)}${esc(nm("items",o.name))}</td><td class="rx${rc(bd,o)}">${mx(o.gm)}</td><td class="rx mn">(${mx(o.mn)})</td></tr>`).join("")}</tbody></table>`).join("")}</div>`;
}
let recRaf=0;
function recSched(){if(recRaf)return;recRaf=requestAnimationFrame(()=>{recRaf=0;renderRec();renderInv();renderUnused()})}
/* REC-END */

/* ---------- 투자 기간에 따른 보유 화폐 ---------- */
/* INV-START */
/* 그래프 아래 범위 바의 시작 일차(a)를 진입일로 보고, 선택한 리그들에서 "a일차에 사서 N일 뒤(또는 시즌 끝)에 팔았을 때"의
   가격 배수를 계산합니다. N일은 그래프의 일차 기준입니다. 리그별 중앙값 → 리그 간 기하평균으로 순위를 매기는 방식은 진입 시점별 추천과 같습니다. */
function invCalc(){
  if(!LAY||!DATA||S.x!=="day")return null;
  const names=[...S.sel].filter(n=>DATA.leagues[n]);
  if(!names.length)return null;
  const [va]=curView(),a=Math.max(CFG.firstDay,Math.ceil(va-1e-9));
  const R={names,a,items:0,cols:[]};
  let items=null;
  for(const n of names){const ks=Object.keys(DATA.leagues[n].currencies||{});items=items?items.filter(k=>ks.includes(k)):ks}
  R.items=items.length;
  if(!items.length)return R;
  const t0=Math.max(CFG.firstDay,a-CFG.invWindow),t1=a+CFG.invWindow;
  for(const N of CFG.invPeriods){
    const rows=[];
    for(const it of items){
      const lgv=[];
      for(const ln of names){
        const r=pxOf(ln,it);if(!r)continue;
        const rt=[];
        for(let t=t0;t<=t1;t++){
          const e=N===Infinity?r.last:t+N; /* 팔 날: 투자 기간 뒤, 또는 그 시즌의 마지막 데이터 일차 */
          if(e<=t||e>r.last)continue;      /* 그 시즌이 그만큼 길지 않으면 이 진입일은 건너뜀 */
          const p0=priceAt(r,t),p1=priceAt(r,e);
          if(p0&&p1)rt.push(p1/p0);
        }
        if(rt.length)lgv.push(median(rt)); /* 이 기간을 계산할 데이터가 없는 리그는 건너뜀 */
      }
      if(!lgv.length)continue;
      rows.push({nl:lgv.length,name:it,gm:Math.exp(lgv.reduce((s,x)=>s+Math.log(x),0)/lgv.length),mn:Math.min(...lgv)});
    }
    const rest=rows.filter(o=>!PIN.includes(o.name));
    const col={N,nl:rest.length?Math.max(...rest.map(o=>o.nl)):0};
    col.top=rest.filter(o=>o.nl===col.nl).sort((x,y)=>y.gm-x.gm).slice(0,CFG.listSize); /* 같은 리그 수로 비교되는 품목만 */
    col.pin=PIN.map(n=>rows.find(o=>o.name===n)).filter(Boolean);
    R.cols.push(col);
  }
  return R;
}
function renderInv(){
  const host=$("inv"),note=$("invnote");if(!host||!note)return;
  SHOWN.inv=new Set();
  const R=invCalc(),msg=(ko,en)=>{note.textContent="";host.innerHTML=`<p class="emptyc">${T(ko,en)}</p>`};
  if(!R)return msg("표시할 데이터가 없습니다. 리그를 선택하세요.","Nothing to show. Select a league above.");
  if(!R.items)return msg("선택한 리그들에 공통 화폐가 없습니다.","The selected leagues share no currencies.");
  R.cols.forEach(c=>[...c.pin,...c.top].forEach(o=>SHOWN.inv.add(o.name)));
  const m=R.names.length,a=R.a,lo=Math.max(CFG.firstDay,a-CFG.invWindow),hi=a+CFG.invWindow;
  note.innerHTML=T(`아래 바 시작 지점 ${V(a+"일차")}(${V(lo+"~"+hi+"일차")}) 진입 후 투자 기간이 지난 뒤의 가격 배수의 리그별 중앙값의 기하평균. 선택한 리그 ${V(m)}개 · 공통 화폐 ${V(R.items)}종 기준. 괄호 안은 최저 리그 값.`,
    `Geometric mean of the per-league medians of the price multiple after each investment period, entering at the start of the bar below, ${V("day "+a)} (${V("day "+lo+"–"+hi)}). Based on ${V(m)} selected league(s), ${V(R.items)} shared currencies. Parentheses: lowest league value.`);
  const mx=v=>`<span class="xm">x</span>`+(v>=100?Math.round(v).toLocaleString("en-US"):v>=10?v.toFixed(0):v>=1?v.toFixed(1):v.toFixed(2));
  const rc=(col,o)=>{ /* 디바인·카오스 오브 배율과 비교: 둘 다보다 높으면 up, 둘 다보다 낮으면 dn */
    if(PIN.includes(o.name)||!col.pin.length)return "";
    const h=Math.max(...col.pin.map(q=>q.gm)),l=Math.min(...col.pin.map(q=>q.gm));
    return o.gm>h?" up":o.gm<l?" dn":"";
  };
  const head=col=>{
    const lab=col.N===Infinity?T("시즌 끝까지","Until season end"):T(`${col.N}일`,`${col.N} days`);
    const sub=col.N===Infinity?T(`${a}일차 → 종료`,`Day ${a} → end`):T(`${a}→${a+col.N}일차`,`Day ${a}→${a+col.N}`);
    const cnt=col.nl&&col.nl<m?T(` (${col.nl}/${m}개 리그)`,` (${col.nl}/${m} leagues)`):"";
    return `<th colspan="3">${lab} <small class="sub"><span class="nw">${sub}</span>${cnt}</small></th>`;
  };
  host.innerHTML=`<div class="recg">${R.cols.map(col=>{
    const list=[...col.pin.map((o,i)=>[o,col.top.length&&i===col.pin.length-1]),...col.top.map(o=>[o,false])];
    const body=list.length
      ?list.map(([o,sep])=>`<tr${sep?' class="sep"':""}><td>${icon(o.name)}${esc(nm("items",o.name))}</td><td class="rx${rc(col,o)}">${mx(o.gm)}</td><td class="rx mn">(${mx(o.mn)})</td></tr>`).join("")
      :`<tr><td class="na" colspan="3">${T("데이터 없음 (시즌이 이 기간보다 짧음)","No data (leagues are shorter than this period)")}</td></tr>`;
    return `<table><thead><tr>${head(col)}</tr></thead><tbody>${body}</tbody></table>`;
  }).join("")}</div>`;
}
/* INV-END */

/* 맨 아래 좌측: 위의 추천 표(투자 기간·진입 시점) 어디에도 한 번도 나오지 않은 모든 화폐 */
const SHOWN={rec:new Set(),inv:new Set()};
function renderUnused(){
  const el=$("unused");if(!el)return;
  if(!SHOWN.rec.size&&!SHOWN.inv.size){el.innerHTML="";return} /* 표가 하나도 없으면 전체 목록이 무의미하므로 숨김 */
  const rest=CUR.filter(c=>!SHOWN.rec.has(c.name)&&!SHOWN.inv.has(c.name));
  el.innerHTML=rest.length
    ?`<b>${T("추천 표에 나오지 않은 화폐","Not shown in the tables above")} (${rest.length})</b>`+rest.map(c=>esc(nm("items",c.name))).join(" · ")
    :"";
}

/* ---------- 이벤트 ---------- */
$("app").addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.lg!==undefined){t.checked?S.sel.add(t.dataset.lg):S.sel.delete(t.dataset.lg);update()}
  else if(t.id==="cur"){S.cur=t.value;prepLeagues();build();const c=$("cur");if(c)c.focus()}
  else if(t.id==="unit"){S.unit=t.value;update()}
});
/* 휠: 커서 위치를 기준으로 확대/축소. 이미 전체 범위에서 축소하려는 휠은 페이지 스크롤에 양보합니다. */
$("app").addEventListener("wheel",e=>{
  if(!LAY||!e.target.closest||!e.target.closest("#svg"))return;
  const dy=e.deltaY*(e.deltaMode===1?33:e.deltaMode===2?400:1);
  if(!dy||(!S.view&&dy>0))return;
  e.preventDefault();
  const {X0,X1,W,M,iw,minW}=LAY,[a,b]=curView(),r=$("svg").getBoundingClientRect();
  const f=Math.min(1,Math.max(0,((e.clientX-r.left)*(W/r.width)-M.l)/iw)); /* 커서가 플롯 안에서 차지하는 비율 */
  const nw=Math.min(X1-X0,Math.max(minW,(b-a)*Math.exp(Math.max(-300,Math.min(300,dy))*0.0015)));
  const na=Math.min(Math.max(a+(b-a)*f-nw*f,X0),X1-nw);
  setView(na,na+nw);
},{passive:false});
/* 섹션 제목을 더블클릭하면 접기/펼치기 (build()로 다시 그려도 상태 유지) */
$("app").addEventListener("dblclick",e=>{
  const h=e.target.closest&&e.target.closest(".fold>h2");if(!h)return;
  const sec=h.parentElement,k=sec.dataset.fold;
  FOLD.has(k)?FOLD.delete(k):FOLD.add(k);
  sec.classList.toggle("folded",FOLD.has(k));
  getSelection().removeAllRanges();
});
$("skip").addEventListener("click",()=>$("app").focus());
new ResizeObserver(()=>{const b=$("chart");if(b&&SR.length&&b.clientWidth!==drawnW)drawChart()}).observe(document.body);
/* 언어가 바뀌면 site-bar.js 가 이 이벤트를 보냅니다 (상단 바 버튼, 다른 탭, 뒤로가기 모두) */
addEventListener("sitebar:lang",e=>{if(e.detail!==LANG){LANG=e.detail;build()}});

DATA=window.CURRENCY_DATA||null;
prep();build();
</script>

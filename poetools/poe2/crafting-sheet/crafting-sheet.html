<!DOCTYPE html>
<html lang="ko" data-game="poe2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crafting Sheet | PoE Tools</title>
<link rel="stylesheet" href="../../style/theme.css">
<script src="../../style/site-bar.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&display=swap">
<style>
/* 공통 모양은 style/theme.css. 여기에는 크래프팅 시트 전용 스타일만 둡니다. */
.bar{display:flex;flex-wrap:wrap;gap:22px 20px;align-items:center;padding:0 0 10px;margin-left:46px;max-width:798px}
/* 버튼 줄(초기화·목록·파일): 스크롤해도 화면 위쪽에 붙어 있음 (position:sticky, 총 비용 창과 같은 방식).
   뒤로 지나가는 단계가 비치지 않도록 main 폭 전체를 불투명 배경으로 덮고, 안쪽은 본문과 같은 왼쪽 여백(46px)을 둠 */
:root{--acts-h:52px;
  /* ── 간격·글자 크기 조절 (현재 값 = 기존 모양 그대로) ── */
  --ls-min:240px; /* 저장된 레시피 목록 목표 폭: 실제로는 (목표 폭 − 원래 폭)의 절반만큼만 늘어나며, 왼쪽으로만 커짐 */
  --acts-mt:0px;--acts-mb:16px;   /* 버튼 열 상단·하단 마진 */
  --rn-fs:24px;--rn-mt:0px;       /* 레시피 이름 글자 크기·상단 마진 */
  --man-sat:0.7; /* 직접 입력한 가격 색의 채도 배율: 1 = 원래 색, 0 = 무채색, 1 초과 = 더 진하게 (예: 0.6, 1.3) */
  --man:var(--g2); /* 직접 입력한 가격의 글자색: PoE 2 포인트색(--g2, 밤 모드 #9fe0d4) */
  --cur-w:240px;--cur-gap:11px; /* 총 재화 창 폭 / 총 비용과의 간격: 창 위치와 시세 드롭다운 위치가 이 값을 함께 씁니다 */
  --sec-fs:15px;--sec-mt:0px;--sec-mb:0px; /* 섹션(단계) 이름 글자 크기·상단·하단 마진 */
} /* 버튼 줄 높이(버튼 38 + 위아래 여백 8·8). 총 비용 창이 이 아래에서 붙도록 쓰임 */
.acts-bar{position:sticky;top:var(--bar-h,0px);z-index:20;box-sizing:border-box;margin:var(--acts-mt) -20px var(--acts-mb);padding:8px 20px 8px 66px;background:var(--bg)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;max-width:798px}
.acts-bar .psrc{display:block;margin:8px auto 0} /* 시세 드롭다운: 좁은 화면에서는 버튼 줄 아래 */
@media(min-width:1340px){.acts-bar .psrc{position:absolute;top:8px;left:calc(100% + var(--cur-gap) + var(--cur-w) - 20px);transform:translateX(-100%);margin:0}} /* 넓은 화면: 파일 저장 줄의 오른쪽 바깥, 총 재화 창 바로 위 (폭은 가장 긴 항목에 맞춤(최소 150px), 오른쪽 끝을 총 재화 창 오른쪽 끝에 맞춤: 총 재화 창 폭·간격 변수(--cur-w, --cur-gap)를 따라감. -20px = 버튼 줄의 좌우 확장분) */
@media(max-width:820px){:root{--acts-h:0px}.acts-bar{position:static}} /* 버튼이 여러 줄로 접히는 좁은 화면에서는 붙이지 않음 */
.acts .l,.acts .r{flex:1 1 0;display:flex;gap:8px;align-items:center;min-width:130px} /* 왼쪽(초기화)·오른쪽(파일 저장) 폭을 같게 맞춰, 가운데 묶음(목록·불러오기·파일 불러오기)이 정확히 중앙에 오도록 */
.acts .r{justify-content:flex-end}
.acts .c{display:flex;flex:none;gap:8px;align-items:center;margin-inline:auto}
.acts .r .fl{margin-inline:auto} /* 파일 불러오기는 가운데 묶음(목록·불러오기)과 파일 저장 사이의 한가운데 */
@media(min-width:821px){.acts{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.acts .l,.acts .r{min-width:0}} /* 3칸 격자: 가운데 묶음이 항상 정중앙 */
.bar .rn{flex:1 1 100%;min-width:0;width:auto;max-width:none;padding:4px 0 6px;border:0;border-bottom:1px solid var(--ln2);border-radius:0;background:none;margin-top:var(--rn-mt);font:600 var(--rn-fs)/1.3 var(--serif)}
.bar .rn:focus,.bar .rn:focus-visible{outline:none;box-shadow:none;background:none;border-bottom-color:var(--ln2)}
.grp{display:inline-flex;align-items:stretch;border:1px solid var(--ln2);border-radius:var(--r);background:var(--sf);overflow:hidden}
.grp>*{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border:0;border-right:1px solid var(--ln);border-radius:0;background:none;color:var(--ink);font:500 14px/1 var(--sans);letter-spacing:-.01em;white-space:nowrap}
.grp>:last-child{border-right:0}
.grp button{cursor:pointer;transition:background .15s,color .15s}
.grp button:hover:not(:disabled){background:color-mix(in oklab,var(--g) 14%,transparent);color:var(--g)}
.grp button:focus-visible{outline-offset:-3px}
.grp svg{flex:none;opacity:.8}
.panel>h2::before,legend::before{display:none} /* theme.css 의 마름모(◆) 모양 숨김 */
.grp.split{gap:4px;border:0;background:none;overflow:visible}
.grp.split>*,.grp.split>:last-child{border:1px solid var(--ln2);border-radius:var(--r);background:var(--sf)}
.grp select{max-width:260px;padding:0 10px;color:var(--mute);text-align:center;text-align-last:center}
#msg{margin:0 0 8px 46px;max-width:798px}
#msg:empty{display:none} /* 안내 문구가 없을 땐 자리를 차지하지 않음 */
main.wrap{box-sizing:border-box;max-width:884px;margin-inline:auto;padding-inline:20px} /* 844px(본문 폭) + 좌우 패딩 40px — 헤더·바·본문의 좌우 끝선이 같아지고 화면 가운데에 정렬됨 */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px 16px;align-items:start;max-width:844px} /* 가로 간격 24→16px: 총 비용 위치는 그대로 두고 단계 폭만 오른쪽으로 8px 늘어남 (세로 간격 24px 유지) */
/* 오른쪽 묶음(.sides): 총 비용(.side) 과 총 재화(.side)를 담음. 좁은 화면에서는 세로로 쌓이고, 스크롤해도 묶음이 화면 위쪽에 붙어 있음 */
.sides{position:sticky;top:calc(var(--bar-h) + var(--acts-h) + 8px);display:grid;grid-template-columns:250px;gap:13px;align-items:start}
.side{margin:0}
@media(min-width:1340px){ /* 넓은 화면: 단계 목록·총 비용의 위치와 폭은 원래 그대로 두고, 재화 창만 총 비용 오른쪽 바깥에 붙임 (본문 폭을 늘리지 않으므로 전체 가로 위치가 변하지 않음) */
  .sides>.side+.side{position:absolute;top:0;left:calc(100% + var(--cur-gap));width:var(--cur-w)} /* 240px = 재화 폭, 11px = 총 비용과의 간격 */
}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}.sides{position:static}}
.steps{position:relative}
.steps::before{content:"";position:absolute;left:15px;top:18px;bottom:48px;width:1px;background:var(--ln2)}
.step{position:relative;margin:0 0 14px 46px;background:var(--sf);border:1px solid color-mix(in oklab,var(--g) var(--pbd),var(--ln));border-radius:var(--r)}
.no{position:absolute;left:-46px;top:4px;width:31px;height:31px;display:grid;place-items:center;border:1px solid var(--g);border-radius:50%;background:var(--bg);color:var(--g);font:600 14px var(--serif)}
.sh{display:flex;align-items:center;gap:4px;height:36px;box-sizing:border-box;padding:0 14px;border-bottom:1px solid var(--ln);background:color-mix(in oklab,var(--g) var(--pht),transparent)}
.step .t{flex:1;min-width:0;width:auto;max-width:none;height:28px;min-height:0;box-sizing:border-box;padding:2px 0;border:0;border-bottom:1px solid transparent;border-radius:0;background:none;margin:var(--sec-mt) 0 var(--sec-mb);font:600 var(--sec-fs) var(--serif)}
.it input{border-color:var(--ln2)}
.step .t:focus,.step .t:focus-visible,.it input:focus,.it input:focus-visible,.step textarea:focus,.step textarea:focus-visible{outline:none;box-shadow:none}
.it input:focus,.it input:focus-visible{border-color:var(--ln2)}
.sc2{margin-right:8px;color:var(--g);font:600 14px var(--serif);white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{width:28px;height:26px;border:0;background:none;color:var(--mute);border-radius:var(--r);cursor:pointer;line-height:1}
.ib:hover:not(:disabled){color:var(--ink);background:var(--sf2)}
/* 단계 삭제(✕): 단계 카드의 세로 가운데. 가로는 번호 원(.no)과 같은 left·width·height·테두리 구성이라 가로 중심이 항상 일치. 원 테두리와 배경은 ::before 로 그림 */
.step>.xdel{position:absolute;left:-46px;top:50%;transform:translateY(-50%);width:31px;height:31px;padding:0;border:1px solid transparent;border-radius:50%;display:grid;place-items:center;line-height:1;background:none}
.step>.xdel::before{content:"";position:absolute;inset:3px;box-sizing:border-box;border:1px solid var(--ln2);border-radius:50%;background:var(--bg);pointer-events:none;transition:background .15s,border-color .15s}
.step>.xdel svg{position:relative;display:block;width:16px;height:16px}
.step>.xdel:hover:not(:disabled){background:none}
.step>.xdel:hover:not(:disabled)::before{background:var(--sf2);border-color:var(--mute)}
.sb{padding:9px 14px 11px}
/* 단계 접기: 머리줄 자물쇠 왼쪽 버튼. 접힌 단계는 머리줄만 남기고(내용 숨김, 합계 제외), 삭제 버튼은 숨김 */
.ib.fold svg{display:block;margin:auto;transform:rotate(180deg);transition:transform .15s}
.step.col .ib.fold svg{transform:none}
.step.col>.sb,.step.col>.xdel,.step.col>.no{display:none}
.step.col .sh{border-bottom:0}
.step.lk .sb{padding-bottom:9px} /* 잠긴 단계: 하단 여백 2px 줄임 */
.it{display:grid;grid-template-columns:minmax(0,1fr) 32px 72px 60px 28px;gap:8px;align-items:center;margin:0 0 5px}
.it input[type=text],.it input[type=number]{width:100%;max-width:none;height:34px;min-height:0;box-sizing:border-box;padding-block:0}
.it input[data-f=c]{margin-top:1px}
/* 재화 삭제(✕): 선 아이콘, 크기를 직접 지정(13px) */
.it .ib[data-a=delItem]{display:grid;place-items:center;padding:0}
.it .ib[data-a=delItem] svg{display:block;width:13px;height:13px}
/* 수량 칸: 브라우저 기본 스피너는 모양·높이를 CSS로 맞출 수 없어 숨기고, 칸 안쪽 높이를 꽉 채우는 위/아래 버튼(.qb)을 직접 둠 */
.qty{display:block;position:relative;height:34px}
.it input[data-f=n]{text-align:center;padding:0 22px 0 0;border-width:1px;-moz-appearance:textfield;appearance:textfield}
.it input[data-f=n]::-webkit-inner-spin-button,.it input[data-f=n]::-webkit-outer-spin-button{-webkit-appearance:none;appearance:none;margin:0}
.qsp{position:absolute;top:1px;right:1px;bottom:1px;width:21px;display:flex;flex-direction:column;border-left:1px solid var(--ln2);border-radius:0 calc(var(--r) - 1px) calc(var(--r) - 1px) 0;overflow:hidden}
.qb{flex:1 1 0;min-height:0;display:grid;place-items:center;padding:0;border:0;background:none;color:var(--mute);cursor:pointer;transition:background .15s,color .15s}
.qb+.qb{border-top:1px solid var(--ln)}
.qb:hover:not(:disabled){color:var(--ink);background:var(--sf2)}
.qb:disabled{opacity:.4;cursor:default}
.ci{width:32px;height:32px;display:grid;place-items:center}.ci img{max-width:32px;max-height:32px;object-fit:contain}
.it input[data-f=c],.it .pr{font-size:calc(var(--fs) - 2px)} /* 화폐 박스: theme.css 입력칸 기본(--fs-1 = 15px)보다 1px 작은 14px */
.step .it input.pr.man{color:var(--man);filter:saturate(var(--man-sat))} /* 직접 입력한 가격 (시세 파일 값이 아닐 때) */
.it .pr{text-align:right;padding-inline:8px;font-variant-numeric:tabular-nums}
.add{display:block;width:calc(100% - 224px);background:none;border:0;padding:1px 0;color:var(--g);font:600 13px var(--sans);text-align:center;cursor:pointer} /* 224px = 재화 줄(.it)에서 이름 칸을 뺀 나머지 열(32+72+60+28)과 간격(8×4) → 이름 박스와 같은 폭·같은 가운데 */
.add:hover:not(:disabled){text-decoration:underline}
.add:disabled{opacity:.4;cursor:default}
/* 잠긴 단계: 입력칸은 disabled(포커스 불가), 글자색은 읽기 좋게 유지, 자물쇠 버튼은 강조색 */
.ib.lock[aria-pressed=true]{color:var(--g)}
/* 자물쇠: 아이콘을 키우고(15→18px), 버튼 안에서 가로·세로 정확히 가운데 */
.ib.lock{display:grid;place-items:center;padding:0}
.ib.lock svg{display:block;width:18px;height:18px}
.step.lk input:disabled,.step.lk textarea:disabled{color:var(--ink);opacity:.75;cursor:default}
.ib:disabled{opacity:.35;cursor:default}
/* 단계 순서 끌기 */
.gr{flex:none;width:24px;height:26px;margin-left:-6px;padding:0;border:0;border-radius:var(--r);background:none;color:var(--mute);cursor:grab;display:grid;place-items:center;touch-action:none}
.gr:hover{color:var(--ink);background:var(--sf2)}
.step{transition:transform .15s}
.step.dragging{transition:none;z-index:5;background:linear-gradient(var(--sf),var(--sf)),var(--bg); /* 뒤 단계가 비치지 않도록 불투명 바탕 위에 */box-shadow:0 8px 24px color-mix(in oklab,#000 40%,transparent)}
.dnd,.dnd *{cursor:grabbing!important;user-select:none!important}
/* 재화 줄 순서 끌기: 손잡이(.rg)는 줄 왼쪽 여백(.sb 의 padding)에 띄워 두므로 칸 배치와 "+ 추가" 정렬은 그대로 */
.it{position:relative;transition:transform .15s}
.rg{position:absolute;left:-14px;top:0;width:14px;height:100%;padding:0;border:0;border-radius:var(--r);background:none;color:var(--mute);opacity:.55;cursor:grab;display:grid;place-items:center;touch-action:none;transition:opacity .15s,color .15s}
.rg svg{display:block;width:14px;height:14px}
.it:hover .rg,.rg:hover:not(:disabled){opacity:1}
.rg:hover:not(:disabled){color:var(--ink)}
.rg:disabled{opacity:.25;cursor:default}
.it.dragging{transition:none;z-index:5;background:linear-gradient(var(--sf),var(--sf)),var(--bg);box-shadow:0 6px 18px color-mix(in oklab,#000 40%,transparent)}
.step textarea{display:block;width:100%;min-height:40px;margin-top:8px;padding:6px 8px;border:1px dashed var(--ln2);border-radius:var(--r);background:color-mix(in oklab,var(--ink) 4%,transparent);color:var(--ink);font:inherit;font-size:14px;resize:none;overflow:hidden}
.addstep{width:100%;margin-left:46px;width:calc(100% - 46px);padding:9px 10px;border:1px dashed var(--ln2);border-radius:var(--r);background:none;color:var(--mute);font:600 14px var(--sans);cursor:pointer}
.addstep:hover{color:var(--g);border-color:var(--g)}
.big{padding:2px 0 4px}
.big b{font:700 38px/1.15 "Nanum Myeongjo",serif;color:var(--g);font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;white-space:nowrap}.big b u{text-decoration:none;font:700 14px "Nanum Myeongjo",serif;letter-spacing:0;margin-left:6px}
.sc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0 5px;font:400 14px/1.5 var(--sans);font-variant-numeric:tabular-nums}
.sc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc b{font:inherit;white-space:nowrap} /* 비용: 단계 이름과 같은 글꼴·크기·기준선 (볼드 없이) */
.ti img{max-width:28px;max-height:28px;object-fit:contain;vertical-align:middle}
.side fieldset{margin-top:16px}
.psrc:not(.ready){visibility:hidden} /* 항목·폰트가 준비돼 폭이 확정되기 전에는 숨김 */
.psrc{box-sizing:border-box;width:max-content;min-width:150px;max-width:none;height:36px;margin:0;padding:0 10px;border:1px solid var(--ln2);border-radius:var(--r);background:var(--sf);color:var(--mute);font:500 14px/1 var(--sans);letter-spacing:-.01em} /* 총 재화 위 시세 선택 드롭다운 (높이·글꼴은 위쪽 버튼 줄과 동일) */
#tot td:last-child{white-space:nowrap} /* 비용 칸(숫자 + D)은 줄바꿈하지 않음 */
.ghead.sm>div:last-child{flex:1;min-width:0}
.ghead.sm{position:relative}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.ghead .ext{white-space:nowrap;text-decoration:none;font-size:13px;color:var(--mute)}
.exts{display:flex;align-items:center;gap:12px}
.exts .ext+.ext{margin-left:8px} /* PoE2DB와 Craft of Exile 사이 추가 간격 */
.exts select{max-width:150px;height:24px;padding:0 6px;border:1px solid var(--ln2);border-radius:var(--r);background:var(--sf);color:var(--mute);font:500 13px var(--sans)}
.subrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px}
.subrow .sub{margin:0}
#pinfo{margin:0;margin-left:auto;text-align:right;white-space:nowrap}
/* Tab 으로 이동할 때 나타나는 포커스 표시(테두리·그림자) 제거 */
*:focus,*:focus-visible{outline:none!important;box-shadow:none!important}
button::-moz-focus-inner{border:0}
*{-webkit-tap-highlight-color:transparent}
/* 재화 자동완성 목록: 브라우저 기본 자동완성 목록과 같은 모양 (둥근 어두운 패널, 알약형 항목, 어두운 스크롤바) */
.ac{position:fixed;z-index:1000;width:max-content;min-width:180px;max-width:calc(100vw - 16px);overflow-y:auto;box-sizing:border-box;padding:8px;border:1px solid #3d3c4b;border-radius:16px;background:#2b2a38;box-shadow:0 6px 20px rgba(0,0,0,.45)}
/* 스크롤바: 위·아래를 코너 곡선에서 띄우고 막대 끝을 둥글게 */
.ac::-webkit-scrollbar{width:14px}
.ac::-webkit-scrollbar-track{background:transparent;margin:12px 0}
.ac::-webkit-scrollbar-thumb{background:#8e8d9b;border:3px solid transparent;border-radius:8px;background-clip:content-box}

<body>
<main class="wrap" id="app"></main>
<script src="price-history/crafting-currency-prices.js"></script>
<script src="recipe/index.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let LANG=(window.PoEPrefs&&PoEPrefs.lang)||document.documentElement.lang||"ko";
const T=(ko,en)=>LANG==="en"?en:ko;
const fmtD=n=>{n=+n;const L=LANG==="en"?"en-US":"ko-KR";if(n>0&&n<1&&Math.round(n*10)>0&&Math.round(n*10)<10)return(Math.round(n*10)/10).toLocaleString(L,{minimumFractionDigits:1,maximumFractionDigits:1});return Math.round(n).toLocaleString(L)}; /* 디바인 단위는 정수, 단 0 초과 1 미만은 소수점 한 자리 */
const fmtT=n=>{n=+n;const r=Math.round(n*10)/10;return r>0&&r<10?r.toLocaleString(LANG==="en"?"en-US":"ko-KR",{maximumFractionDigits:1}):fmtD(n)}; /* 총 비용: 0 초과 10 미만은 소수점 한 자리까지 */
const fmt=n=>{n=+n;const a=Math.abs(n);return n.toLocaleString(LANG==="en"?"en-US":"ko-KR",{maximumFractionDigits:a>0&&a<0.01?6:a<1?3:2})};

/* 재화 목록(자동완성용, 직접 입력도 가능). 시세 파일을 읽으면 그 안의 재화도 목록에 추가됩니다. 한글 이름은 아래 KO_LOCAL 에 적거나, 시세 파일(names_ko)로 받아옵니다. */
const CUR=["Divine Orb","Exalted Orb","Chaos Orb","Orb of Annulment","Regal Orb","Orb of Alchemy","Orb of Augmentation","Orb of Transmutation","Vaal Orb","Orb of Chance"];
/* 이름 정규화: 대소문자·공백·하이픈·아포스트로피 차이를 무시 ("Greater Exalted Orb" = "greater-exalted-orb") */
const nk=n=>String(n).trim().toLowerCase().replace(/['’]/g,"").replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-+|-+$/g,"");
const SPECIAL={"hinekoras-lock":"Hinekora's Lock","uul-netols-catalyst":"Uul-Netol's Catalyst","xophs-catalyst":"Xoph's Catalyst","tuls-catalyst":"Tul's Catalyst","eshs-catalyst":"Esh's Catalyst","chayulas-catalyst":"Chayula's Catalyst"};
/* 시세 파일의 슬러그 키(greater-exalted-orb)를 표시 이름(Greater Exalted Orb)으로 */
const pretty=k=>/[A-Z\s]/.test(k)?k:SPECIAL[k]||k.split("-").map((w,i)=>i&&(w==="of"||w==="the")?w:w.charAt(0).toUpperCase()+w.slice(1)).join(" ");
/* 한글 이름: 영어 이름 → 한글 이름.
   · 시세 파일(crafting-currency-prices.js 의 names_ko)에 들어 있는 한글명이 자동으로 쓰입니다 (파이썬 스크립트 CURRENCIES 에서 영어 이름 오른쪽에 적은 것).
   · 파일 없이 직접 추가하려면 KO_LOCAL 에 적으세요. 같은 이름이면 KO_LOCAL 이 우선합니다.
     예) const KO_LOCAL={"Divine Orb":"디바인 오브","Chaos Orb":"카오스 오브"};
   한글 이름으로 입력해도 같은 재화로 인식되고(단가·아이콘 포함), 소모 재화 표와 자동완성에 한글이 표시됩니다. */
const KO_LOCAL={};
let KO_FILE={},KO={},KO2EN=new Map();
function buildKo(){
  KO={};KO2EN=new Map();
  Object.entries({...KO_FILE,...KO_LOCAL}).forEach(([en,ko])=>{ko=String(ko||"").trim();if(!ko)return;KO[nk(en)]=ko;KO2EN.set(nk(ko),pretty(en))});
}
const koName=c=>KO[nk(c)]||"";
const canon=c=>{c=String(c).trim();return KO2EN.get(nk(c))||c}; /* 한글 이름이면 영어 이름으로 */
const disp=c=>LANG==="en"?c:(koName(c)||c);
let EXTRA=[],KNOWN=new Set();
/* 입력칸의 값이 이미 목록에 있는 재화 이름(영어·한글)과 같으면 "완성된 이름" 으로 보고, 자동완성 목록(datalist)을 연결하지 않습니다. */
const isKnown=v=>{const k=nk(v);return !!k&&KNOWN.has(k)};
/* ── 검색용 정규화 ──
   · 대소문자·공백·하이픈·아포스트로피를 무시하고, 한글은 자모 단위로 풀어서 비교합니다.
     (입력 도중의 "디ㅂ" 같은 조합 중 글자도 "디바인" 과 맞고, "ㄷㅂㅇ" 같은 초성 검색도 됩니다.) */
const JI="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ",JM="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ",JF=[""].concat([..."ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ"]);
const JX={"ㄳ":"ㄱㅅ","ㄵ":"ㄴㅈ","ㄶ":"ㄴㅎ","ㄺ":"ㄹㄱ","ㄻ":"ㄹㅁ","ㄼ":"ㄹㅂ","ㄽ":"ㄹㅅ","ㄾ":"ㄹㅌ","ㄿ":"ㄹㅍ","ㅀ":"ㄹㅎ","ㅄ":"ㅂㅅ","ㅘ":"ㅗㅏ","ㅙ":"ㅗㅐ","ㅚ":"ㅗㅣ","ㅝ":"ㅜㅓ","ㅞ":"ㅜㅔ","ㅟ":"ㅜㅣ","ㅢ":"ㅡㅣ"};
const jx=j=>JX[j]||j;
const flat=s=>{let o="";for(const ch of String(s)){const c=ch.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3){const k=c-0xAC00;o+=jx(JI[(k/588)|0])+jx(JM[((k%588)/28)|0])+jx(JF[k%28])}else o+=jx(ch)}return o};
const cho=s=>{let o="";for(const ch of String(s)){const c=ch.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3)o+=JI[((c-0xAC00)/588)|0]}return o};
const norm=s=>flat(String(s).toLowerCase().replace(/['’]/g,"").replace(/[^\p{L}\p{N}]+/gu," ")).trim();
let ALL=[]; /* 자동완성 후보: {en, ko, h(검색용 문자열), cho(한글 초성)} */
function fillCur(extra){
  if(extra)EXTRA=extra;
  const m=new Map();[...CUR,...EXTRA].forEach(c=>{const k=nk(c);if(k&&!m.has(k))m.set(k,c)});
  KNOWN=new Set([...m.keys(),...KO2EN.keys()]);
  ALL=[...m.values()].map(en=>{const ko=koName(en);return{en,ko,h:norm(en+" "+ko),cho:cho(ko)}});
}
buildKo();fillCur();

/* 가격: 재화 이름 → 디바인 단가.
   AUTO   = 시세 파일(crafting-currency-prices.json)에서 읽은 값 (이름은 nk()로 정규화)
   PRICES = 사용자가 직접 입력한 값 (브라우저에 저장, AUTO보다 우선) */
const PRICE_URL="price-history/crafting-currency-prices.json"; /* 이 HTML 기준 상대 경로 */
let PRICES={};try{PRICES=JSON.parse(localStorage.getItem("craftPrices")||"{}")}catch(e){}
let AUTO={},META=null,PERR="";
let LATEST=null,PSEL="latest",HIST=[],PRDY=false; /* LATEST = 최신(ninja) 시세 파일 내용, PSEL = 드롭다운에서 고른 시세("latest" 또는 "리그|일차"), HIST = 과거(scout) 시세 [{league,source,start,days:{일차:{date,prices}}}] */
/* 레시피 안에 저장되는 직접 입력 단가(R.prices). 이름은 정규화(nk)해서 비교하므로 대소문자·한글/영어 이름 차이가 있어도 같은 재화로 봅니다. */
const ovKey=c=>{const k=nk(canon(c));return Object.keys(R.prices||{}).find(x=>nk(canon(x))===k)};
const manual=c=>{c=canon(c);const k=ovKey(c);if(k!==undefined&&R.prices[k]>0)return R.prices[k];return typeof PRICES[c]==="number"&&PRICES[c]>0?PRICES[c]:null};
const auto=c=>{const v=AUTO[nk(canon(c))];return typeof v==="number"&&v>0?v:null};
const price=c=>nk(canon(c))==="divine-orb"?1:(manual(c)??auto(c));
function setPrices(o){
  if(!o||typeof o.prices!=="object"||!o.prices)throw new Error(T("시세 파일 형식이 올바르지 않습니다.","Invalid price file."));
  if(o.quote_currency&&nk(o.quote_currency)!=="divine-orb")throw new Error(T("디바인 오브 기준 시세가 아닙니다.","Prices are not quoted in Divine Orbs."));
  const a={};Object.entries(o.prices).forEach(([k,v])=>{if(typeof v==="number"&&v>0)a[nk(k)]=v});
  AUTO=a;META={source:o.source||"",league:o.league||"",at:o.generated_at||""};PERR="";
  LATEST=o;PSEL="latest";const ps=$("psrc");if(ps)ps.value="latest";
  KO_FILE=o.names_ko&&typeof o.names_ko==="object"?o.names_ko:{};buildKo();
  fillCur([...Object.keys(o.prices).map(pretty),...Object.keys(KO_FILE).map(pretty),...(Array.isArray(o.missing)?o.missing:[])]);
}
function priceInfo(){
  const el=$("pinfo");if(!el)return;
  if(META&&META.label)el.textContent=META.label;
  else if(META){
    const t=new Date(META.at),d=META.at&&!isNaN(t)?t.toLocaleString(LANG==="en"?"en-US":"ko-KR",{dateStyle:"medium",timeStyle:"short"}):"";
    el.textContent=d?"Update: "+d:"";
  }else el.textContent=PERR?T(`시세 파일을 읽지 못했습니다 (${PERR})`,`Could not read the price file (${PERR})`):T("시세를 불러오는 중…","Loading prices…");
}
/* ── 과거(scout) 시세 ──
   HISTORY_FILES 의 파일을 차례로 <script> 로 읽습니다(file:// 에서도 동작). 파일을 추가하려면 아래 목록에 적으세요.
   각 파일은 파이썬(crafting-currency-history-scout.py)이 만든 window.CRAFT_PRICES_HISTORY = {league, days:{일차:{date,prices}}} 형식이며,
   같은 리그의 파일은 합쳐지고 같은 일차는 나중에 읽은 파일이 우선합니다. 없는 파일은 건너뜁니다. 한글 이름은 항상 최신 시세 파일(names_ko)을 씁니다. */
const HISTORY_FILES=[
	"price-history/crafting-currency-prices-Forbidden_Rites-day7.js",
	"price-history/crafting-currency-prices-Forbidden_Rites-day15.js",
	"price-history/crafting-currency-prices-Forbidden_Rites-day30.js",
	"price-history/crafting-currency-prices-Runes_of_Aldur-day7.js",
	"price-history/crafting-currency-prices-Runes_of_Aldur-day15.js",
	"price-history/crafting-currency-prices-Runes_of_Aldur-day30.js",
	"price-history/crafting-currency-prices-Rise_of_the_Abyssal-day7.js",
	"price-history/crafting-currency-prices-Rise_of_the_Abyssal-day15.js",
	"price-history/crafting-currency-prices-Rise_of_the_Abyssal-day30.js",
];
function addHist(h){
  if(!h||typeof h.league!=="string"||!h.days||typeof h.days!=="object")return;
  if(h.quote_currency&&nk(h.quote_currency)!=="divine-orb")return; /* 디바인 기준이 아니면 건너뜀 */
  let x=HIST.find(e=>e.league===h.league);
  if(!x){x={league:h.league,source:h.source||"poe2scout",start:h.league_start||"",days:{}};HIST.push(x)}
  Object.entries(h.days).forEach(([n,d])=>{if(d&&d.prices&&typeof d.prices==="object")x.days[n]={date:d.date||"",prices:d.prices}});
}
function loadHistory(){
  const one=src=>new Promise(ok=>{
    const s=document.createElement("script");s.src=src;
    s.onload=()=>{const h=window.CRAFT_PRICES_HISTORY;delete window.CRAFT_PRICES_HISTORY;addHist(h);s.remove();ok()};
    s.onerror=()=>{s.remove();ok()};
    document.head.appendChild(s);
  });
  return HISTORY_FILES.reduce((p,f)=>p.then(()=>one(f)),Promise.resolve()).then(fillPsrc);
}
const psrcOpts=()=>`<option value="latest"${PSEL==="latest"?" selected":""}>${T("최신 (2026-11-22)","Latest (2026-11-22)")}</option>`+[...HIST].sort((a,b)=>(b.start||"").localeCompare(a.start||"")).map(h=>`<optgroup label="${esc(h.league)}">`+Object.keys(h.days).sort((a,b)=>b-a).map(n=>{const v=h.league+"|"+n;return`<option value="${esc(v)}"${v===PSEL?" selected":""}>${esc(h.league)} · ${T(n+"일","Day "+n)}</option>`}).join("")+`</optgroup>`).join("");
const fillPsrc=()=>{const el=$("psrc");if(el)el.innerHTML=psrcOpts();(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{PRDY=true;const e=$("psrc");if(e)e.classList.add("ready")})};
function selectPrices(v){
  if(v==="latest"){if(!LATEST){const el=$("psrc");if(el)el.value=PSEL;return}setPrices(LATEST);priceInfo();upd();return}
  const k=v.lastIndexOf("|"),lg=v.slice(0,k),dy=v.slice(k+1),h=HIST.find(e=>e.league===lg),d=h&&h.days[dy];
  if(!d)return;
  const a={};Object.entries(d.prices).forEach(([n,p])=>{if(typeof p==="number"&&p>0)a[nk(n)]=p});
  AUTO=a;PERR="";PSEL=v;
  META={source:h.source,league:h.league,at:"",label:`${h.source} · ${h.league} · ${T(dy+"일차","Day "+dy)}${d.date?" ("+d.date+")":""}`};
  priceInfo();upd();
}
async function loadPrices(){
  try{
    if(window.CRAFT_PRICES)setPrices(window.CRAFT_PRICES); /* crafting-currency-prices.js (file:// 에서도 동작) */
    else{const r=await fetch(PRICE_URL,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);setPrices(await r.json())}
  }catch(e){PERR=e.message||"error"}
  priceInfo();upd();
}

/* ── PoE2DB 아이템 타입 목록 (헤더 드롭다운) ──
   목록을 고치려면 아래 줄을 추가·삭제·수정하세요. 형식: ["드롭다운에 보일 이름","poe2db 주소의 영문 이름"]
   → 선택 시 https://poe2db.tw/kr/<영문 이름>#ModifiersCalc 로 이동합니다. 미선택이면 https://poe2db.tw/kr/Modifiers */
const MOD_TYPES=[
  ["한손 무기",[["클로","Claws"],["단검","Daggers"],["마법봉","Wands"],["한손 검","One_Hand_Swords"],["한손 도끼","One_Hand_Axes"],["한손 철퇴","One_Hand_Maces"],["셉터","Sceptres"],["창","Spears"],["도리깨","Flails"]]],
  ["양손 무기",[["활","Bows"],["지팡이","Staves"],["양손 검","Two_Hand_Swords"],["양손 도끼","Two_Hand_Axes"],["양손 철퇴","Two_Hand_Maces"],["육척봉","Quarterstaves"],["쇠뇌","Crossbows"],["덫","Traps"],["부적","Talismans"]]],
  ["장신구·허리띠",[["목걸이","Amulets"],["반지","Rings"],["허리띠","Belts"]]],
  ["투구",[["투구(str)","Helmets_str"],["투구(dex)","Helmets_dex"],["투구(int)","Helmets_int"],["투구(str_dex)","Helmets_str_dex"],["투구(str_int)","Helmets_str_int"],["투구(dex_int)","Helmets_dex_int"]]],
  ["갑옷",[["갑옷(str)","Body_Armours_str"],["갑옷(dex)","Body_Armours_dex"],["갑옷(int)","Body_Armours_int"],["갑옷(str_dex)","Body_Armours_str_dex"],["갑옷(str_int)","Body_Armours_str_int"],["갑옷(dex_int)","Body_Armours_dex_int"],["갑옷(str_dex_int)","Body_Armours_str_dex_int"]]],
  ["장갑",[["장갑(str)","Gloves_str"],["장갑(dex)","Gloves_dex"],["장갑(int)","Gloves_int"],["장갑(str_dex)","Gloves_str_dex"],["장갑(str_int)","Gloves_str_int"],["장갑(dex_int)","Gloves_dex_int"]]],
  ["장화",[["장화(str)","Boots_str"],["장화(dex)","Boots_dex"],["장화(int)","Boots_int"],["장화(str_dex)","Boots_str_dex"],["장화(str_int)","Boots_str_int"],["장화(dex_int)","Boots_dex_int"]]],
  ["보조 장비",[["화살통","Quivers"],["방패(str)","Shields_str"],["방패(str_dex)","Shields_str_dex"],["방패(str_int)","Shields_str_int"],["버클러","Bucklers"],["집중구","Foci"]]],
  ["주얼",[["루비","Ruby"],["에메랄드","Emerald"],["사파이어","Sapphire"],["다이아몬드","Diamond"],["오래된 루비","Time-Lost_Ruby"],["오래된 에메랄드","Time-Lost_Emerald"],["오래된 사파이어","Time-Lost_Sapphire"],["오래된 다이아몬드","Time-Lost_Diamond"]]],
  ["플라스크",[["생명력 플라스크","Life_Flasks"],["마나 플라스크","Mana_Flasks"],["호신부","Charms"]]],
  ["유물",[["단지 유물","Urn_Relic"],["손잡이 항아리 유물","Amphora_Relic"],["화병 유물","Vase_Relic"],["인장 유물","Seal_Relic"],["궤짝 유물","Coffer_Relic"],["융단 유물","Tapestry_Relic"],["향 유물","Incense_Relic"]]],
  ["서판",[["균열 서판","Breach_Tablet"],["탐험 서판","Expedition_Tablet"],["환영 서판","Delirium_Tablet"],["의식 서판","Ritual_Tablet"],["방사능 노출 서판","Irradiated_Tablet"],["감독관 서판","Overseer_Tablet"],["심연 서판","Abyss_Tablet"],["사원 서판","Temple_Tablet"]]]
];
const modUrl=s=>"https://poe2db.tw/kr/"+(s?s+"#ModifiersCalc":"Modifiers");
let MODSEL=""; /* 드롭다운에서 고른 타입 (화면을 다시 그려도 유지) */
const modOpts=()=>`<option value="">${T("아이템 타입","Item type")}</option>`+MOD_TYPES.map(([g,l])=>`<optgroup label="${esc(g)}">${l.map(([n,s])=>`<option value="${esc(s)}"${s===MODSEL?" selected":""}>${esc(n)}</option>`).join("")}</optgroup>`).join("");

const newStep=()=>({title:"",note:"",items:[{c:"",n:1}]});
let R={name:"",prices:{},steps:[newStep()]},LIST=null;

const totals=items=>{const m=new Map();items.forEach(it=>{const c=canon(it.c);if(c&&it.n>0)m.set(c,(m.get(c)||0)+it.n)});return m};
/* 재화 이름 없이 가격 칸에 직접 적은 비용(it.p, 디바인 정수)도 비용에 더함. 이름을 적으면 그 재화의 단가로 옮겨지고 it.p 는 지워짐(commitName) */
const extraCost=items=>items.reduce((a,it)=>it.p>0?a+it.p:a,0);
const cost=(m,items=[])=>{let sum=extraCost(items);m.forEach((n,c)=>{const p=price(c);if(p!=null)sum+=n*p});return{sum}};

const line=s=>{const m=totals(s.items);return m.size?[...m].map(([c,n])=>`${disp(c)} ×${fmt(n)}`).join(" · ")+" = "+cs(cost(m,s.items)):T("입력된 재화 없음","No currency yet")};

function iconUrl(n){ /* poetools\poe2\icon\<소문자-하이픈 이름>.webp|png|svg|jpg  예: divine-orb.webp */
  n=canon(n);const k=isl(n);if(!k)return Promise.resolve(null);
  const ks=[...new Set([k,nk(n)])];
  if(!IMG.has(k))IMG.set(k,Promise.all(ks.flatMap(q=>["webp","png","svg","jpg"].map(e=>new Promise(ok=>{const u="../icon/"+encodeURIComponent(q)+"."+e,im=new Image();im.onload=()=>ok(u);im.onerror=()=>ok(null);im.src=u})))).then(r=>r.find(Boolean)||null));
  return IMG.get(k);
}

/* 소모 재화 표의 재화 칸: 아이콘 이미지만 표시 (아이콘 파일이 없는 재화만 이름 텍스트로 대신 표시) */
const TIC=new Map(); /* 재화 이름 → 아이콘 주소 (없으면 null) */
const totCell=c=>{if(!TIC.has(c))return "";const u=TIC.get(c),nm=disp(c);return u?`<img src="${u}" alt="${esc(nm)}" title="${esc(nm)}">`:esc(nm)};
function totIcons(){
  clearTimeout(totIcons.t);
  totIcons.t=setTimeout(()=>document.querySelectorAll("#tot .ti").forEach(el=>{
    const c=el.dataset.n;if(TIC.has(c))return;
    iconUrl(c).then(u=>{TIC.set(c,u);document.querySelectorAll("#tot .ti").forEach(e=>{if(e.dataset.n===c)e.innerHTML=totCell(c)})});
  }),250);
}
function renderTot(){
  const all=R.steps.filter(s=>!s.collapsed).flatMap(s=>s.items),tot=totals(all); /* 접힌 단계는 계산에서 제외 */
  /* 재화 이름이 빈 줄: 비용(it.p)을 적은 줄만, 줄마다 따로 표시 (이름 칸은 빈 값, 수량·비용은 입력값 그대로). 비용 없이 수량만 있는 빈 줄은 표에 넣지 않음 */
  /* 행마다 비용(v)을 계산해 비용 내림차순으로 정렬 (단가를 모르는 재화는 맨 아래). 이름 없이 비용만 적은 줄도 같은 기준으로 섞어서 정렬 */
  const rows=[...tot].map(([c,n])=>{const p=price(c),v=p==null?null:n*p;return{v,n,c}}).filter(r=>r.v==null||r.v>0); /* 비용이 0이 아니면 표시: 정수로 반올림(fmtD)했을 때 0 D 가 되더라도 행을 숨기지 않고 "0 D" 로 표기 */
  all.forEach(it=>{if(!it.c.trim()&&it.p>0)rows.push({v:it.p,n:it.n,c:null})}); /* 재화 이름이 빈 줄: 비용(it.p)을 적은 줄만, 줄마다 따로 표시 (이름 칸은 빈 값). 비용 없이 수량만 있는 빈 줄은 표에 넣지 않음 */
  rows.sort((a,b)=>(b.v==null?-Infinity:b.v)-(a.v==null?-Infinity:a.v));
  const trs=rows.map(r=>`<tr>${r.c==null?"<td></td>":`<td class="ti" data-n="${esc(r.c)}">${totCell(r.c)}</td>`}<td>${fmt(r.n)}</td><td>${r.v==null?"—":fmtD(r.v)+" D"}</td></tr>`).join("");
  $("tot").innerHTML=rows.length?`<table><thead><tr><th>${T("재화","Currency")}</th><th>${T("수량","Qty")}</th><th>${T("비용","Cost")}</th></tr></thead><tbody>${trs}</tbody></table>`:`<p class="note">${T("재화를 입력하면 표시됩니다.","Currencies you add will appear.")}</p>`;
  totIcons();
}
/* 입력값에 따라 숫자만 갱신 (입력 중인 칸은 건드리지 않음) */
function sums(skip){
  const all=R.steps.filter(s=>!s.collapsed).flatMap(s=>s.items),tot=totals(all),g=cost(tot,all); /* 접힌 단계는 계산에서 제외 */
  $("gv").innerHTML=`${fmtT(g.sum)}<u>Div</u>`;
  const costs=R.steps.map(s=>cost(totals(s.items),s.items));
  document.querySelectorAll(".step").forEach((el,i)=>{
    el.querySelector(".sc2").textContent=R.steps[i].collapsed?"—":cs(costs[i]);
    el.querySelectorAll(".it").forEach((r,j)=>{
      const it=R.steps[i].items[j],c=it.c.trim(),b=r.querySelector(".pr"),p=c?price(c):null; /* 가격 칸은 항상 수정 가능 (잠긴 단계만 readonly) */
      const raw=c&&p!=null&&it.n>0?it.n*p:0,rc=Math.round(it.p>0?it.p:raw); /* 디바인은 기본 정수. it.p = 이름 없이 직접 적은 비용 */
      const man=it.p>0||(!!c&&nk(canon(c))!=="divine-orb"&&manual(c)!=null); /* 이름 없이 적은 비용, 또는 레시피·브라우저에 저장된 직접 입력 단가 */
      b.classList.toggle("man",man);b.title=man?T("직접 입력한 가격","Manually entered price"):"";
      const v2=Math.round((it.p>0?it.p:raw)*100)/100; /* 직접 입력한 가격은 소수점 둘째 자리까지 그대로 표시 */
      if(b!==skip)b.value=man?(v2>0?String(v2):c?"0":""):rc>=1?String(rc):raw>0&&raw<1?fmtD(raw):c?"0":""; /* 재화를 적은 줄만 1D 미만을 0으로 표시, 빈 줄은 빈칸 */
    });
  });
  $("stepcost").innerHTML=R.steps.map((s,i)=>s.collapsed?"":`<div class="sc"><span>${esc(s.title||T("단계","Step"))}</span><b>${fmtD(costs[i].sum)} D</b></div>`).join(""); /* 접힌 단계는 목록에서 생략 */
}
/* 노트 칸 높이를 내용에 맞춰 자동으로 늘리고 줄입니다 (입력, 불러오기, 창 크기·글꼴 변경 시) */
const fitNote=t=>{t.style.height="auto";t.style.height=(t.scrollHeight+t.offsetHeight-t.clientHeight)+"px"};
const fitNotes=()=>document.querySelectorAll(".step textarea").forEach(fitNote);
const refresh=()=>{renderSteps();renderTot();sums();icons();fitNotes()};
const upd=()=>{renderTot();sums()};
/* 단계 줄의 비용 입력칸(정수 디바인) → 이 재화의 단가 = 입력값 ÷ 수량 을 이 레시피(R.prices)에 저장. 비우면 직접 입력이 해제되어 시세 파일 값으로 돌아갑니다. */
function setRowPrice(t){
  const row=t.closest(".it"),it=R.steps[+row.closest(".step").dataset.i].items[+row.dataset.j],c=canon(it.c);
  if($("msg").textContent===T("디바인은 소수점 둘째 자리까지 입력합니다.","Divine amounts allow up to 2 decimals."))msg("");
  let d=t.value.replace(/,/g,"").replace(/[^\d.].*$/,""),[ip,fp]=d.split("."); /* 숫자·소수점이 아닌 글자를 만나면 거기서 자름 (기존 동작 유지) */ /* 숫자와 소수점 하나만, 소수점 이하는 둘째 자리까지 */
  ip=ip.replace(/^0+(?=\d)/,"").slice(0,7);if(fp!==undefined&&!ip)ip="0";
  d=fp===undefined?ip:ip+"."+fp.slice(0,2);
  if(d!==t.value)t.value=d;
  const v=Math.round(parseFloat(d)*100)/100;
  if(!c){ /* 재화 이름 없이 비용만 적은 줄: 그 줄 자체에 저장 (이름을 적으면 commitName 이 단가로 옮김) */
    if(v>0)it.p=v;else delete it.p;
    renderTot();sums(t);return;
  }
  if(nk(c)==="divine-orb")return; /* 디바인은 단가 1 고정 → 저장할 단가 없음, 칸을 벗어나면 계산값으로 돌아감 */
  delete it.p;
  R.prices=R.prices||{};
  const old=ovKey(c);if(old!==undefined)delete R.prices[old];
  if(v>0)R.prices[c]=Math.round(v/(it.n>0?it.n:1)*1e6)/1e6;
  else if(PRICES[c]!==undefined){delete PRICES[c];try{localStorage.setItem("craftPrices",JSON.stringify(PRICES))}catch(x){}} /* 비우면 브라우저에 남은 옛 직접 입력 단가도 함께 해제 */
  renderTot();sums(t);
}
/* 가격을 먼저 적고 나중에 재화 이름을 적은 경우: 적어 둔 비용을 그 재화의 단가(비용 ÷ 수량)로 옮김 */
function commitName(t){
  const row=t.closest(".it");if(!row)return;
  const it=R.steps[+row.closest(".step").dataset.i].items[+row.dataset.j],c=canon(it.c);
  if(!c||!(it.p>0))return;
  if(nk(c)!=="divine-orb"){
    R.prices=R.prices||{};
    const old=ovKey(c);if(old!==undefined)delete R.prices[old];
    R.prices[c]=Math.round(it.p/(it.n>0?it.n:1)*1e6)/1e6;
  }
  delete it.p;upd();
}

/* 저장 / 불러오기 */
const slug=n=>(n||"").trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"-").replace(/^-+|-+$/g,"")||"recipe";
const json=()=>{
  const used=new Set(R.steps.flatMap(s=>s.items).map(it=>nk(canon(it.c))).filter(Boolean)),pr={};
  Object.entries(R.prices||{}).forEach(([k,v])=>{if(v>0&&used.has(nk(canon(k))))pr[k]=v});
  return JSON.stringify({v:1,name:R.name,steps:R.steps.map(({locked,collapsed,...s})=>({...s,...(locked?{locked:true}:{}),...(collapsed?{collapsed:true}:{})})),...(Object.keys(pr).length?{prices:pr}:{})},null,2);
};
/* 레시피 파일과 목록 파일은 <script> 로 읽는 .js 형식입니다 (file:// 로 열어도 동작).
   recipe/<이름>.js : window.CRAFT_RECIPE = {레시피};
   recipe/index.js  : window.CRAFT_RECIPE_INDEX = [{"file":"<이름>.js","name":"표시 이름"}, ...]; */
const recipeJs=()=>"window.CRAFT_RECIPE = "+json()+";\n";
const indexJs=idx=>"window.CRAFT_RECIPE_INDEX = "+JSON.stringify(idx,null,2)+";\n";
/* "window.X = {...};" 형태 또는 순수 JSON 텍스트 → 값 (코드를 실행하지 않고 JSON 으로만 해석) */
const parseJs=t=>{t=String(t).replace(/^\uFEFF/,"").trim();const m=t.match(/^window\.\w+\s*=\s*([\s\S]*?);?$/);return JSON.parse(m?m[1]:t)};
const UNDO=[]; /* 되돌리기 기록: 동작마다 "그 동작을 취소하는 함수"를 쌓아 두고 Ctrl+Z 가 마지막부터 하나씩 실행 */
let LOADED=null; /* 최근에 불러오거나 저장한 레시피 파일 이름 (초기화하면 해제) */
const recipeFile=()=>{const f=LOADED?LOADED.replace(/\.[^.]*$/,""):slug(R.name);return (f==="index"?"index-recipe":f)+".js"}; /* 불러온 파일이 있으면 그 이름으로 저장. index.js(목록)를 덮어쓰지 않도록 */
function download(){

  a.href=URL.createObjectURL(new Blob([recipeJs()],{type:"text/javascript"}));a.download=file;a.click();URL.revokeObjectURL(a.href);LOADED=file;

/* 저장 폴더(recipe)를 처음 한 번만 고르면 브라우저(IndexedDB)가 기억합니다. 이후엔 누르기만 하면 바로 저장. */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("poeCraftDir",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idbGet=async()=>{const d=await idb();return new Promise((ok,no)=>{const q=d.transaction("h").objectStore("h").get("dir");q.onsuccess=()=>ok(q.result||null);q.onerror=()=>no(q.error)})};
const idbSet=async h=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction("h","readwrite");t.objectStore("h").put(h,"dir");t.oncomplete=()=>ok();t.onerror=()=>no(t.error)})};
let DIR=null;
async function getDir(){
  if(!DIR){try{DIR=await idbGet()}catch(e){}}
  if(DIR){
    try{
      let p=await DIR.queryPermission({mode:"readwrite"});
      if(p!=="granted")p=await DIR.requestPermission({mode:"readwrite"});
      if(p==="granted")return DIR;
    }catch(e){}
    DIR=null;
  }
  DIR=await showDirectoryPicker({mode:"readwrite",id:"poe-craft"});
  try{await idbSet(DIR)}catch(e){}
  return DIR;
}
/* 목록 정렬: 최근에 저장한 레시피가 맨 위 (at = 저장 시각). at 이 없는 옛 항목은 원래 순서대로 그 아래에 둠 */
const byRecent=(a,b)=>(+b.at||0)-(+a.at||0);
async function save(){
  if(!window.showDirectoryPicker)return download(); /* 폴더 저장을 못 쓰는 브라우저는 일반 다운로드 */
  try{
    const d=await getDir();let file=recipeFile();
    if(!LOADED&&window.showSaveFilePicker){ /* 새 레시피의 첫 저장: 저장 창에서 파일 이름을 직접 정하고, 그 이름을 기억해 다음 저장에 씀 */
      let h;try{h=await showSaveFilePicker({suggestedName:file,startIn:d,types:[{description:"Recipe",accept:{"text/javascript":[".js"]}}]})}catch(x){if(x&&x.name==="AbortError")return;h=null} /* 저장 창을 못 띄우면 기본 이름으로 저장 */
      if(h){
        const p=await d.resolve(h);
        if(!p||p.length!==1||p[0]==="index.js"){alert(T("레시피 폴더 안에, index.js 가 아닌 이름으로 저장해 주세요.","Save inside the recipe folder, with a name other than index.js."));return}
        file=p[0];
      }
    }
    let w=await(await d.getFileHandle(file,{create:true})).createWritable();await w.write(recipeJs());await w.close();
    let idx=[];try{idx=parseJs(await(await(await d.getFileHandle("index.js")).getFile()).text());if(!Array.isArray(idx))idx=[]}catch(e){}
    idx=idx.filter(x=>x&&x.file&&x.file!==file);idx.push({file,name:R.name||file,at:Date.now()});idx.sort(byRecent);
    w=await(await d.getFileHandle("index.js",{create:true})).createWritable();await w.write(indexJs(idx));await w.close();
    LOADED=file;LIST=idx.filter(x=>x&&x.file);SEL=file;fillList(); /* 드롭다운 즉시 갱신 */
  }catch(e){
    if(e&&e.name==="AbortError")return;
    DIR=null;try{await idbSet(null)}catch(x){} /* 기억한 폴더가 사라졌거나 권한이 없으면 다음 저장 때 다시 고르게 */
  }
}
function apply(o){
  if(!o||!Array.isArray(o.steps))return msg(T("레시피 형식이 올바르지 않습니다.","Invalid recipe file."));
  const pr={};if(o.prices&&typeof o.prices==='object')Object.entries(o.prices).forEach(([k,v])=>{v=Number(v);if(String(k).trim()&&v>0&&isFinite(v))pr[String(k).trim()]=v});
  R={name:String(o.name||""),prices:pr,steps:o.steps.map(s=>({title:String(s.title||""),note:String(s.note||""),...(s.locked?{locked:true}:{}),...(s.collapsed?{collapsed:true}:{}),items:(Array.isArray(s.items)?s.items:[]).map(it=>({c:String(it.c||""),n:Math.min(9999,Math.max(0,Math.round(Number(it.n)*100)/100||0)),...(Number(it.p)>0?{p:Math.min(9999999,Math.round(Number(it.p)*100)/100)}:{})}))}))};
  if(!R.steps.length)R.steps.push(newStep());
  UNDO.length=0;renderAll();return true;
}
function loadList(){ /* recipe/index.js 가 <script> 로 먼저 읽혀 window.CRAFT_RECIPE_INDEX 를 만듭니다 */
  const a=window.CRAFT_RECIPE_INDEX;
  LIST=Array.isArray(a)?a.filter(x=>x&&x.file).sort(byRecent):null;
  fillList();
}
let SEL=null; /* 드롭다운에서 고른 파일 (화면을 다시 그려도 선택을 유지) */
function fillList(){
  const s=$("list");if(!s)return;
  s.disabled=!LIST||!LIST.length;
  s.innerHTML=LIST&&LIST.length?LIST.map(x=>`<option value="${esc(x.file)}">${esc(x.name||x.file)}</option>`).join(""):`<option>${LIST?T("저장된 레시피 없음","No saved recipes"):"-"}</option>`;
  if(SEL&&LIST&&LIST.some(x=>x.file===SEL))s.value=SEL;
  /* 최소 폭으로 늘어난 만큼 가운데 묶음을 왼쪽으로 절반 옮겨, 불러오기 버튼(오른쪽 끝)은 제자리에 두고 목록만 왼쪽으로 늘림 */
  const c=s.closest(".c");
  if(c){c.style.transform="";s.style.minWidth="0";const w0=s.offsetWidth,L=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ls-min"))||0;
    const ex=Math.max(0,L-w0)/2; /* 늘어나는 폭 = (목표 폭 − 원래 폭)의 절반 */
    s.style.minWidth=w0+ex+"px";if(matchMedia("(min-width:821px)").matches&&ex>0)c.style.transform=`translateX(${-ex/2}px)`}
}

function loadScript(src){
  return new Promise((ok,fail)=>{
    const el=document.createElement("script");el.charset="utf-8";
    el.src=location.protocol==="file:"?src:src+"?_="+Date.now(); /* http 에서는 캐시된 옛 파일을 피함 */
    el.onload=()=>{el.remove();ok()};el.onerror=()=>{el.remove();fail(new Error(src))};
    document.head.appendChild(el);
  });
}
async function loadSel(){
  if(!LIST||!LIST.length)return msg(T("저장된 레시피가 없습니다.","No saved recipes."));
  const f=$("list").value;SEL=f;
  try{
    window.CRAFT_RECIPE=undefined;
    await loadScript("recipe/"+encodeURIComponent(f));
    const o=window.CRAFT_RECIPE;window.CRAFT_RECIPE=undefined;
    if(!o)throw new Error("empty");
    if(apply(o))LOADED=f;
  }catch(e){msg(T(`레시피 파일을 읽지 못했습니다: recipe/${f}`,`Could not read recipe file: recipe/${f}`))}
}
/* 단계 i 에 재화 줄을 추가하고, 새로 생긴 재화 칸으로 바로 포커스 ("+ 추가" 버튼과 Ctrl+Enter 가 함께 사용) */
function addItem(i){
  const s=R.steps[i];if(!s||s.locked)return;
  const it={c:"",n:1};s.items.push(it);UNDO.push(()=>{const k=s.items.indexOf(it);if(k>=0)s.items.splice(k,1)});refresh();
  const f=[...document.querySelectorAll(`.step[data-i="${i}"] .it [data-f=c]`)].pop();if(f)f.focus();
}
/* 단계를 맨 끝에 추가하고 첫 재화 칸으로 포커스 ("+ 단계 추가" 버튼과 Ctrl+Shift+Enter 가 함께 사용) */
function addStep(b){
  /* 새 단계가 생겨 버튼이 아래로 밀린 만큼 그대로 스크롤해서, 버튼이 화면에서 같은 자리에 머물게 합니다 */
  const y0=b.getBoundingClientRect().top;
  const ns=newStep();R.steps.push(ns);UNDO.push(()=>{const k=R.steps.indexOf(ns);if(k>=0)R.steps.splice(k,1)});
  refresh();
  const dy=b.getBoundingClientRect().top-y0;
  if(dy)window.scrollBy({top:dy,left:0,behavior:"instant"});
  const tf=document.querySelector(`.step[data-i="${R.steps.length-1}"] .it [data-f=c]`);if(tf)tf.focus({preventScroll:true}); /* 새 단계의 첫 재화 칸으로 포커스 */
}
$("app").addEventListener("click",e=>{
  const b=e.target.closest("button[data-a]");if(!b)return;
  const a=b.dataset.a,st=b.closest(".step"),i=st?+st.dataset.i:-1,it=b.closest(".it"),j=it?+it.dataset.j:-1;
  if(a==="lock"){const s=R.steps[i],p=!!s.locked;UNDO.push(()=>{s.locked=p});s.locked=!s.locked;refresh();return}
  if(a==="qup"||a==="qdn"){ /* 수량 ▲▼ 버튼 */
    const s=R.steps[i],o=s&&s.items[j];if(!o||s.locked)return;
    const pn=o.n;UNDO.push(()=>{o.n=pn});
    o.n=Math.min(9999,Math.max(0,Math.round(((+o.n||0)+(a==="qup"?1:-1))*100)/100)); /* 소수 수량에서도 ±1, 소수 둘째 자리로 정리 */
    it.querySelector("[data-f=n]").value=o.n;upd();return;
  }
  if(i>=0&&R.steps[i].locked&&(a==="delStep"||a==="addItem"||a==="delItem"))return; /* 잠긴 단계는 줄·단계 추가/삭제 불가 */
  if(a==="addStep")addStep(b);
  else if(a==="fold"){const s=R.steps[i],p=!!s.collapsed;UNDO.push(()=>{s.collapsed=p});s.collapsed=!s.collapsed;refresh()}
  else if(a==="delStep"){
    const ds=R.steps[i];UNDO.push(()=>{R.steps.splice(Math.min(i,R.steps.length),0,ds)}); /* 확인 없이 바로 삭제, Ctrl+Z 로 복원 */
    R.steps.splice(i,1);refresh();
  }
  else if(a==="addItem")addItem(i);
  else if(a==="delItem"){const S=R.steps[i],di=S.items[j];UNDO.push(()=>{S.items.splice(Math.min(j,S.items.length),0,di)});S.items.splice(j,1);refresh()}
  else if(a==="new"){if(confirm(T("현재 내용을 지우고 새로 시작할까요?","Discard the current recipe and start over?"))){R={name:"",prices:{},steps:[newStep()]};LOADED=null;UNDO.length=0;renderAll()}}
  else if(a==="save")save();
  else if(a==="pick")$("file").click();
  else if(a==="loadsel")loadSel();
});
$("app").addEventListener("input",e=>{

  if(t.id==="rname"){R.name=t.value;return}
  if(t.dataset.p!==undefined){const v=parseFloat(t.value);if(v>0)PRICES[t.dataset.p]=v;else delete PRICES[t.dataset.p];try{localStorage.setItem("craftPrices",JSON.stringify(PRICES))}catch(x){}sums();return}
  const st=t.closest(".step");if(!st)return;
  const s=R.steps[+st.dataset.i],f=t.dataset.f;
  if(f==="p"){setRowPrice(t);return}
  if(f==="n"){const d=t.value.replace(/(\.\d{2})\d+/,"$1");if(d!==t.value)t.value=d;if(parseFloat(t.value)>9999)t.value="9999"} /* 수량은 소수점 둘째 자리까지 (최대 9999) */
  if(f==="title")s.title=t.value;else if(f==="note"){s.note=t.value;fitNote(t)}

$("app").addEventListener("change",e=>{if(e.target.id!=="modsel")return;MODSEL=e.target.value;$("poe2db").href=modUrl(MODSEL)}); /* 아이템 타입 선택 → PoE2DB 링크 갱신 */
/* ── 재화 자동완성 ──
   검색어를 공백으로 나눠 각 조각이 (영어 이름 + 한글 이름) 어디에든 부분 일치하면 표시합니다. 순서 무관: "res cold" → Cold Resistance.
   화면 언어와 상관없이 영어·한글 어느 쪽으로 입력해도 같은 재화가 나오며, 다른 언어 이름은 옆에 작게 함께 보여 줍니다. */
const AC={el:null,inp:null,items:[],act:-1,kb:false};
const acName=e=>LANG==="en"?e.en:(e.ko||e.en);
function acFind(q){
  const toks=norm(q).split(" ").filter(Boolean),raw=String(q).replace(/\s+/g,""),chOnly=/^[ㄱ-ㅎ]+$/.test(raw),out=[];
  ALL.forEach((e,idx)=>{
    let sc=0;
    if(toks.length){
      sc=0;for(const t of toks){const p=e.h.indexOf(t);if(p<0){sc=null;break}sc+=p===0||e.h[p-1]===" "?0:3} /* 단어 맨 앞에서 맞으면 우선 */
      if(sc==null&&chOnly){const p=e.cho.indexOf(raw);if(p>=0)sc=p?4:1} /* 초성 검색 */
      if(sc==null)return;
      if(e.h.startsWith(toks.join(" ")))sc-=1;
    }
    out.push([sc,idx,e]);
  });
  return out.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,80).map(x=>x[2]);

function acEl(){
  if(!AC.el){
    const d=document.createElement("div");d.className="ac";d.hidden=true;d.setAttribute("role","listbox");document.body.appendChild(d);
    d.addEventListener("mousedown",e=>{e.preventDefault();const o=e.target.closest(".ac-o");if(o)acPick(+o.dataset.k)}); /* preventDefault: 입력칸이 포커스를 잃지 않게 */
    AC.el=d;
  }
  return AC.el;
}
function acHide(){if(AC.el)AC.el.hidden=true;AC.inp=null}
function acPos(){
  const t=AC.inp,el=AC.el;if(!t||!el||el.hidden)return;
  if(!document.body.contains(t))return acHide();
  const r=t.getBoundingClientRect(),below=innerHeight-r.bottom-10,above=r.top-10,up=below<180&&above>below;
  el.style.left=Math.max(8,Math.min(r.left,innerWidth-el.offsetWidth-8))+"px";

  if(up){el.style.top="auto";el.style.bottom=(innerHeight-r.top+2)+"px"}else{el.style.bottom="auto";el.style.top=(r.bottom+2)+"px"}
}
function acMark(){

  [...AC.el.children].forEach((c,k)=>c.classList.toggle("on",k===AC.act));
  const c=AC.el.children[AC.act];if(c)c.scrollIntoView({block:"nearest"});
}
function acShow(t,all){
  const q=all?"":t.value;AC.inp=t;AC.items=acFind(q);AC.act=AC.items.length&&q.trim()?0:-1;AC.kb=false;
  if(!AC.items.length)return acHide();

function acPick(k){

$("app").addEventListener("focusin",e=>{const t=e.target;if(t.dataset&&t.dataset.f==="c"&&!t.readOnly&&t.value.trim()&&!isKnown(t.value))acShow(t)}); /* 내용이 비어 있으면 포커스만으로는 목록을 띄우지 않음 (↓ 키로는 열 수 있음) */
$("app").addEventListener("input",e=>{const t=e.target;if(!t.dataset||t.dataset.f!=="c")return;if(isKnown(t.value))acHide();else acShow(t)});

addEventListener("scroll",acPos,true);addEventListener("resize",acPos);

/* 단계 순서: 손잡이(.gr)를 끌어서 변경 (포인터 이벤트라 마우스·터치 모두 동작, 화면 가장자리에서는 자동 스크롤) */
let DND=null;
function dndLayout(){
  const D=DND,q=D.rects[D.i];
  let dy=D.y-D.y0+scrollY-D.s0;
  let lo=0,hi=0;
  if(D.row){lo=D.rects[0].top-q.top;hi=D.rects[D.rects.length-1].top-q.top;dy=Math.max(lo,Math.min(hi,dy))} /* 재화 줄은 자기 단계 밖으로 나가지 않음 */
  const mid=q.top+q.h/2+dy;
  D.st.style.transform=`translateY(${dy}px)`;
  let to=0;D.rects.forEach((r,k)=>{if(k!==D.i&&r.top+r.h/2<mid)to++}); /* 끌고 있는 단계 중심 위에 있는 다른 단계 수 = 놓일 위치 */
  if(D.row){if(dy>=hi)to=D.rects.length-1;else if(dy<=lo)to=0} /* 끝까지 끌면 맨 끝 자리 (가운데선이 딱 겹쳐 '<' 비교에서 빠지는 경우 방지) */
  D.to=to;
  D.els.forEach((el,k)=>{if(k===D.i)return;const sh=D.i<k&&k<=to?-D.step:to<=k&&k<D.i?D.step:0;el.style.transform=sh?`translateY(${sh}px)`:""});
}
function dndTick(){
  const D=DND;if(!D)return;
  const z=70,ab=document.querySelector(".acts-bar"),cs=ab&&getComputedStyle(ab),T0=cs&&cs.position==="sticky"?(parseFloat(cs.top)||0)+ab.offsetHeight:0; /* 위쪽 자동 스크롤 구간은 붙어 있는 버튼 줄 아래부터 */
  let v=0;
  if(D.y<T0+z)v=-Math.min(24,Math.ceil((T0+z-D.y)/4));else if(D.y>innerHeight-z)v=Math.min(24,Math.ceil((D.y-(innerHeight-z))/4));
  if(v){const y=scrollY;scrollBy({top:v,left:0,behavior:"instant"});if(scrollY!==y)dndLayout()}
  D.raf=requestAnimationFrame(dndTick);
}
const dndMove=e=>{if(DND&&e.pointerId===DND.id){DND.y=e.clientY;dndLayout()}};
function dndEnd(e){
  const D=DND;if(!D||e.pointerId!==D.id)return;
  DND=null;cancelAnimationFrame(D.raf);
  removeEventListener("pointermove",dndMove);removeEventListener("pointerup",dndEnd);removeEventListener("pointercancel",dndEnd);
  try{D.h.releasePointerCapture(D.id)}catch(x){}

  D.els.forEach(el=>{if(D.row&&moved)el.style.transition="none";el.style.transform="";el.classList.remove("dragging")}); /* 줄은 DOM 순서를 바로 바꾸므로, 놓는 순간 되돌아가는 애니메이션이 보이지 않게 끔 */
  if(!moved)return;

  else{const[s]=R.steps.splice(D.i,1);R.steps.splice(D.to,0,s);const f=D.i;UNDO.push(()=>{R.steps.splice(R.steps.indexOf(s),1);R.steps.splice(f,0,s)});refresh()}
}
/* 한 단계 안에서 재화 줄 이동: 데이터와 화면(DOM)을 함께 옮김. 화면을 다시 그리지 않으므로 아이콘·입력 상태가 그대로 유지됨 */
function moveRow(si,from,to){
  const its=R.steps[si].items,[x]=its.splice(from,1);its.splice(to,0,x);
  UNDO.push(()=>{its.splice(its.indexOf(x),1);its.splice(from,0,x)});
  const sb=document.querySelector(`.step[data-i="${si}"] .sb`),rows=[...sb.querySelectorAll(".it")],[r]=rows.splice(from,1);
  rows.splice(to,0,r);
  sb.insertBefore(r,rows[to+1]||sb.querySelector(".add"));
  rows.forEach((el,j)=>{el.dataset.j=j});
}
$("app").addEventListener("pointerdown",e=>{
  const h=e.target.closest(".gr,.rg");if(!h||e.button>0||DND)return;
  const row=h.classList.contains("rg"),sp=h.closest(".step");
  if(row&&R.steps[+sp.dataset.i].locked)return;
  const st=row?h.closest(".it"):sp,els=[...(row?sp.querySelectorAll(".it"):document.querySelectorAll(".step"))];if(els.length<2)return;
  e.preventDefault();
  if(row){const a=document.activeElement;if(a&&a!==document.body&&a.blur)a.blur();acHide()} /* 입력 중이던 칸·자동완성 목록은 닫고 시작 */
  const i0=els.indexOf(st);
  DND={row,si:+sp.dataset.i,i:i0,to:i0,st,els,h,id:e.pointerId,y0:e.clientY,y:e.clientY,s0:scrollY,raf:0,
    rects:els.map(el=>{const r=el.getBoundingClientRect();return{top:r.top+scrollY,h:r.height}}),
    step:st.offsetHeight+(parseFloat(getComputedStyle(st).marginBottom)||0)};
  try{h.setPointerCapture(e.pointerId)}catch(x){}
  st.classList.add("dragging");document.documentElement.classList.add("dnd");
  addEventListener("pointermove",dndMove);addEventListener("pointerup",dndEnd);addEventListener("pointercancel",dndEnd);
  dndTick();
});
/* 키보드: 손잡이에 포커스를 두고 ↑↓ 로 이동 */
$("app").addEventListener("keydown",e=>{
  const h=e.target.closest&&e.target.closest(".gr");if(!h||(e.key!=="ArrowUp"&&e.key!=="ArrowDown"))return;
  e.preventDefault();
  const i=+h.closest(".step").dataset.i,k=e.key==="ArrowUp"?i-1:i+1;
  if(k<0||k>=R.steps.length)return;
  [R.steps[i],R.steps[k]]=[R.steps[k],R.steps[i]];UNDO.push(()=>{[R.steps[i],R.steps[k]]=[R.steps[k],R.steps[i]]});refresh();
  const g=document.querySelector(`.step[data-i="${k}"] .gr`);if(g)g.focus();
});
/* 재화 줄 키보드: 줄 손잡이에서 ↑↓, 또는 줄 안의 어느 칸에서든 Alt+↑↓ */
$("app").addEventListener("keydown",e=>{
  const t=e.target,row=t.closest&&t.closest(".it");
  if(!row||(e.key!=="ArrowUp"&&e.key!=="ArrowDown")||e.isComposing)return;
  const onH=!!t.closest(".rg");if(!onH&&!(e.altKey&&!e.ctrlKey&&!e.metaKey))return;
  e.preventDefault();
  const si=+row.closest(".step").dataset.i,j=+row.dataset.j,k=e.key==="ArrowUp"?j-1:j+1,S=R.steps[si];
  if(S.locked||k<0||k>=S.items.length)return;
  const a=t.selectionStart,b=t.selectionEnd;
  moveRow(si,j,k);t.focus();try{if(a!=null)t.setSelectionRange(a,b)}catch(x){} /* DOM 이동으로 풀린 포커스·커서 복원 */
});
$("app").addEventListener("keydown",e=>{ /* 자동완성 키보드: ↑↓ 이동, Enter 선택, Esc 닫기 (한글 조합 중에는 건드리지 않음) */
  const t=e.target;if(!t.dataset||t.dataset.f!=="c"||t.readOnly||e.isComposing||e.keyCode===229||e.ctrlKey||e.metaKey||e.altKey)return;
  const open=AC.inp===t&&AC.el&&!AC.el.hidden,dn=e.key==="ArrowDown";
  if(dn||e.key==="ArrowUp"){
    e.preventDefault();
    if(!open){if(dn)acShow(t,isKnown(t.value));return}
    const n=AC.items.length;AC.kb=true;AC.act=AC.act<0?(dn?0:n-1):(AC.act+(dn?1:n-1))%n;acMark();
  }else if(open&&e.key==="Enter"&&AC.act>=0){e.preventDefault();acPick(AC.act)}
  else if(open&&e.key==="Escape"){e.preventDefault();acHide()}
  else if(open&&e.key==="Tab")acHide();
});
$("app").addEventListener("beforeinput",e=>{ /* 비용 칸은 숫자만: 소수점 등은 입력 자체를 막고 안내 */
  const t=e.target;
  if(t.dataset&&t.dataset.f==="p"&&e.inputType==="insertText"&&(/[^\d.]/.test(e.data||"")||(e.data==="."&&t.value.includes(".")))){e.preventDefault();msg(T("디바인은 소수점 둘째 자리까지 입력합니다.","Divine amounts allow up to 2 decimals."))}
});
$("app").addEventListener("focusout",e=>{if(e.target.dataset&&e.target.dataset.f==="p")sums()}); /* 입력을 마치면 표시 형식을 정리 */
$("app").addEventListener("change",e=>{
  if(e.target.id==="psrc"){selectPrices(e.target.value);return}
  if(e.target.id==="list"){SEL=e.target.value;return}
  if(e.target.id!=="file"||!e.target.files[0])return;
  const fn=e.target.files[0].name;
  e.target.files[0].text().then(t=>{const o=parseJs(t);if(o&&o.prices&&!o.steps){setPrices(o);priceInfo();upd()}else if(apply(o))LOADED=fn}).catch(()=>{}).finally(()=>{e.target.value=""});
});
/* ── 노트 계산 (OneNote 방식) ──
   노트 칸에서 "식=" 바로 뒤에 스페이스를 누르면 계산 결과를 이어서 넣습니다.  예) (3000+4000)/5=␣ → (3000+4000)/5=1400
   "=" 앞쪽에서 숫자·연산자( + - * / × ÷ ^ ( ) )로 이어진 부분만 식으로 읽으므로 앞에 글자가 있어도 됩니다.
   eval 은 쓰지 않고 직접 만든 계산기로 처리합니다. 결과는 execCommand 로 넣어 Ctrl+Z 로 되돌릴 수 있습니다. */
const calc=src=>{
  const s=src.replace(/×/g,"*").replace(/÷/g,"/").replace(/(\d),(?=\d{3}(?!\d))/g,"$1"); /* 3,000 → 3000 */
  let i=0;
  const ws=()=>{while(s[i]===" ")i++};
  const add=()=>{let v=mul();for(;;){ws();const c=s[i];if(c!=="+"&&c!=="-")return v;i++;const r=mul();v=c==="+"?v+r:v-r}};
  const mul=()=>{let v=un();for(;;){ws();const c=s[i];if(c!=="*"&&c!=="/")return v;i++;const r=un();v=c==="*"?v*r:v/r}};
  const un=()=>{ws();if(s[i]==="-"){i++;return -un()}if(s[i]==="+"){i++;return un()}return pw()};
  const pw=()=>{const b=at();ws();if(s[i]==="^"){i++;return Math.pow(b,un())}return b};
  const at=()=>{ws();if(s[i]==="("){i++;const v=add();ws();if(s[i]!==")")throw 0;i++;return v}const m=/^(?:\d+\.?\d*|\.\d+)/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const v=add();ws();if(i<s.length)throw 0;return v;
};
const calcLine=(v,pos)=>{ /* v: 전체 글, pos: "= " 바로 뒤 커서 위치 → 결과 글자 또는 null */
  const ls=v.lastIndexOf("\n",pos-3)+1,m=/[\d\s+\-*\/×÷().,^]+$/.exec(v.slice(ls,pos-2));if(!m)return null;
  let ex=m[0].trim();
  while(ex){
    if(/^[\d(.\-]/.test(ex)&&/[+\-*\/×÷^]/.test(ex.replace(/^[\s(\-]+/,""))){ /* 연산자가 하나도 없는 "5=" 같은 건 계산하지 않음 */
      try{const r=calc(ex);if(isFinite(r))return r===0?"0":r.toLocaleString("en-US",{maximumFractionDigits:6,useGrouping:false})}catch(x){}
    }
    ex=ex.slice(1).trim(); /* 앞쪽 군더더기(예: 문장 끝 마침표)를 하나씩 떼며 다시 시도 */
  }
  return null;
};
$("app").addEventListener("input",e=>{ /* 위쪽 input 처리(노트 저장·높이 맞춤)가 먼저 돌고 난 뒤 실행됨 */
  const t=e.target;
  if(!t.dataset||t.dataset.f!=="note"||e.inputType!=="insertText"||e.data!==" "||t.disabled||t.readOnly)return;
  const v=t.value,pos=t.selectionStart;
  if(pos!==t.selectionEnd||v[pos-1]!==" "||v[pos-2]!=="=")return;
  if(pos<v.length&&!/\s/.test(v[pos]))return; /* 커서 바로 뒤에 글자가 붙어 있으면 건너뜀 (한 칸 이상 띄어져 있으면 뒤에 텍스트가 있어도 계산) */
  const out=calcLine(v,pos);if(out==null)return;
  t.setSelectionRange(pos-1,pos); /* 방금 입력한 스페이스를 결과로 바꿔서 "=" 바로 뒤에 붙임 */
  if(!document.execCommand("insertText",false,out)){t.setRangeText(out,pos-1,pos,"end");t.dispatchEvent(new Event("input",{bubbles:true}))}
});
/* Ctrl+Enter (Mac은 ⌘+Enter): 커서가 있는 단계에 재화 줄 추가 ("+ 추가" 버튼과 같음). 잠긴 단계는 제외, 한글 조합 중에는 무시 */
$("app").addEventListener("keydown",e=>{

});
/* Ctrl+Shift+Enter (Mac은 ⌘+Shift+Enter): 단계 추가 ("+ 단계 추가" 버튼과 같음) */
$("app").addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!(e.ctrlKey||e.metaKey)||!e.shiftKey||e.altKey||e.isComposing||e.keyCode===229)return;
  const b=document.querySelector("button[data-a=addStep]");if(!b)return;
  e.preventDefault();acHide();
  addStep(b);
});
let TYPED=null; /* 포커스 이후 직접 입력한 칸 (그 칸에서만 글자 입력 되돌리기를 브라우저에 맡김) */
$("app").addEventListener("input",e=>{TYPED=e.target});
$("app").addEventListener("focusin",e=>{if(e.target!==TYPED)TYPED=null});
/* Ctrl+Z (Mac은 ⌘+Z): 마지막 동작(단계·재화 줄 추가/삭제/이동, 잠금, 접기, 수량 ▲▼)부터 하나씩 되돌림. 입력칸에 직접 입력했을 땐 그 칸은 브라우저 기본 되돌리기를 그대로 사용 */
addEventListener("keydown",e=>{
  if(e.code!=="KeyZ"||!(e.ctrlKey||e.metaKey)||e.altKey||e.shiftKey||e.isComposing||e.keyCode===229)return;
  const t=e.target;if(t&&t.matches&&t.matches("input,textarea,select,[contenteditable]")&&t===TYPED)return; /* 직접 입력한 칸은 브라우저 기본 되돌리기 */
  const u=UNDO.pop();if(!u)return;
  e.preventDefault();u();refresh();
});

addEventListener("sitebar:lang",e=>{LANG=e.detail;fillCur();renderAll()});

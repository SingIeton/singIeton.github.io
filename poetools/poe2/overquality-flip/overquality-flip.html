//M
function model(p){const q=new Array(22).fill(0);for(let i=19;i>=0;i--)q[i]=1+(1-p)*q[i+1]+p*q[Math.min(i+2,20)];
const P=new Array(31).fill(0),E=new Array(31).fill(0);P[30]=1;
for(let i=29;i>=20;i--){const s=1-.05*(i-20),a=Math.min(i+2,30);P[i]=s*((1-p)*P[i+1]+p*P[a]);E[i]=1+s*((1-p)*E[i+1]+p*E[a]);}
return{P:P[20],E:E[20],Q:q[0]}}
function toEx(l,S){return l.c==="exalted"?l.a:l.c==="chaos"?l.a*S.chaos:l.c==="divine"?l.a*S.div:null}
function pick(side,S,N){if(!side)return{n:0};const v=(side.listings||[]).map(l=>toEx(l,S)).filter(x=>x!=null).sort((a,b)=>a-b).slice(0,N);
const n=side.total!=null?side.total:v.length;if(!v.length||n<MIN_N)return{n};const h=v.length>>1;
const f=side.fair||{};return{n,ex:v.length%2?v[h]:(v[h-1]+v[h])/2,conf:f.confidence||undefined,reason:f.reason}}
function calc(B,sale,X,W,M){const k=1/M.P,cost=k*(B+M.Q*W+M.E*X);return{cost,margin:sale-cost,roi:(sale-cost)/cost}}
//M
function pickFair(side,S,N){const f=side&&side.fair;if(!f)return{n:0};
const n=side.total!=null?side.total:((side.listings||[]).length);
if(f.status==="insufficient"||f.a==null)return{n,insufficient:true,reason:f.reason};
const ex=toEx({a:f.a,c:f.c},S);if(ex==null)return{n,reason:f.reason};
return{n,ex,conf:f.confidence,skipped:f.skipped||0,reason:f.reason}}

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);const x=v?JSON.parse(v):d;return x==null?d:x}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const P2=20,MIN_N=1;
const BASEDEF={div:515,chaos:67,inf:{armourer:0,blacksmith:60,arcanist:0,catalysing:0},q:{scrap:0,whetstone:.15,etcher:0}};
/* 리그별 기본값: 여기에 없는 리그(시즌 리그)는 BASEDEF. 값은 Ex 기준 (Divine = 200 Ex 처럼) */
const LGDEF={Standard:{div:200,chaos:80,inf:{blacksmith:500}}};
/* 기본값 우선순위: prices.json 의 리그별 rates (수집기가 poe.ninja 에서 읽어 저장, 모두 Exalted 기준) > LGDEF > BASEDEF.
   수집기가 못 찾은 항목은 rates 에 없으므로 자동으로 다음 순위 값을 쓴다 */
const defFor=l=>{const o=LGDEF[l]||{},r=((PRICES.leagues||{})[l]||{}).rates||{};return{div:r.div??o.div??BASEDEF.div,chaos:r.chaos??o.chaos??BASEDEF.chaos,inf:Object.assign({},BASEDEF.inf,o.inf,r.inf),q:Object.assign({},BASEDEF.q,o.q,r.q)}};
const CATS={weapon:["무기","Weapon"],armour:["방어구","Armour"],accessory:["장신구","Accessory"]};
const TABS=Object.assign({rec:["추천","Recommended"]},CATS),REC_N=8;  /* 추천 탭: 전체 장비 중 종합 점수 상위 REC_N개 */
const REC_W=.5;  /* 추천 정렬 가중치: 점수 = 예상 마진^W × 수익률^(1-W). 0.5면 둘을 동일 비중(기하평균)으로, 1에 가까울수록 마진, 0에 가까울수록 수익률 중시 */
const L2=(ko,en)=>LANG==="en"?`${en}<span class="en">${ko}</span>`:`${ko}<span class="en">${en}</span>`;
const FIELDS=()=>[[tt("화폐 환율","Currency exchange rates"),[["div","Divine =","ex"],["chaos","Chaos =","ex"]]],
[tt("바알 주입기 가격 (Ex)","Vaal Infuser prices (Ex)"),[["inf.blacksmith",L2("바알 대장장이의 주입기","Vaal Blacksmith's Infuser")],["inf.armourer",L2("바알 방어구 장인의 주입기","Vaal Armourer's Infuser")],["inf.arcanist",L2("바알 신비학자의 주입기","Vaal Arcanist's Infuser")],["inf.catalysing",L2("바알 촉진시키는 주입기","Vaal Catalysing Infuser")]]],
[tt("퀄리티 화폐 가격 (Ex)","Quality currency prices (Ex)"),[["q.whetstone",L2("대장장이의 숫돌","Blacksmith's Whetstone")],["q.scrap",L2("방어구 장인의 고철","Armourer's Scrap")],["q.etcher",L2("신비학자의 식각기","Arcanist's Etcher")]]]];
const OFF=["inf.armourer","inf.arcanist","inf.catalysing","q.scrap","q.etcher"];
const gp=(o,p)=>p.split(".").reduce((a,k)=>a[k],o);
const gq=(o,p)=>p.split(".").reduce((a,k)=>a==null?a:a[k],o);  /* gp 와 같지만 없으면 undefined */
/* poe.ninja 에서 받아온 값의 표시: 10 이상이면 소수점 없이, 10 미만이면 소수점 한 자리까지. 표시만 바꾸고 계산에는 원래 값(S)을 그대로 쓴다.
   직접 수정한 값과 poe.ninja 가 아닌 기본값(LGDEF/BASEDEF)은 입력한 그대로 보여준다 */
const rnd=v=>v>=10?Math.round(v):Math.round(v*10)/10;

const sp=(o,p,v)=>{const a=p.split(".");const l=a.pop();a.reduce((x,k)=>x[k],o)[l]=v};
let PRICES={leagues:{}},S={league:"",...defFor("")},SAVED={league:"",by:{}},BASES=[],TAB="rec",COL=new Set();  /* PRICES 를 먼저 선언: defFor 가 읽는다 */
/* 설정 저장 형식(poe2bq:settings2): {league: 직접 고른 리그("" = 항상 최신), by: {리그 이름: {직접 수정한 항목만: div, chaos, inf:{..}, q:{..}}}}.
   수정하지 않은 항목은 저장하지 않으므로 prices.json 의 poe.ninja 환율이 갱신되면 자동으로 따라간다. 수정한 항목은 그 값이 우선 */
function useLeague(l){const d=defFor(l),v=SAVED.by[l]||{};S={league:l,div:v.div??d.div,chaos:v.chaos??d.chaos,inf:Object.assign({},d.inf,v.inf),q:Object.assign({},d.q,v.q)};OFF.forEach(k=>sp(S,k,0))}
function loadSettings(){const s=LS.get("poe2bq:settings2",null)||{league:(LS.get("poe2bq:settings",{})||{}).league};  /* 이전 형식은 리그 선택만 가져옴 (이전 값은 전부 직접 수정으로 굳어 있어 버림) */
 SAVED={league:typeof s.league==="string"?s.league:"",by:s.by&&typeof s.by==="object"?s.by:{}};

function setOv(l,k,v,del){const o=SAVED.by[l]=SAVED.by[l]||{};const a=k.split(".");const last=a.pop();let t=o;for(const x of a)t=t[x]=t[x]||{};if(del)delete t[last];else t[last]=v}  /* del: 자동값과 같아지면 수정 표시를 지움 */

 i.title=on?tt("직접 수정한 값 (자동값: "+autoShow(k)+")","Edited by you (auto: "+autoShow(k)+")"):""})}
/* 시각: 수집기는 UTC ISO(2026-11-08T12:21:00Z)로 저장한다. 시간대가 없는 이전 형식은 PC(KST)/Actions(UTC) 어느 쪽인지 알 수 없어
   비교에서 항상 더 오래된 값으로 취급하고, 화면에는 사용자 로컬 시간으로 바꿔 보여준다 */
const tsOf=s=>/(Z|[+-]\d\d:?\d\d)$/.test(String(s||""))?(Date.parse(s)||0):0;
const newer=(y,x)=>{const a=tsOf(y),b=tsOf(x);return a!==b?a>b:String(y)>=String(x)};
const fmT=s=>{const t=tsOf(s);if(!t)return s;const d=new Date(t),p=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`};
function merge(a,b){const o={leagues:Object.assign({},a.leagues),order:b.order||a.order};for(const k in(b.leagues||{})){const x=o.leagues[k],y=b.leagues[k];if(!x||newer(y.collectedAt,x.collectedAt))o.leagues[k]=y}return o}
const STD="Standard";
/* 시즌 리그: 최근 2개(최신, 직전). 수집기가 prices.json 의 order 에 순서를 기록하며, 없으면 수집 시각이 최근인 순 */
const hasData=k=>{const l=(PRICES.leagues||{})[k];return!!(l&&(l.entries||[]).length)};  /* 가격 항목이 하나라도 있는 리그 (환율만 있는 리그는 제외) */
const seasonLeagues=()=>{const L=PRICES.leagues||{},ok=k=>k!==STD&&hasData(k);
 const o=(PRICES.order||[]).filter(ok);
 const rest=Object.keys(L).filter(k=>ok(k)&&!o.includes(k)).sort((a,b)=>(tsOf(L[b].collectedAt)-tsOf(L[a].collectedAt))||String(L[b].collectedAt).localeCompare(String(L[a].collectedAt)));
 return[...o,...rest].slice(0,2)};
const latestLeague=()=>seasonLeagues()[0]||"";
const leagueList=()=>[...seasonLeagues(),...(hasData(STD)?[STD]:[])];  /* 드롭다운: prices.json 에 데이터가 있는 리그만 */
/* 선택된 리그가 목록에 없으면(미설정·리그 교체) 목록의 첫 리그(최신)로, 데이터가 전혀 없으면 빈 리그로 */
/* 가격 파일을 읽은 뒤에는 항상 다시 계산해 새로 읽은 poe.ninja 환율을 반영 */
const fixLeague=()=>useLeague(leagueList().includes(S.league)?S.league:(leagueList()[0]||""));
/* 모든 항목이 수집 중지인 카테고리는 접어 둠 (페이지 오픈·리그 변경 시) */
function autoCollapse(){COL.clear();const lg=PRICES.leagues[S.league]||{},sm=lg.stopped||{};
 const allStopped=b=>{const stp=v=>sm[b.id+":"+v]||sm[b.id];const lv=[...new Set([...(lg.entries||[]).filter(e=>e.base===b.id).map(e=>e.ilvl),...[82,81].filter(stp)])];return lv.length>0&&lv.every(stp)};
 const byCls=new Map();BASES.forEach(b=>byCls.set(b.cls,(byCls.get(b.cls)||[]).concat(b)));
 byCls.forEach((bs,c)=>{if(bs.every(allStopped))COL.add(c)})}
function panel(){let h=`<fieldset><legend>${tt("리그","League")}</legend><label><select data-k="league">${leagueList().map(l=>`<option${l===S.league?" selected":""}>${l}</option>`).join("")}</select></label></fieldset>`;
for(const[t,fs]of FIELDS())h+=`<fieldset><legend>${t}</legend>${fs.map(([k,l,u])=>`<label><span>${l}</span><span class="in"><input type="number" step="any" min="0" data-k="${k}" value="${inShow(k)}"${OFF.includes(k)?" disabled":""}>${u?`<em>${u}</em>`:""}</span></label>`).join("")}</fieldset>`;
h+=`<div class="row"><label class="btn">${tt("가격 파일 불러오기","Load price file")}<input type="file" id="file" accept=".json" hidden></label><button class="sec" id="reset" type="button">${tt("설정 초기화","Reset settings")}</button></div>`;
$("set").innerHTML=h;
$("set").querySelectorAll("[data-k]").forEach(e=>e.addEventListener("input",()=>{const k=e.dataset.k;
 if(k==="league"){SAVED.league=e.value===latestLeague()?"":e.value;saveSettings();useLeague(e.value);autoCollapse();  /* 리그 전환: 그 리그의 설정값으로 바꾸고 전체 다시 계산 */
  $("set").querySelectorAll("input[data-k]").forEach(i=>i.value=inShow(i.dataset.k));markOv();render();return}
 const v=Math.max(0,parseFloat(e.value)||0);setOv(S.league,k,v,v===gp(defFor(S.league),k));sp(S,k,v);saveSettings();markOv();render()}));  /* 자동값과 같으면 수정 표시 해제 */
$("file").addEventListener("change",async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d.leagues)throw 0;PRICES=merge(PRICES,d);LS.set("poe2bq:prices",PRICES);fixLeague();autoCollapse();panel();render()}catch(x){alert(tt("올바른 prices.json 형식이 아닙니다.","Not a valid prices.json file."))}});
$("reset").addEventListener("click",()=>{LS.del("poe2bq:settings");LS.del("poe2bq:settings2");loadSettings();fixLeague();autoCollapse();panel();render()});
markOv()}
const trim=(x,d)=>x.toLocaleString(LANG==="en"?"en-US":"ko-KR",{minimumFractionDigits:0,maximumFractionDigits:d});
const fm=(ex,d=1)=>S.div>0?trim(ex/S.div,ex/S.div>=1?0:d)+" D":Math.round(ex).toLocaleString(LANG==="en"?"en-US":"ko-KR")+" E";
const fmM=ex=>{const u=S.div>0?ex/S.div:ex;return trim(u,u>=1?0:1)+(S.div>0?" D":" E")};  /* 예상 마진: 1 이상이면 정수, 0~1이면 소수 한 자리 */
/* 거래소 링크: 수집기(build_query)와 같은 조건. 30% 판매가 = 퀄리티 30 이상, 0% 베이스 = 퀄리티 0. ilvl 82 는 82 이상, 81 은 정확히 81 */
const tradeUrl=(b,v,side)=>{const q=side==="buy0"?{min:0,max:0}:{min:30},il=v===81?{min:81,max:81}:{min:v};
 const body={query:{status:{option:"securable"},type:b.en,filters:{type_filters:{filters:{rarity:{option:"normal"}}},misc_filters:{filters:{ilvl:il,quality:q,corrupted:{option:"false"},mirrored:{option:"false"},fractured_item:{option:"false"}}},equipment_filters:{filters:{rune_sockets:{min:b.sockets,max:b.sockets}}}}},sort:{price:"asc"}};
 return"https://www.pathofexile.com/trade2/search/poe2/"+encodeURIComponent(S.league)+"?q="+encodeURIComponent(JSON.stringify(body))};
const nm=b=>LANG==="en"?`${esc(b.en)}${b.ko?`<span class="en">${esc(b.ko)}</span>`:""}`:`${esc(b.ko||b.en)}${b.ko?`<span class="en">${esc(b.en)}</span>`:""}`;
function render(){
 const M=model(P2/100),lg=PRICES.leagues[S.league]||{entries:[]},need=Math.max(1,Math.ceil(1/M.P-1e-9));
 $("sz").innerHTML=BASES.map(nm).join("");
 $("stats").innerHTML=[[tt("최대 퀄리티 도달 확률","Chance to reach max quality"),trim(M.P*100,1)+"%"],[tt("평균 필요 베이스 수","Avg. bases needed"),trim(1/M.P,1)+tt("개","")],[tt("평균 필요 바알 화폐","Avg. Vaal currency needed"),trim(M.E/M.P,1)+tt("개","")],[tt("평균 필요 퀄리티 화폐","Avg. quality currency needed"),trim(M.Q/M.P,0)+tt("개","")]].map(([a,b])=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`).join("");
 $("tabs").innerHTML=Object.keys(TABS).map(c=>`<button type="button" class="tab${c===TAB?" on":""}" data-c="${c}">${LANG==="en"?TABS[c][1]:TABS[c][0]} <small>${LANG==="en"?TABS[c][0]:TABS[c][1]}</small></button>`).join("");
 $("tabs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{TAB=b.dataset.c;render()}));
 const groups=new Map();
 for(const b of TAB==="rec"?BASES:BASES.filter(b=>b.cat===TAB)){const gk=TAB==="rec"?"":b.cls;const g=groups.get(gk)||{ko:b.clsKo,list:[]};groups.set(gk,g);
  const sm=lg.stopped||{},stp=v=>sm[b.id+":"+v]||sm[b.id];
  const es=(lg.entries||[]).filter(e=>e.base===b.id);
  const lv=[...new Set([...es.map(e=>e.ilvl),...[82,81].filter(stp)])].sort((x,y)=>y-x);
  if(!lv.length){g.list.push({b,msg:tt("수집 데이터 없음","No data collected")});continue}
  for(const v of lv){const st=stp(v);
   if(st){if(v===81)continue;g.list.push({b,ilvl:v,msg:tt("데이터 부족으로 수집 중지","Collection stopped (insufficient data)"),tip:(st.reason||"")+(st.since?tt(" ("+fmT(st.since)+" 이후)"," (since "+fmT(st.since)+")"):"")});continue}
   const e=es.find(x=>x.ilvl===v);const B=e.buy0&&e.buy0.omitted?{omitted:true}:pick(e.buy0,S,need),T=pickFair(e.sell30,S,need);
   const r={b,e,B,T};if(B.ex!=null&&T.ex!=null)Object.assign(r,calc(B.ex,T.ex,S.inf[b.infuser],S.q[b.qcur],M));else r.msg=tt("데이터 부족","Insufficient data");g.list.push(r)}}
 if(TAB==="rec"){const g=groups.get("");if(g){const sc=r=>Math.pow(r.margin,REC_W)*Math.pow(r.roi,1-REC_W);  /* 마진·수익률이 모두 양수인 행만 대상 */
  g.list=g.list.filter(r=>r.margin>0&&r.B.conf!=="low"&&r.T.conf!=="low").sort((a,b)=>sc(b)-sc(a)).slice(0,REC_N)}}  /* 0% 베이스·시장가 중 하나라도 신뢰 낮음이면 제외 */
 let h="";groups.forEach((g,cls)=>{const isOpen=!COL.has(cls);
  if(TAB!=="rec")h+=`<tr class="g${isOpen?"":" col"}" data-cls="${esc(cls)}" tabindex="0" role="button" aria-expanded="${isOpen}" title="${tt("더블클릭으로 접기/펼치기","Double-click to collapse/expand")}"><td colspan="7">${LANG==="en"?`${esc(cls)} <span class="ge">${esc(g.ko||cls)}</span>`:`${esc(g.ko||cls)} <span class="ge">${esc(cls)}</span>`}${isOpen?"":`<span class="cnt">${tt(g.list.length+"행 접힘",g.list.length+" rows hidden")}</span>`}</td></tr>`;
  if(TAB!=="rec"&&!isOpen)return;
  for(const r of g.list){const b=r.b,e=r.e;
   if(!e){h+=r.ilvl!=null?`<tr><td>${nm(b)}</td><td class="il">${r.ilvl}</td><td colspan="5" class="dim" style="text-align:center"${r.tip?` title="${esc(r.tip)}"`:""}>${esc(r.msg)}</td></tr>`:`<tr><td>${nm(b)}</td><td colspan="6" class="dim" style="text-align:center">${esc(r.msg)}</td></tr>`;continue}
   const cs=p=>[p.n>=1&&p.n<=9?tt(p.n+"개",p.n+(p.n===1?" listing":" listings")):"",p.conf?CONF[p.conf]:"",p.skipped?tt("저가 "+p.skipped+"개 제외",p.skipped+" low-priced excluded"):""].filter(Boolean).join(" · ");
   const sm=p=>{const t=cs(p);return t?`<small>${t}</small>`:""};
   const lk=side=>`<a class="tl" href="${esc(tradeUrl(b,e.ilvl,side))}" target="_blank" rel="noopener" title="${tt("거래소에서 보기","Open in trade site")}" aria-label="${tt("거래소에서 보기","Open in trade site")}">↗</a>`;
   const cell=(p,side)=>p.omitted?`<span class="dim">-</span>`:p.ex!=null?`${fm(p.ex)}${lk(side)}${sm(p)}`:`<span class="dim">${tt("없음","None")}</span>${lk(side)}`;
   const cellT=(p,side)=>p.insufficient?`<span class="dim">${tt("데이터 부족","Insufficient data")}</span>${lk(side)}`:p.ex==null?cell(p,side):`${fm(p.ex)}${lk(side)}${sm(p)}`;
   const m=r.margin;
   h+=`<tr><td>${nm(b)}</td><td class="il">${e.ilvl}</td><td${r.B.reason?` title="${esc(r.B.reason)}"`:""}>${cell(r.B,"buy0")}</td>`+
   (m==null?`<td class="dim">-</td>`:`<td>${fm(r.cost,0)}</td>`)+
   `<td${r.T.reason?` title="${esc(r.T.reason)}"`:""}>${cellT(r.T,"sell30")}</td>`+
   (m==null?`<td colspan="2" class="dim">${r.msg}</td>`:`<td class="mg ${m>=0?"pos":"neg"}">${m>=0?"+":"−"}${fmM(Math.abs(m))}</td><td class="roi ${m>=0?"pos":"neg"}">${(r.roi*100).toFixed(0)}%</td>`)+`</tr>`}});
 $("rows").innerHTML=h||`<tr><td colspan="7" class="dim" style="text-align:left">${TAB==="rec"?tt("추천할 데이터가 없습니다.","Nothing to recommend yet."):tt("이 카테고리에 베이스가 없습니다.","No bases in this category.")}</td></tr>`;
 /* 수집 로그: 경매장(GGG 거래소) 가격과 환율(poe.ninja)은 수집 시각이 서로 달라 두 줄로 구분해 표시 */
 const aT=lg.collectedAt?tt(`경매장 가격 마지막 수집: ${fmT(lg.collectedAt)}`,`Trade-site prices last collected: ${fmT(lg.collectedAt)}`):tt("수집된 경매장 가격 데이터가 없습니다. 가격 파일을 불러오세요.","No trade-site price data collected. Load a price file."),
  rT=lg.rates&&lg.rates.updatedAt?tt(`환율 마지막 수집(poe.ninja): ${fmT(lg.rates.updatedAt)}`,`Rates last collected (poe.ninja): ${fmT(lg.rates.updatedAt)}`):tt("환율(poe.ninja) 수집 기록 없음 (기본값 사용)","No rates collected from poe.ninja (using defaults)");
 $("src").innerHTML=esc(aT)+"<br>"+esc(rT)}
async function jget(u){try{const r=await fetch(u,{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}}
(async()=>{
 const fb=JSON.parse($("fb").textContent);
 const tg=tr=>{const c=tr.dataset.cls;COL.has(c)?COL.delete(c):COL.add(c);render()};
 $("rows").addEventListener("dblclick",e=>{const tr=e.target.closest("tr.g");if(tr)tg(tr)});
 $("rows").addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const tr=e.target.closest("tr.g");if(!tr)return;e.preventDefault();const c=tr.dataset.cls;tg(tr);const n=[...$("rows").querySelectorAll("tr.g")].find(x=>x.dataset.cls===c);if(n)n.focus()});
 applyStatic();loadSettings();panel();
 BASES=fb.bases;
 const cached=LS.get("poe2bq:prices",{leagues:{}}),fresh=await jget("out/prices.json");
 if(fresh&&fresh.leagues)for(const k of Object.keys(cached.leagues||{}))if(!fresh.leagues[k])delete cached.leagues[k];  /* 서버의 prices.json 이 있으면 그 파일이 기준: 파일에 없는 리그의 브라우저 캐시는 버림 */
 PRICES=merge(cached,fresh||{leagues:{}});
 fixLeague();autoCollapse();
 panel();LS.set("poe2bq:prices",PRICES);render();
})();
</script>
</body>

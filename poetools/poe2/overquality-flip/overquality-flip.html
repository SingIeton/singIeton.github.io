<!DOCTYPE html>
<html lang="ko" data-game="poe2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PoE 2 베이스 30% 퀄리티 수익 계산기</title>
<link rel="stylesheet" href="../../style/theme.css">
<script src="../../style/site-bar.js"></script>
<style>
/* 이 파일에는 베이스 퀄리티 계산기에만 필요한 스타일만 둡니다. 폰트·색·버튼·패널·탭 등 공통 모양은 style/theme.css */
.grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row .btn,.row button{margin:0;font-size:13.5px;line-height:1.2;min-height:38px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.st{color:var(--mute);font-size:12.5px;margin:8px 0 0}
label>span:first-child{white-space:nowrap}
.in{display:flex;align-items:center;gap:6px}.in em{font-style:normal;color:var(--mute);font-size:12.5px}
.stats{margin-bottom:20px}
.tab small{font-weight:400;opacity:.8}
.tbl{overflow-x:auto;background:var(--sf);border:1px solid color-mix(in oklab,var(--g) 40%,var(--ln));border-radius:var(--r);margin-bottom:16px}
table{min-width:760px}
th,td{padding:8px 12px;white-space:nowrap}
thead th{background:var(--sf2);border-bottom-color:var(--ln2)}
tbody tr:not(.g):hover td{background:color-mix(in oklab,var(--g) 6%,transparent)}
tr.g td{background:color-mix(in oklab,var(--g) 9%,transparent);font:600 14px var(--serif);color:var(--g);text-align:left}
tr.g td::before{content:"";display:inline-block;width:6px;height:6px;margin-right:10px;background:var(--g);transform:rotate(45deg);vertical-align:2px}
.en{display:block;font-size:12px;color:var(--mute);font-weight:400;font-family:var(--sans)}
td small{display:block;color:var(--mute);font-size:12px}
td small.lo{color:var(--bad)}
.pos{color:var(--g);font-weight:700}.neg{color:var(--bad);font-weight:700}.dim{color:var(--mute)}
.bar{display:block;height:5px;border-radius:2px;margin-top:3px;margin-left:auto}
</style>
</head>
<body>
<main class="wrap">
<div class="ghead sm"><span class="mini" aria-hidden="true">2</span><div><a class="game" href="../poe2.html" data-en="Path of Exile 2">패스 오브 엑자일 2 (Path of Exile 2)</a><h1 data-en="Base 30% Quality Profit Calculator">베이스 30% 퀄리티 수익 계산기</h1><p class="sub" data-en="Estimates the average crafting cost and average margin of raising over-socketed normal-rarity bases to 20% quality and then trying for 30% with a Vaal Infuser. Corrupted bases are treated as failures with no residual value.">일반 등급 오버소켓 베이스를 퀄리티 20%까지 올린 뒤 Vaal Infuser로 30% 달성을 시도할 때의 평균 제작비와 평균 마진을 산출합니다. 타락한 베이스는 잔존 가치 없이 실패로 처리합니다.</p></div></div>
<p id="err" class="note" hidden style="color:var(--bad)"></p>
<noscript><p class="note">(JavaScript required) 이 페이지는 JavaScript가 필요합니다. github.com 파일 보기 화면이 아니라 GitHub Pages(github.io) 주소로 열어주세요.</p></noscript>
<div class="grid">
<div>
<div class="panel" id="set"></div>
</div>
<div>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<div class="tbl"><table><thead><tr><th data-en="Base">베이스</th><th>Req</th><th>iLvl</th><th data-en="Sockets">소켓</th><th data-en="0% base">0% 베이스</th><th data-en="30% sell price">30% 판매가</th><th data-en="Avg. cost">평균 제작비</th><th data-en="Avg. margin">평균 마진</th><th>ROI</th></tr></thead><tbody id="rows"></tbody></table></div>
<p class="note" id="src"></p>
</div>
</div>
</main>
<script type="application/json" id="fb">{"bases": [{"id": "obliterator-bow", "en": "Obliterator Bow", "ko": "절멸자 활", "cls": "Bows", "clsKo": "활", "cat": "weapon", "req": 78, "sockets": 3, "infuser": "blacksmith", "qcur": "whetstone"}, {"id": "warmonger-bow", "en": "Warmonger Bow", "ko": "전쟁광 활", "cls": "Bows", "clsKo": "활", "cat": "weapon", "req": 77, "sockets": 3, "infuser": "blacksmith", "qcur": "whetstone"}, {"id": "siege-crossbow", "en": "Siege Crossbow", "ko": "공성 석궁", "cls": "Crossbows", "clsKo": "석궁", "cat": "weapon", "req": 79, "sockets": 3, "infuser": "blacksmith", "qcur": "whetstone"}, {"id": "gemini-crossbow", "en": "Gemini Crossbow", "ko": "쌍둥이자리 석궁", "cls": "Crossbows", "clsKo": "석궁", "cat": "weapon", "req": 78, "sockets": 3, "infuser": "blacksmith", "qcur": "whetstone"}, {"id": "desolate-crossbow", "en": "Desolate Crossbow", "ko": "황량한 석궁", "cls": "Crossbows", "clsKo": "석궁", "cat": "weapon", "req": 77, "sockets": 3, "infuser": "blacksmith", "qcur": "whetstone"}, {"id": "sinister-quarterstaff", "en": "Sinister Quarterstaff", "ko": "험악한 육척봉", "cls": "Quarterstaves", "clsKo": "육척봉", "cat": "weapon", "req": 67, "sockets": 3, "infuser": "blacksmith", "qcur": "whetstone"}, {"id": "bolting-quarterstaff", "en": "Bolting Quarterstaff", "ko": "치직대는 육척봉", "cls": "Quarterstaves", "clsKo": "육척봉", "cat": "weapon", "req": 78, "sockets": 3, "infuser": "blacksmith", "qcur": "whetstone"}, {"id": "soaring-spear", "en": "Soaring Spear", "ko": "솟구치는 창", "cls": "Spears", "clsKo": "창", "cat": "weapon", "req": 70, "sockets": 2, "infuser": "blacksmith", "qcur": "whetstone"}, {"id": "akoyan-spear", "en": "Akoyan Spear", "ko": "아코야의 창", "cls": "Spears", "clsKo": "창", "cat": "weapon", "req": 78, "sockets": 2, "infuser": "blacksmith", "qcur": "whetstone"}, {"id": "flying-spear", "en": "Flying Spear", "ko": "비행 창", "cls": "Spears", "clsKo": "창", "cat": "weapon", "req": 78, "sockets": 2, "infuser": "blacksmith", "qcur": "whetstone"}, {"id": "spiny-talisman", "en": "Spiny Talisman", "ko": "가시투성이 부적", "cls": "Talismans", "clsKo": "부적", "cat": "weapon", "req": 67, "sockets": 3, "infuser": "blacksmith", "qcur": "whetstone"}, {"id": "massive-greathammer", "en": "Massive Greathammer", "ko": "거대한 대망치", "cls": "Two Hand Maces", "clsKo": "양손 철퇴", "cat": "weapon", "req": 77, "sockets": 3, "infuser": "blacksmith", "qcur": "whetstone"}, {"id": "ironwood-greathammer", "en": "Ironwood Greathammer", "ko": "철목 대망치", "cls": "Two Hand Maces", "clsKo": "양손 철퇴", "cat": "weapon", "req": 77, "sockets": 3, "infuser": "blacksmith", "qcur": "whetstone"}]}</script>
<script>
(()=>{const show=m=>{const e=document.getElementById("err");if(e){e.hidden=false;e.textContent=(document.documentElement.lang==="en"?"Error: ":"오류: ")+m}};
window.addEventListener("error",ev=>show(ev.message));
window.addEventListener("unhandledrejection",ev=>show(String(ev.reason&&ev.reason.message||ev.reason)))})();
/* 언어: 저장·동기화는 style/site-bar.js 가 담당. 여기서는 현재 언어를 읽고 "sitebar:lang" 이벤트만 구독 */
let LANG=(window.PoEPrefs&&window.PoEPrefs.lang)||(document.documentElement.lang==="en"?"en":"ko");
const tt=(ko,en)=>LANG==="en"?en:ko;
function applyStatic(){document.querySelectorAll("[data-en]").forEach(e=>{if(e.dataset.ko===undefined)e.dataset.ko=e.textContent;e.textContent=LANG==="en"?e.dataset.en:e.dataset.ko});
document.title=tt("PoE 2 베이스 30% 퀄리티 수익 계산기","PoE 2 Base 30% Quality Profit Calculator")}
window.addEventListener("sitebar:lang",e=>{LANG=e.detail==="en"?"en":"ko";applyStatic();panel();render()});
//M
function model(p){const q=new Array(22).fill(0);for(let i=19;i>=0;i--)q[i]=1+(1-p)*q[i+1]+p*q[Math.min(i+2,20)];
const P=new Array(31).fill(0),E=new Array(31).fill(0);P[30]=1;
for(let i=29;i>=20;i--){const s=1-.05*(i-20),a=Math.min(i+2,30);P[i]=s*((1-p)*P[i+1]+p*P[a]);E[i]=1+s*((1-p)*E[i+1]+p*E[a]);}
return{P:P[20],E:E[20],Q:q[0]}}
function toEx(l,S){return l.c==="exalted"?l.a:l.c==="chaos"?l.a*S.chaos:l.c==="divine"?l.a*S.div:null}
function pick(side,S,N){if(!side)return{n:0};const v=(side.listings||[]).map(l=>toEx(l,S)).filter(x=>x!=null).sort((a,b)=>a-b).slice(0,N);
const n=side.total!=null?side.total:v.length;if(!v.length||n<MIN_N)return{n};const h=v.length>>1;
const f=side.fair||{};return{n,ex:v.length%2?v[h]:(v[h-1]+v[h])/2,conf:f.confidence||undefined,reason:f.reason}}
function calc(B,sale,X,W,M){const k=1/M.P,cost=k*(B+M.Q*W+M.E*X);return{cost,margin:sale-cost,roi:(sale-cost)/cost}}
//M
function pickFair(side,S,N){const f=side&&side.fair;if(!f)return{n:0};
const n=side.total!=null?side.total:((side.listings||[]).length);
if(f.status==="insufficient"||f.a==null)return{n,insufficient:true,reason:f.reason};
const ex=toEx({a:f.a,c:f.c},S);if(ex==null)return{n,reason:f.reason};
return{n,ex,conf:f.confidence,skipped:f.skipped||0,reason:f.reason}}
const CONF={get high(){return tt("신뢰 높음","High confidence")},get medium(){return tt("신뢰 보통","Medium confidence")},get low(){return tt("신뢰 낮음","Low confidence")}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);const x=v?JSON.parse(v):d;return x==null?d:x}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const P2=20,MIN_N=1;
const DEF={league:"Forbidden Rites",div:515,chaos:67,
inf:{armourer:0,blacksmith:60,arcanist:0,catalysing:0},q:{scrap:0,whetstone:.15,etcher:0}};
const CATS={weapon:["무기","Weapon"],armour:["방어구","Armour"],accessory:["장신구","Accessory"]};
const L2=(ko,en)=>LANG==="en"?`${en}<span class="en">${ko}</span>`:`${ko}<span class="en">${en}</span>`;
const FIELDS=()=>[[tt("환율 / 화폐","Exchange rates"),[["div","Divine =","ex"],["chaos","Chaos =","ex"]]],
[tt("Vaal Infuser 가격 (Ex)","Vaal Infuser prices (Ex)"),[["inf.blacksmith",L2("바알 대장장이의 주입기","Vaal Blacksmith's Infuser")],["inf.armourer",L2("바알 방어구 장인의 주입기","Vaal Armourer's Infuser")],["inf.arcanist",L2("바알 신비학자의 주입기","Vaal Arcanist's Infuser")],["inf.catalysing",L2("바알 촉진시키는 주입기","Vaal Catalysing Infuser")]]],
[tt("퀄리티 화폐 가격 (Ex)","Quality currency prices (Ex)"),[["q.whetstone",L2("대장장이의 숫돌","Blacksmith's Whetstone")],["q.scrap",L2("방어구 장인의 고철","Armourer's Scrap")],["q.etcher",L2("신비학자의 식각기","Arcanist's Etcher")]]]];
const OFF=["inf.armourer","inf.arcanist","inf.catalysing","q.scrap","q.etcher"];
const gp=(o,p)=>p.split(".").reduce((a,k)=>a[k],o);
const sp=(o,p,v)=>{const a=p.split(".");const l=a.pop();a.reduce((x,k)=>x[k],o)[l]=v};
let S=JSON.parse(JSON.stringify(DEF)),BASES=[],PRICES={leagues:{}},TAB="weapon";
function loadSettings(){const s=LS.get("poe2bq:settings",{});S=Object.assign({},DEF,s,{inf:Object.assign({},DEF.inf,s.inf),q:Object.assign({},DEF.q,s.q)});OFF.forEach(k=>sp(S,k,0))}
function merge(a,b){const o={leagues:Object.assign({},a.leagues)};for(const k in(b.leagues||{})){const x=o.leagues[k],y=b.leagues[k];if(!x||String(y.collectedAt)>=String(x.collectedAt))o.leagues[k]=y}return o}
const leagueList=()=>[...new Set([...Object.keys(PRICES.leagues||{}),S.league])];
function panel(){let h=`<fieldset><legend>${tt("리그","League")}</legend><label><select data-k="league">${leagueList().map(l=>`<option${l===S.league?" selected":""}>${l}</option>`).join("")}</select></label></fieldset>`;
for(const[t,fs]of FIELDS())h+=`<fieldset><legend>${t}</legend>${fs.map(([k,l,u])=>`<label><span>${l}</span><span class="in"><input type="number" step="any" min="0" data-k="${k}" value="${gp(S,k)}"${OFF.includes(k)?" disabled":""}>${u?`<em>${u}</em>`:""}</span></label>`).join("")}</fieldset>`;
h+=`<div class="row"><label class="btn">${tt("가격 파일 불러오기","Load price file")}<input type="file" id="file" accept=".json" hidden></label><button class="sec" id="reset" type="button">${tt("설정 초기화","Reset settings")}</button></div><p class="st">${tt("설정은 이 브라우저에만 저장됩니다.","Settings are saved in this browser only.")}</p>`;
$("set").innerHTML=h;
$("set").querySelectorAll("[data-k]").forEach(e=>e.addEventListener("input",()=>{const k=e.dataset.k;sp(S,k,e.tagName==="SELECT"?e.value:Math.max(0,parseFloat(e.value)||0));LS.set("poe2bq:settings",S);render()}));
$("file").addEventListener("change",async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!d.leagues)throw 0;PRICES=merge(PRICES,d);LS.set("poe2bq:prices",PRICES);panel();render()}catch(x){alert(tt("올바른 prices.json 형식이 아닙니다.","Not a valid prices.json file."))}});
$("reset").addEventListener("click",()=>{LS.del("poe2bq:settings");loadSettings();panel();render()})}
const trim=(x,d)=>x.toLocaleString(LANG==="en"?"en-US":"ko-KR",{minimumFractionDigits:0,maximumFractionDigits:d});
const fm=(ex,d=1)=>S.div>0?trim(ex/S.div,d)+" D":Math.round(ex).toLocaleString(LANG==="en"?"en-US":"ko-KR")+" E";
const nm=b=>LANG==="en"?`${esc(b.en)}${b.ko?`<span class="en">${esc(b.ko)}</span>`:""}`:`${esc(b.ko||b.en)}${b.ko?`<span class="en">${esc(b.en)}</span>`:""}`;
function render(){
 const M=model(P2/100),lg=PRICES.leagues[S.league]||{entries:[]},need=Math.max(1,Math.ceil(1/M.P-1e-9));
 $("stats").innerHTML=[[tt("30% 도달 확률","Chance to reach 30%"),trim(M.P*100,1)+"%"],[tt("30% 1개당 평균 필요 베이스","Avg. bases needed per 30%"),trim(1/M.P,1)+tt("개","")],[tt("30% 1개당 평균 소모 Infuser","Avg. Infusers used per 30%"),trim(M.E/M.P,1)+tt("개","")],[tt("30% 1개당 평균 퀄리티 화폐","Avg. quality currency per 30%"),trim(M.Q/M.P,0)+tt("개","")]].map(([a,b])=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`).join("");
 $("tabs").innerHTML=Object.keys(CATS).map(c=>`<button type="button" class="tab${c===TAB?" on":""}" data-c="${c}">${LANG==="en"?CATS[c][1]:CATS[c][0]} <small>${LANG==="en"?CATS[c][0]:CATS[c][1]}</small></button>`).join("");
 $("tabs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{TAB=b.dataset.c;render()}));
 const groups=new Map();
 for(const b of BASES.filter(b=>b.cat===TAB)){const g=groups.get(b.cls)||{ko:b.clsKo,list:[]};groups.set(b.cls,g);
  const sm=lg.stopped||{},stp=v=>sm[b.id+":"+v]||sm[b.id];
  const es=(lg.entries||[]).filter(e=>e.base===b.id);
  const lv=[...new Set([...es.map(e=>e.ilvl),...[82,81].filter(stp)])].sort((x,y)=>y-x);
  if(!lv.length){g.list.push({b,msg:tt("수집 데이터 없음","No data collected")});continue}
  for(const v of lv){const st=stp(v);
   if(st){g.list.push({b,ilvl:v,msg:tt("수집 중지","Collection stopped"),tip:(st.reason||"")+(st.since?tt(" ("+st.since+" 이후)"," (since "+st.since+")"):"")});continue}
   const e=es.find(x=>x.ilvl===v);const B=e.buy0&&e.buy0.omitted?{omitted:true}:pick(e.buy0,S,need),T=pickFair(e.sell30,S,need);
   const r={b,e,B,T};if(B.ex!=null&&T.ex!=null)Object.assign(r,calc(B.ex,T.ex,S.inf[b.infuser],S.q[b.qcur],M));else r.msg=tt("데이터 부족","Insufficient data");g.list.push(r)}}
 let max=1;groups.forEach(g=>g.list.forEach(r=>{if(r.margin!=null)max=Math.max(max,Math.abs(r.margin))}));
 let h="";groups.forEach((g,cls)=>{h+=`<tr class="g"><td colspan="9">${LANG==="en"?esc(cls):esc(g.ko||cls)} <span class="en" style="display:inline">${LANG==="en"?esc(g.ko||cls):esc(cls)}</span></td></tr>`;
  for(const r of g.list){const b=r.b,e=r.e;
   if(!e){h+=r.ilvl!=null?`<tr><td>${nm(b)}</td><td>${b.req}</td><td>${r.ilvl}</td><td>${b.sockets==null?"-":b.sockets}</td><td colspan="5" class="dim" style="text-align:left"${r.tip?` title="${esc(r.tip)}"`:""}>${esc(r.msg)}</td></tr>`:`<tr><td>${nm(b)}</td><td>${b.req}</td><td colspan="7" class="dim" style="text-align:left">${esc(r.msg)}</td></tr>`;continue}
   const cell=(p)=>p.omitted?`<span class="dim">-</span><small>-${tt("개","")}</small>`:p.ex!=null?`${fm(p.ex)}<small${p.conf==="low"?' class="lo"':""}>${p.n}${tt("개"," listed")}${p.conf?" · "+CONF[p.conf]:""}</small>`:`<span class="dim">${tt("없음","None")}</span><small>${p.n}${tt("개"," listed")}</small>`;
   const cellT=p=>p.insufficient?`<span class="dim">${tt("데이터 부족","Insufficient data")}</span><small>${p.n}${tt("개"," listed")}</small>`:p.ex==null?cell(p):
    `${fm(p.ex)}<small${p.conf==="low"?' class="lo"':""}>${p.n}${tt("개"," listed")}${p.conf?" · "+CONF[p.conf]:""}${p.skipped?" · "+tt("저가 "+p.skipped+"개 제외",p.skipped+" low-priced excluded"):""}</small>`;
   const m=r.margin,w=m==null?0:Math.max(3,Math.abs(m)/max*100);
   h+=`<tr><td>${nm(b)}</td><td>${b.req}</td><td>${e.ilvl}</td><td>${e.sockets==null?"-":e.sockets}</td><td${r.B.reason?` title="${esc(r.B.reason)}"`:""}>${cell(r.B)}</td><td${r.T.reason?` title="${esc(r.T.reason)}"`:""}>${cellT(r.T)}</td>`+
   (m==null?`<td colspan="3" class="dim">${r.msg}</td>`:`<td>${fm(r.cost,0)}</td><td class="${m>=0?"pos":"neg"}">${m>=0?"+":"−"}${fm(Math.abs(m))}<i class="bar" style="width:${w}%;background:var(--${m>=0?"accent":"bad"})"></i></td><td class="${m>=0?"pos":"neg"}">${(r.roi*100).toFixed(0)}%</td>`)+`</tr>`}});
 $("rows").innerHTML=h||`<tr><td colspan="9" class="dim" style="text-align:left">${tt("이 카테고리에 베이스가 없습니다.","No bases in this category.")}</td></tr>`;
 $("src").textContent=lg.collectedAt?tt(`데이터: ${S.league} · 수집: ${lg.collectedAt}`,`Data: ${S.league} · Collected: ${lg.collectedAt}`):tt(`${S.league}: 수집된 가격 데이터가 없습니다. 가격 파일을 불러오세요.`,`${S.league}: No price data collected. Load a price file.`)}
async function jget(u){try{const r=await fetch(u,{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}}
(async()=>{
 const fb=JSON.parse($("fb").textContent);
 applyStatic();loadSettings();panel();
 BASES=fb.bases;
 PRICES=merge(LS.get("poe2bq:prices",{leagues:{}}),(await jget("out/prices.json"))||{leagues:{}});
 if(!PRICES.leagues[S.league]){const ks=Object.keys(PRICES.leagues).sort((a,b)=>String(PRICES.leagues[b].collectedAt).localeCompare(String(PRICES.leagues[a].collectedAt)));if(ks.length)S.league=ks[0]}
 panel();LS.set("poe2bq:prices",PRICES);render();
})();
</script>
</body>
</html>

<head>

<title>PoE 2 오버소켓 베이스 오버퀄리티 플리핑</title>

<style>
/* 이 파일에는 베이스 퀄리티 계산기에만 필요한 스타일만 둡니다. 폰트·색·버튼·패널·탭 등 공통 모양은 style/theme.css */
main.wrap{max-width:1142px}  /* 표(약 790px) + 설정 패널(300px)이 딱 맞는 폭. 서비스 공용 폭(1040px)보다 약간 넓게 */
.grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row .btn,.row button{margin:0;font-size:13.5px;line-height:1.2;min-height:38px;display:inline-flex;align-items:center;justify-content:center;text-align:center}
select:disabled{opacity:.4;cursor:not-allowed}
label>span:first-child{white-space:nowrap}
.in{display:flex;align-items:center;gap:6px}.in em{font-style:normal;color:var(--mute);font-size:12.5px}
.in input.ov{border-color:var(--g)}  /* 직접 수정한 값: poe.ninja 자동값 대신 이 값을 사용 중 */
.stats{margin-bottom:20px}
#src{margin:6px 0 0}
.tab small{font-weight:400;opacity:.8}
.tabs{overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none}  /* 탭 줄 우측 끝 스크롤바(화살표) 숨김 — 좁은 화면에서는 스크롤 자체는 유지 */
.tabs::-webkit-scrollbar{display:none;width:0;height:0}
.tbl{overflow-x:auto;background:var(--sf);border:1px solid color-mix(in oklab,var(--g) 40%,var(--ln));border-radius:var(--r);margin-bottom:16px}
/* 열 폭 고정: 보조 문구 길이 등 내용에 따라 열이 들쭉날쭉해지지 않게 함.
   - 베이스 열: 모든 탭의 장비명 중 가장 긴 것에 맞춤 (render() 의 fitBase 가 th 폭을 지정). iLvl 은 그 바로 옆.
   - 시장가·예상 마진: 고정 폭 / 나머지 숫자 열(0% 베이스·제작비·예상 수익률·권장): 남는 폭을 똑같이 나눠 가짐 */
table{table-layout:fixed;min-width:722px}
table.rec{min-width:782px}  /* 추천 탭: '권장' 열이 하나 더 있음 */
thead th:nth-child(2){width:52px}   /* iLvl */
thead th:nth-child(5){width:140px}  /* 시장가 (보조 문구가 가장 긺) */
thead th:nth-child(6){width:140px}  /* 예상 마진 */
thead th:nth-child(7){width:80px}   /* 예상 ROI: 머리글이 한 줄에 들어가는 최소 폭 */
table.rec thead th:nth-child(5){width:116px}
table.rec thead th:nth-child(6){width:112px}
thead th:nth-child(6),td.mg{padding-right:24px}  /* 예상 마진 열만 오른쪽 여백을 더 줌 */
thead th{white-space:normal;word-break:keep-all;line-height:1.3;vertical-align:bottom}
thead th:nth-child(3){white-space:nowrap}  /* '0% 베이스' 가 단어 중간에서 끊기지 않게 */  /* 영문 머리글이 길면 두 줄로 */
.sz{height:0;overflow:hidden;visibility:hidden;font:400 calc(var(--fs) - 1px)/var(--lh) var(--sans);white-space:nowrap}  /* 머리글 안의 보이지 않는 측정용 요소 */
.sz .en{font-size:13px;font-weight:400;font-family:var(--sans)}
.szi{display:inline-block}
.grid>div{min-width:0}  /* 표가 넓어도 페이지가 아니라 표 안에서만 가로 스크롤 */
.il{text-align:left}  /* iLvl: 베이스 옆에 기본 여백으로 */
th,td{padding:8px 12px;white-space:nowrap}
thead th{background:var(--sf2);border-bottom-color:var(--ln2)}
tbody tr:not(.g):hover td{background:color-mix(in oklab,var(--g) 6%,transparent)}
tr.g td{padding-top:9.5px;padding-bottom:9.5px;background:var(--sf2);font:600 15px var(--serif);color:var(--g);text-align:left;cursor:pointer;user-select:none}  /* 배경: 포인트 색을 섞지 않고 표의 다른 바탕색(헤더)과 같은 계열로 */
.ge{font:400 13px var(--sans);margin-left:4px;color:color-mix(in oklab,var(--mute) 75%,var(--ink))}  /* 카테고리 보조 이름(영문): 대문자·자간 없이, 표 안 영문 장비명과 같은 글꼴·크기·색 */
tr.g:focus-visible{outline-offset:-2px}
tr.g td::before{content:"";display:inline-block;width:6px;height:6px;margin-right:10px;background:var(--g);transform:rotate(45deg);vertical-align:2px}
tr.g.col td::before{background:none;border:1px solid var(--g)}  /* 접힘 표시: 속 빈 마름모 */
.en{display:block;font-size:12px;color:var(--mute);font-weight:400;font-family:var(--sans)}
tbody tr:not(.g) .en{font-size:13px;color:color-mix(in oklab,var(--mute) 75%,var(--ink))}  /* 표 안 영문 장비명: overquality-flip_new 스타일 (카테고리·설정 패널의 영문은 12px 그대로) */
.cnt{float:right;font:400 12px/1.8 var(--sans);color:var(--mute)}  /* 접힌 카테고리의 행 수 */
td small{display:block;color:var(--mute);font-size:12px;line-height:1.35;white-space:normal}  /* 보조 문구: 열 폭 안에서 · 기준으로 줄바꿈 */
td small .nw{white-space:nowrap}
.tl{margin-left:6px;color:var(--mute);text-decoration:none;font-size:12px}  /* 거래소 링크 */
.tl:hover{color:var(--g)}
.pos{color:var(--pos)}.neg{color:var(--bad)}.dim{color:var(--mute)}
/* 라이트(theme.css 기본값): 회색과 섞으면 흰 바탕에서 흐려 보이므로 대비가 충분한 진한 초록/빨강 사용 */
td.mg.pos,td.roi.pos{color:#0b6b32;text-shadow:none}
td.mg.neg,td.roi.neg{color:#b3202a;text-shadow:none}
/* 다크: 기존처럼 초록/빨강을 회색과 섞어 채도만 낮춤 (theme.css 의 다크 적용 조건과 동일: OS 설정 따라가기 / 직접 선택) */
@media(prefers-color-scheme:dark){
:root:not([data-theme="light"]) td.mg.pos,:root:not([data-theme="light"]) td.roi.pos{color:color-mix(in oklab,var(--pos) 60%,var(--mute))}
:root:not([data-theme="light"]) td.mg.neg,:root:not([data-theme="light"]) td.roi.neg{color:color-mix(in oklab,var(--bad) 60%,var(--mute))}}
:root[data-theme="dark"] td.mg.pos,:root[data-theme="dark"] td.roi.pos{color:color-mix(in oklab,var(--pos) 60%,var(--mute))}
:root[data-theme="dark"] td.mg.neg,:root[data-theme="dark"] td.roi.neg{color:color-mix(in oklab,var(--bad) 60%,var(--mute))}
/* 예상 마진: 설정 패널 제목(화폐 환율)과 같은 글꼴·굵기(명조 600). ROI는 다른 숫자와 똑같이 두고 색으로만 구분 */
.mg{font:600 16px/1.3 var(--serif)}
.devnote{margin:14px 0 0;font-size:12px;line-height:1.4;color:var(--g)}  /* '*개발자용' 안내: 버튼 글자와 같은 포인트 색 */
.devnote+.row{margin-top:4px}
/* 설정 패널 카테고리 제목(legend): 더블클릭으로 접기/펼치기 (표의 카테고리 행과 같은 방식) */
fieldset>legend{cursor:pointer;user-select:none}
fieldset>legend::before{width:6px;height:6px}
fieldset>legend:focus-visible{outline-offset:2px}
fieldset.col>legend::before{background:none;border:1px solid var(--g)}  /* 접힘 표시: 속 빈 마름모 */
fieldset.col>:not(legend){display:none}
#reset{color:var(--ink);border-color:var(--mute)}  /* 설정 초기화: 기본(보조 버튼) 색이 너무 어두워 비활성처럼 보여서 글자·테두리를 진하게 */
</style>
</head>

<script>
(()=>{const show=m=>{const e=document.getElementById("err");if(e){e.hidden=false;e.textContent=(document.documentElement.lang==="en"?"Error: ":"오류: ")+m}};
window.addEventListener("error",ev=>show(ev.message));
window.addEventListener("unhandledrejection",ev=>show(String(ev.reason&&ev.reason.message||ev.reason)))})();
/* 언어: 저장·동기화는 style/site-bar.js 가 담당. 여기서는 현재 언어를 읽고 "sitebar:lang" 이벤트만 구독 */
let LANG=(window.PoEPrefs&&window.PoEPrefs.lang)||(document.documentElement.lang==="en"?"en":"ko");
const tt=(ko,en)=>LANG==="en"?en:ko;
/* 본인 전용 '갱신 요청' 버튼: GitHub Actions workflow_dispatch 호출. 토큰은 코드에 없고, 처음 누를 때 입력받아 이 브라우저(localStorage)에만 저장 */
const GH={repo:"SingIeton/singIeton.github.io",wf:"update-prices.yml",ref:"main",key:"gh_dispatch_token"};
const updLabel=()=>tt("갱신 요청","Request update");
const updBtn=()=>`<button type="button" class="btn upd" title="${tt("GitHub Actions를 실행해 prices.json 을 갱신합니다. 반영까지 1~3분 걸립니다.","Runs GitHub Actions to refresh prices.json. Takes 1–3 minutes to appear.")}">${updLabel()}</button>`;
document.addEventListener("click",async e=>{const b=e.target.closest(".upd");if(!b||b.disabled)return;
 let t=null;try{t=localStorage.getItem(GH.key)}catch(x){}
 if(!t){t=(prompt(tt("GitHub 토큰을 입력하세요 (이 브라우저에만 저장됩니다)","Enter your GitHub token (stored only in this browser)"))||"").trim();if(!t)return;try{localStorage.setItem(GH.key,t)}catch(x){}}
 const say=(m,d)=>document.querySelectorAll(".upd").forEach(x=>{x.innerHTML=m;x.disabled=d});
 say(tt("요청 중…","Requesting…"),true);
 try{const r=await fetch(`https://api.github.com/repos/${GH.repo}/actions/workflows/${GH.wf}/dispatches`,{method:"POST",headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+t,"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},body:JSON.stringify({ref:GH.ref})});
  if(r.status===204)say(tt("요청 완료","Requested"),true);
  else{if([401,403,404].includes(r.status))try{localStorage.removeItem(GH.key)}catch(x){}say(tt("실패 ("+r.status+")","Failed ("+r.status+")"),true)}}
 catch(x){say(tt("네트워크 오류","Network error"),true)}
 setTimeout(()=>say(updLabel(),false),6000)});
function applyStatic(){document.querySelectorAll("[data-en]").forEach(e=>{if(e.dataset.ko===undefined)e.dataset.ko=e.textContent;e.textContent=LANG==="en"?e.dataset.en:e.dataset.ko});
document.title=tt("PoE 2 오버소켓 베이스 오버퀄리티 플리핑","PoE 2 Oversocket Base Overquality Flipping Profit Calculator")}
window.addEventListener("sitebar:lang",e=>{LANG=e.detail==="en"?"en":"ko";applyStatic();panel();render()});
//M
function model(p){const q=new Array(22).fill(0);for(let i=19;i>=0;i--)q[i]=1+(1-p)*q[i+1]+p*q[Math.min(i+2,20)];
const P=new Array(31).fill(0),E=new Array(31).fill(0);P[30]=1;
for(let i=29;i>=20;i--){const s=1-.05*(i-20),a=Math.min(i+2,30);P[i]=s*((1-p)*P[i+1]+p*P[a]);E[i]=1+s*((1-p)*E[i+1]+p*E[a]);}
return{P:P[20],E:E[20],Q:q[0]}}
function toEx(l,S){return l.c==="exalted"?l.a:l.c==="chaos"?(S.chaos>0?l.a*S.chaos:null):l.c==="divine"?(S.div>0?l.a*S.div:null):null}  /* 환율이 0 이면 0 Ex 가 아니라 환산 불가(null)로 취급 */
/* 0% 베이스 단가: '가장 싼 1개'가 아니라 필요 수량(k = 1/성공확률)을 싼 순서로 실제로 샀을 때의 평균 단가.
   1) 수집기(fair)가 '고립된 저가 이상치'로 제외한 매물은 똑같이 제외 (30% 판매가와 같은 기준, 표시되는 신뢰도·사유와 일치)
   2) 남은 매물을 싼 순서로 k개 채워 평균 (k 가 소수면 마지막 매물은 비율만큼)
   3) 매물이 k개보다 적으면 부족분은 가장 비싼 매물 가격으로 채움 (실제로는 그보다 비싸므로 하한치) + 신뢰도 하향 */
const CL=["low","medium","high"];
function pick(side,S,k){if(!side)return{n:0};const f=side.fair||{};
const n=side.total!=null?side.total:((side.listings||[]).length);
if(f.status==="insufficient")return{n,insufficient:true,reason:f.reason};
let v=(side.listings||[]).map(l=>toEx(l,S)).filter(x=>x!=null).sort((a,b)=>a-b);
v=v.slice(Math.min(f.skipped||0,Math.max(0,v.length-1)));
if(!v.length||n<MIN_N)return{n};
const kk=Math.max(1,k),need=Math.ceil(kk-1e-9);
let sum=0,left=kk;for(let i=0;left>1e-9;i++){const w=Math.min(1,left);sum+=w*v[Math.min(i,v.length-1)];left-=w}
const short=v.length<need;let conf=f.confidence||undefined;
if(short){const cap=v.length*2<need?"low":"medium";conf=CL[Math.min(CL.indexOf(conf||"high"),CL.indexOf(cap))]}

 for(const b of TAB==="rec"?BASES:BASES.filter(b=>b.cat===TAB)){const gk=TAB==="rec"?"":b.cls;const g=groups.get(gk)||{ko:b.clsKo,list:[]};groups.set(gk,g);
  const sm=lg.stopped||{},stp=v=>sm[b.id+":"+v]||sm[b.id];
  const es=(lg.entries||[]).filter(e=>e.base===b.id);
  const lv=[...new Set([...es.map(e=>e.ilvl),...[82,81].filter(stp)])].sort((x,y)=>y-x);
  if(!lv.length){g.list.push({b,msg:tt("수집 데이터 없음","No data collected")});continue}
  for(const v of lv){const st=stp(v);
   if(st){if(v===81)continue;g.list.push({b,ilvl:v,msg:tt("수집 중지 (데이터 부족)","Collection stopped (insufficient data)"),tip:(st.reason||"")+(st.since?tt(" ("+fmT(st.since)+" 이후)"," (since "+fmT(st.since)+")"):"")+(st.checkedAt?tt(" · 마지막 확인 "+fmT(st.checkedAt)," · last checked "+fmT(st.checkedAt)):"")});continue}
   const e=es.find(x=>x.ilvl===v);const B=e.buy0&&e.buy0.omitted?{omitted:true}:pick(e.buy0,S,1/M.P),T=pickFair(e.sell30,S,need);
   const r={b,e,B,T};if(B.ex!=null&&T.ex!=null)Object.assign(r,calc(B.ex,T.ex,S.inf[b.infuser],S.q[b.qcur],M));else r.msg=tt("데이터 부족","Insufficient data");g.list.push(r)}}
 if(TAB==="rec"){const g=groups.get("");if(g){const sc=r=>Math.pow(r.margin,REC_W)*Math.pow(r.roi,1-REC_W);  /* 마진·수익률이 모두 양수인 행만 대상 */
  g.list=g.list.filter(r=>r.margin>0&&r.roi>=REC_MIN_ROI&&r.B.conf!=="low"&&r.T.conf!=="low").sort((a,b)=>sc(b)-sc(a)).slice(0,REC_N)}}  /* 0% 베이스·시장가 중 하나라도 신뢰 낮음이면 제외 */
 let h="";groups.forEach((g,cls)=>{const isOpen=!COL.has(cls);
  if(TAB!=="rec")h+=`<tr class="g${isOpen?"":" col"}" data-cls="${esc(cls)}" tabindex="0" role="button" aria-expanded="${isOpen}" title="${tt("더블클릭으로 접기/펼치기","Double-click to collapse/expand")}"><td colspan="${NC}">${LANG==="en"?`${esc(cls)} <span class="ge">${esc(g.ko||cls)}</span>`:`${esc(g.ko||cls)} <span class="ge">${esc(cls)}</span>`}${isOpen?"":`<span class="cnt">${tt(g.list.length+"행 접힘",g.list.length+" rows hidden")}</span>`}</td></tr>`;
  if(TAB!=="rec"&&!isOpen)return;
  for(const r of g.list){const b=r.b,e=r.e;
   if(!e){h+=r.ilvl!=null?`<tr><td>${nm(b)}</td><td class="il">${r.ilvl}</td><td colspan="${NC-2}" class="dim" style="text-align:center"${r.tip?` title="${esc(r.tip)}"`:""}>${esc(r.msg)}</td></tr>`:`<tr><td>${nm(b)}</td><td colspan="${NC-1}" class="dim" style="text-align:center">${esc(r.msg)}</td></tr>`;continue}
   const cs=p=>[p.short?tt(p.have+"개",p.have+(p.have===1?" listing":" listings")):p.n>=1&&p.n<=9?tt(p.n+"개",p.n+(p.n===1?" listing":" listings")):"",p.conf?CONF[p.conf]:""].filter(Boolean).map(x=>`<span class="nw">${x}</span>`).join(" · ");
   const sm=p=>{const t=cs(p);return t?`<small>${t}</small>`:""};
   const lk=side=>`<a class="tl" href="${esc(tradeUrl(b,e.ilvl,side))}" target="_blank" rel="noopener" title="${tt("거래소에서 보기","Open in trade site")}" aria-label="${tt("거래소에서 보기","Open in trade site")}">↗</a>`;
   const cell=(p,side)=>p.omitted?`<span class="dim">-</span>`:p.insufficient?`<span class="dim">${tt("데이터 부족","Insufficient data")}</span>${lk(side)}`:p.ex!=null?`${fm(p.ex)}${lk(side)}${sm(p)}`:`<span class="dim">${tt("없음","None")}</span>${lk(side)}`;
   const cellT=(p,side)=>p.insufficient?`<span class="dim">${tt("데이터 부족","Insufficient data")}</span>${lk(side)}`:p.ex==null?cell(p,side):`${fm(p.ex)}${lk(side)}${sm(p)}`;
   const m=r.margin;
   h+=`<tr><td>${nm(b)}</td><td class="il">${e.ilvl}</td><td${r.B.reason?` title="${esc(r.B.reason)}"`:""}>${cell(r.B,"buy0")}</td>`+
   (m==null?`<td><span class="dim">-</span><small>&#12288;</small></td>`:`<td>${fm(r.cost,0)}<small>&#12288;</small></td>`)+
   `<td${r.T.reason?` title="${esc(r.T.reason)}"`:""}>${cellT(r.T,"sell30")}</td>`+
   (m==null?`<td colspan="${NC-5}" class="dim">${r.msg}</td>`:`<td class="mg ${m>=0?"pos":"neg"}">${m>=0?"+":"−"}${fmM(Math.abs(m))}</td><td class="roi ${m>=0?"pos":"neg"}">${(r.roi*100).toFixed(0)}%</td>`+(REC?triesCell(r,M):""))+`</tr>`}});
 $("rows").innerHTML=h||`<tr><td colspan="${NC}" class="dim" style="text-align:left">${TAB==="rec"?tt("추천할 데이터가 없습니다.","Nothing to recommend yet."):tt("이 카테고리에 베이스가 없습니다.","No bases in this category.")}</td></tr>`;
 /* 수집 로그: 경매장(GGG 거래소) 데이터와 환율(poe.ninja) 데이터는 수집 시각이 서로 달라 한 줄에 구분해 표시 */
 const aT=tt("경매장 데이터: ","Trade-site data: ")+(lg.collectedAt?fmT(lg.collectedAt):tt("없음 (가격 파일을 불러오세요)","none (load a price file)")),
  rT=tt("환율 데이터: ","Rates data: ")+(lg.rates&&lg.rates.updatedAt?fmT(lg.rates.updatedAt):tt("없음 (기본값 사용)","none (using defaults)"));
 $("src").textContent=aT+" · "+rT}
async function jget(u){try{const r=await fetch(u,{cache:"no-store"});return r.ok?await r.json():null}catch(e){return null}}
(async()=>{
 const fb=JSON.parse($("fb").textContent);
 const tg=tr=>{const c=tr.dataset.cls;COL.has(c)?COL.delete(c):COL.add(c);render()};
 $("rows").addEventListener("dblclick",e=>{const tr=e.target.closest("tr.g");if(tr)tg(tr)});
 const tgS=lg=>{const fs=lg.parentNode,i=+fs.dataset.i;COLP.has(i)?COLP.delete(i):COLP.add(i);fs.classList.toggle("col",COLP.has(i));lg.setAttribute("aria-expanded",!COLP.has(i))};  /* 설정 패널은 다시 그리지 않고 클래스만 바꿈 */
 $("set").addEventListener("dblclick",e=>{const lg=e.target.closest("fieldset>legend");if(lg)tgS(lg)});
 $("set").addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const lg=e.target.closest("fieldset>legend");if(!lg)return;e.preventDefault();tgS(lg)});
 $("rows").addEventListener("keydown",e=>{if(e.key!=="Enter"&&e.key!==" ")return;const tr=e.target.closest("tr.g");if(!tr)return;e.preventDefault();const c=tr.dataset.cls;tg(tr);const n=[...$("rows").querySelectorAll("tr.g")].find(x=>x.dataset.cls===c);if(n)n.focus()});
 applyStatic();loadSettings();panel();
 BASES=fb.bases;
 const cached=LS.get("poe2bq:prices",{leagues:{}}),fresh=await jget("out/prices.json");
 if(fresh&&fresh.leagues)for(const k of Object.keys(cached.leagues||{}))if(!fresh.leagues[k])delete cached.leagues[k];  /* 서버의 prices.json 이 있으면 그 파일이 기준: 파일에 없는 리그의 브라우저 캐시는 버림 */
 PRICES=merge(cached,fresh||{leagues:{}});
 fixLeague();autoCollapse();
 panel();LS.set("poe2bq:prices",PRICES);render();
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitBase);  /* 웹폰트가 늦게 로드돼도 폭 재측정 */
})();
</script>

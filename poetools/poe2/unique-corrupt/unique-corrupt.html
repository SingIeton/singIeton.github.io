<!DOCTYPE html>
<html lang="ko" data-game="poe2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고유 타락 플리핑 | PoE Tools</title>
<link rel="stylesheet" href="../../style/theme.css">
<script src="../../style/site-bar.js"></script>
<style>
.layout{display:grid;grid-template-columns:var(--aw,235px) minmax(0,1fr);gap:55px;align-items:start;margin-left:calc(-1*((max(16px,50vw - 504px) - max(16px,50vw - 584px)) + min(290px,max(0px,max(16px,50vw - 584px) - 16px))) - (var(--aw,235px) - 235px) + var(--sx,0px))}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr);margin-left:0}.wrapd{flex-direction:column}.final{flex-direction:row!important;flex-wrap:wrap}}
.layout.stack{grid-template-columns:minmax(0,1fr);margin-left:0;gap:24px}
.layout.stack section{padding-left:var(--sp,0px)}
.lh{font:600 15px var(--serif);color:var(--mute);margin:0 0 8px}
.dt{font:600 18px var(--serif);margin:0 0 6px}
.list{display:flex;flex-direction:column;gap:2px;min-width:0}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;padding:8px 10px;border:0;border-radius:var(--r);background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}
.row.hi{grid-template-columns:auto 1fr auto;column-gap:10px;align-items:center}
.row .ic{grid-row:1/3;width:36px;height:36px;object-fit:contain}
.row:hover{background:var(--sf2)}
.row.on{background:color-mix(in oklab,var(--g) 14%,transparent)}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{font:600 15.5px var(--serif);font-variant-numeric:tabular-nums;text-align:right}
.row small{color:var(--mute);font-size:12.5px}
.row small:first-of-type{min-width:0;overflow:hidden;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--bad)}
.tree{overflow-x:auto}
.tree svg{display:block;width:100%;height:auto;font-family:var(--sans)}
.tree text{fill:var(--ink);font-size:16px;paint-order:stroke;stroke:var(--sf);stroke-width:4px;stroke-linejoin:round}
.tree .mu{fill:var(--mute);font-size:12.5px}
.tree .ed{fill:none}
.tree .bp{font-family:var(--serif);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.tree a{cursor:pointer;text-decoration:none}.tree a tspan{fill:var(--mute);font-size:17px;font-weight:300}  /* 거래소 링크 */
.tree a:hover tspan{fill:var(--g)}
.tree .lw{fill:var(--bad)}.tree .nd,.tree .gd{cursor:pointer}.tree .off{opacity:.4} /* 검색 매물 부족 -> ratio 대체 시 매물 건 텍스트 */
.tree .tp,.tree .tn{font-family:var(--serif);font-weight:600;font-size:15.5px;font-variant-numeric:tabular-nums}.tree .tp{fill:var(--pos)}.tree .tn{fill:var(--bad)}
.tree .gp{font-size:14px;font-weight:600}
.wrapd{display:flex;gap:42px;align-items:stretch}
.wrapd .tree{flex:1 1 auto;min-width:0}
.final{flex:0 0 auto;margin-top:50;display:flex;flex-direction:column;gap:14px;min-width:185px}
.final .k{display:block;color:var(--mute);font-size:14px}
.final .v{font:600 22px/1.3 var(--serif);font-variant-numeric:tabular-nums}
.formula{margin:10px 0 0;color:var(--mute);font-size:13.5px}
.final input[type=range]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;height:18px;margin:2px 0 0;background:none;cursor:pointer} /* 폭은 sizeFlt()가 항목 표시 단위 버튼 폭에 맞춤 */
.final input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:color-mix(in oklab,var(--mute) 35%,transparent)}
.final input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:color-mix(in oklab,var(--mute) 35%,transparent)}
.final input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border:0;border-radius:50%;background:var(--ink)}
.final input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--ink)}.final .k b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;margin-top:4px;background:var(--sf2);border-radius:var(--r);padding:2px}.seg button{font:inherit;font-size:13.5px;color:var(--mute);background:none;border:0;border-radius:var(--r);padding:4px 12px;cursor:pointer}.seg button.on{background:color-mix(in oklab,var(--g) 14%,transparent);color:var(--ink);font-weight:600}
#meta{margin-top:auto;text-align:right;white-space:pre-line;color:var(--mute);font-size:13px;line-height:1.5}
#sort{display:flex;width:fit-content;margin:0 auto 10px}
.empty{color:var(--mute);padding:24px 0;text-align:center}
.empty code{font-family:var(--mono)}
/* 디버그용 테두리 (우측 하단 버튼으로 켜고 끔): 필요 없으면 이 블록과 #dbg 버튼, 스크립트 한 줄 삭제 */
body.dbg .layout{outline:1px dashed red}
body.dbg aside,body.dbg .list{outline:1px dashed orange}
body.dbg .row{outline:1px dashed gold}
body.dbg .row .ic{outline:1px dashed lime}
body.dbg section,body.dbg #detail{outline:1px dashed deepskyblue}
body.dbg .wrapd{outline:1px dashed blue}
body.dbg .tree{outline:1px dashed magenta}
body.dbg .final,body.dbg .final>div,body.dbg .seg{outline:1px dashed cyan}
body.dbg .ghead{outline:1px dashed gray}
#dbg{position:fixed;right:12px;bottom:12px;z-index:50;font:inherit;font-size:12.5px;color:var(--mute);background:var(--sf2);border:0;border-radius:var(--r);padding:5px 10px;cursor:pointer;opacity:.8}#dbg:hover{opacity:1;color:var(--ink)}
#dbg.on{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main class="wrap" id="main">
  <div class="ghead sm"><span class="mini" aria-hidden="true">2</span><div><a class="game" href="../poe2.html">Path of Exile 2</a><h1 data-en="Unique Corruption Flipping">고유 타락 플리핑</h1><p class="sub" data-en="Expected corruption return for unique items, with the expected market price and profit/loss of every corruption outcome visualized">고유 장비의 타락 분기별 시장가와 예상 손익을 시각화하고, 총 평균 손익을 예상.</p></div></div>
  <div class="layout">
    <aside><div class="seg" id="sort"><button type="button" data-s="default" data-en="Default">기본</button><button type="button" data-s="name" data-en="Name">이름</button><button type="button" data-s="rate" data-en="Return">수익</button></div><div class="list" id="list"></div></aside>
    <section><div id="detail"></div></section>
  </div>
</main>
<button type="button" id="dbg" aria-pressed="false">DEBUG</button>

<script>
/* 데이터 파일 목록: 스크립트가 만든 파일명을 여기에 추가합니다.
   각 파일은 window.UC_DATA.push({...}) 형식입니다.

   데이터 구조:
   {
     name, base, unit, cost, vaalCost,   // 영문이 기본. 한글 번역이 있으면 ko / baseKo / rootTextKo 필드를 추가 (없으면 영문 표시)
     steps:[{label, ko, cost}],   // (선택) 베이스에서 수평으로 이어지는 가공 노드 (cost = 베이스 + 가공 비용 합산가). 총 비용의 베이스 비용은 마지막 노드의 cost 를 사용
     rootText:["문구1","문구2"],   // (선택) root(베이스) 노드 아래에 표시되는 문자열 목록 (스크립트의 root_text 에서 수정)
     (baseUrl: 베이스 구매 검색 링크(선택). 모든 outcomes 항목에는 선택 필드 url: "경매장 검색 링크" 사용 가능. outcomes 항목의 low:true = 검색 매물 부족으로 ratio(또는 변화 없음) 가격을 쓴 경우, 매물 건 텍스트를 붉게 표시)
     outcomes:[ {group:"none"|"reroll"|"vaal"|"socket", label, p, price, n}, ... ]   // 수치 변동(reroll)도 값(-3/-4/-5 등)마다 동등한 항목 1개
   } */
/* 데이터 파일 목록은 uniques/index.js (스크립트가 자동 갱신) 에서 읽습니다. */

/* 언어: 저장·동기화는 style/site-bar.js 가 담당. 현재 언어를 읽고 "sitebar:lang" 이벤트만 구독 */
let LANG=(window.PoEPrefs&&window.PoEPrefs.lang)||(document.documentElement.lang==="en"?"en":"ko");
const tt=(ko,en)=>LANG==="en"?en:ko;
/* 데이터는 영문(label/name/base)이 기본. 한글 번역이 있으면 ko/baseKo/rootTextKo 필드에 있고, 없으면 영문 그대로 표시 */
const pk=(o,f)=>LANG==="ko"&&o.ko?o.ko:o[f];
function applyStatic(){document.querySelectorAll("[data-en]").forEach(e=>{if(e.dataset.ko===undefined)e.dataset.ko=e.textContent;e.textContent=LANG==="en"?e.dataset.en:e.dataset.ko});
document.title=tt("고유 타락 플리핑 | PoE Tools","Unique Corruption Flipping | PoE Tools")}
const GROUPS={none:["No change","변화 없음"],reroll:["Value reroll","수치 변동"],vaal:["Enchant added","인챈트 추가"],socket:["Socket added","소켓 추가"]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=1)=>Number(v).toLocaleString(LANG==="en"?"en-US":"ko-KR",{maximumFractionDigits:d});
const fp=v=>Math.abs(v)>=10?fmt(v,0):fmt(v,1); /* 가격: 두 자리 수 이상은 정수로 반올림, 그 외 소수점 한 자리(0 제외) */
const pf=v=>Math.abs(v)>=10?fmt(v,0):fmt(v,1); /* 퍼센트 값: 두 자리 수 이상은 소수점 제거 */
const pct=v=>pf(Math.abs(v)*100)+"%"; /* 부호(+/-) 없이 절댓값만 표시, 증감은 색상으로 구분 */
const spct=v=>(v<0?"-":"")+pct(v); /* 수익률 전용: 음수에 - 표시 */
const sd=v=>(v<0?"-":"+")+fp(Math.abs(v)); /* 부호 포함 가격 */
const cls=v=>v>0?"pos":v<0?"neg":"";
const unitOf=it=>(!it.unit||it.unit==="div")?"d":it.unit; /* 단위 표시: div -> d */

window.UC_DATA=[];
let SORT="default"; /* 목록 정렬: default = js 파일(데이터) 순서, name = 이름순, rate = 수익률 높은 순 */
let FILTER=10; /* 기여도 필터(%): 총 이익 비율이 이 값 미만인 노드의 수익은 숨김 */
let MODE="amt"; /* 항목별 수익 표시: amt = 금액, pct = 총 평균 수익 대비 기여 비율 */
let items=[],sel=null,TH=785,TW=680,VW=680; /* TH: 트리 높이(내부 좌표). fit()이 화면 세로 크기에 맞춰 자동 갱신 */

const CMP={default:(a,b)=>a.ord-b.ord,name:(a,b)=>pk(a,"name").localeCompare(pk(b,"name"),LANG==="en"?"en":"ko",{numeric:true}),rate:(a,b)=>b.rate-a.rate};
function sortItems(){ /* 정렬 후에도 선택된 장비 유지 */
  const cur=items[sel];
  items.sort((a,b)=>CMP[SORT](a,b)||CMP.name(a,b));
  sel=items.length?(cur?items.indexOf(cur):0):null;
}
function analyze(it){
  const steps=it.steps||[],baseCost=steps.length?steps[steps.length-1].cost:it.cost,total=baseCost+(it.vaalCost||0),off=it.off||[]; /* off: 계산에서 제외한 outcomes 인덱스 */
  const outs=(it.outcomes||[]).map((o,i)=>({...o,i,off:off.includes(i),profit:o.price-total,rate:(o.price-total)/total}));
  const on=outs.filter(o=>!o.off);
  const psum=on.reduce((a,o)=>a+o.p,0)||1; // 확률 합이 1이 아니어도 정규화
  const avg=on.reduce((a,o)=>a+o.p*o.price,0)/psum;
  return {...it,off,baseCost,total,outs,psum,avg,profit:avg-total,rate:(avg-total)/total};
}

/* 목록 폭 = 가장 긴 항목의 폭 (최소 235px). 본문 위치는 고정, 목록은 왼쪽으로 확장 (--aw 를 .layout 이 사용) */
function sizeList(){
  const L=document.querySelector(".layout"),l=$("list");
  l.style.width="max-content";const w=Math.ceil(l.getBoundingClientRect().width);l.style.width="";
  L.style.setProperty("--aw",Math.min(LIST_MAX,Math.max(235,w))+"px"); /* 목록 최대 폭 제한 */
}
const LIST_MAX=320; /* 목록 최대 폭(px). 이름이 넘치면 글자 크기를 줄여 맞춤 */
function fitList(){
  document.querySelectorAll("#list .nm,#list .row small:first-of-type").forEach(el=>{
    el.style.fontSize="";let fs=parseFloat(getComputedStyle(el).fontSize);
    while(el.scrollWidth>el.clientWidth+0.5&&fs>9){fs-=0.5;el.style.fontSize=fs+"px"}
  });
}
/* 아이콘: ../icon/uniques/<이름>.webp (이름 = 괄호 부분을 뺀 영문 이름을 소문자·하이픈으로. 데이터에 icon 이 있으면 그 값 사용) */
const iconOf=it=>{const s=it.icon||String(it.name).replace(/\s*\(.*\)\s*$/,"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");return s?"../icon/uniques/"+s+".webp":""};
function renderList(){
  $("list").innerHTML=items.length?items.map((it,i)=>`<button class="row hi${i===sel?" on":""}" data-i="${i}"><img class="ic" src="${esc(iconOf(it))}" alt="" width="36" height="36" onerror="this.parentNode.classList.remove('hi');this.remove()"><span class="nm">${esc(pk(it,"name"))}</span><span class="rt ${cls(it.rate)}">${spct(it.rate)}</span><small>${esc([LANG==="ko"&&it.ko?it.name:"",(LANG==="ko"&&it.baseKo?it.baseKo:(it.base||"")).replace(/샘플\s*/g,"")].filter(Boolean).join(" · "))}</small><small style="text-align:right">${fp(it.baseCost)} → ${fp(it.avg)} ${esc(unitOf(it))}</small></button>`).join(""):`<div class="empty">${tt("분석된 장비가 없습니다.","No items analyzed.")}</div>`;
}

function renderDetail(){
  const it=items[sel];
  if(!it){
    $("detail").innerHTML=`<div class="empty">${items.length?tt("왼쪽 목록에서 장비를 선택하세요.","Select an item from the list on the left."):tt("<code>uniques/</code> 폴더에 데이터 파일이 없습니다. 스크립트를 실행하세요.","No data files in the <code>uniques/</code> folder. Run the script.")}</div>`;
    return;
  }
  const u=esc(unitOf(it));
  const st=it.steps||[],W=VW=Math.max(TW,560+90*st.length),pad=14,padB=34,RX=8,LX=W-320,POS=0.62,GX=RX+POS*(LX-RX); /* 그룹 노드 위치 = 시작점에서 마지막 점까지 거리 */
  const SX=st.map((s,i)=>RX+(GX-RX)*(i+1)/(st.length+1)),FX=st.length?SX[st.length-1]:RX; /* 베이스에서 수평으로 이동한 가공 노드 x 좌표, FX = 마지막 베이스 노드 x */
  const gs=Object.keys(GROUPS).filter(g=>it.outs.some(o=>o.group===g)).map(g=>{
    const rs=it.outs.filter(o=>o.group===g),on=rs.filter(o=>!o.off),ps=on.reduce((a,o)=>a+o.p,0);
    return {g,rs,off:!on.length,p:ps/it.psum,avg:ps?on.reduce((a,o)=>a+o.p*o.price,0)/ps:0};
  });
  const gaps=gs.slice(1).map((G,i)=>Math.max(14,76-(gs[i].rs.length+G.rs.length)*20)),gsum=gaps.reduce((a,v)=>a+v,0); /* 대분류 간격: 항목이 적은 그룹끼리는 라벨이 겹치지 않도록 넓힘 */
  const HH=Math.max(TH,pad+padB+gsum+it.outs.length*40); /* 줄 높이가 너무 좁아지지 않도록 최소 높이 보장 */
  const LH=(HH-pad-padB-gsum)/it.outs.length; /* 트리 총 높이 고정: 항목 수에 따라 줄 높이 자동 계산 */
  let y=pad;
  gs.forEach((G,i)=>{G.rs.forEach(o=>{o.cy=y+LH/2;y+=LH});G.cy=(G.rs[0].cy+G.rs[G.rs.length-1].cy)/2;y+=gaps[i]||0});
  const H=HH,rcy=gs.reduce((a,G)=>a+G.cy,0)/gs.length;
  const EDGE_SCALE=30,EDGE_MIN=2,EDGE_MAX=12.5; /* 선 두께 = 비율×EDGE_SCALE, EDGE_MIN~EDGE_MAX로 제한 */
  const edge=(x1,y1,x2,y2,w,c)=>{const m=(x1+x2)/2;return `<path class="ed" d="M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}" stroke="${c}" stroke-opacity=".5" stroke-width="${Math.max(EDGE_MIN,Math.min(EDGE_MAX,w*EDGE_SCALE)).toFixed(1)}" stroke-linecap="round"/>`};
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  st.forEach((s,i)=>{svg+=edge(i?SX[i-1]:RX,rcy,SX[i],rcy,1,"var(--g)")});
  gs.forEach(G=>{
    if(!G.off)svg+=edge(FX,rcy,GX,G.cy,G.p,"var(--g)");
    G.rs.forEach(o=>{if(!o.off)svg+=edge(GX,G.cy,LX,o.cy,o.p/it.psum,"var(--g)")});
  });
  const link=url=>url?`<a href="${esc(url)}" target="_blank" rel="noopener" aria-label="${tt("거래소에서 보기","Open in trade site")}"><title>${tt("거래소에서 보기","Open in trade site")}</title><tspan dx="6">↗</tspan></a>`:"";
  const rt=(LANG==="ko"&&it.rootTextKo)||it.rootText||[];
  svg+=`<circle cx="${RX}" cy="${rcy}" r="8" fill="var(--g)"/><text x="${RX}" y="${rcy-36}" style="font-weight:700">${tt("베이스","Base")}${link(it.baseUrl)}</text>`;
  svg+=`<text class="bp" x="${RX}" y="${rcy-17}">${st.length?fmt(it.cost,1):fp(it.cost)} ${u}</text>`;
  rt.forEach((c,i)=>{svg+=`<text class="mu" x="${RX}" y="${rcy+26+i*15}">${esc(c)}</text>`});
  st.forEach((s,i)=>{svg+=`<circle cx="${SX[i]}" cy="${rcy}" r="8" fill="var(--g)"/><text x="${SX[i]}" y="${rcy-36}" text-anchor="middle" style="font-weight:700">${esc(pk(s,"label"))}</text><text class="bp" x="${SX[i]}" y="${rcy-17}" text-anchor="middle">${fmt(s.cost,1)} ${u}</text>`}); /* 가공 노드: 이름 + (베이스+가공 비용) 가격, 하부 조건 표시 없음 */
  gs.forEach(G=>{
    svg+=`<g${G.off?' class="off"':""}><circle class="gd" data-g="${G.g}" cx="${GX}" cy="${G.cy}" r="14" fill="transparent"><title>${tt("클릭하여 하위 항목 전체를 계산에서 제외/포함","Click to exclude/include all children in calculation")}</title></circle><circle cx="${GX}" cy="${G.cy}" r="8" pointer-events="none" ${G.off?'fill="none" stroke="var(--mute)" stroke-width="2"':'fill="var(--g)"'}/><text x="${GX}" y="${G.cy-16}" text-anchor="middle" style="font-weight:700">${tt(GROUPS[G.g][1],GROUPS[G.g][0])}</text>${G.off?"":`<text class="mu" x="${GX}" y="${G.cy+28}" text-anchor="middle">${pf(G.p*100)}%</text><text class="gp ${G.avg>=it.total?"tp":"tn"}" x="${GX}" y="${G.cy+46}" text-anchor="middle">${sd(G.avg-it.total)} ${u} (${spct((G.avg-it.total)/it.total)})</text>`}</g>`;
    G.rs.forEach(o=>{
      const pos=o.rate>=0,sh=it.profit?Math.abs((o.p/it.psum)*o.profit/it.profit):1; /* sh: 노드 기여도 */
      svg+=`<circle class="nd" data-i="${o.i}" cx="${LX}" cy="${o.cy}" r="12" fill="transparent"><title>${tt("클릭하여 계산에서 제외/포함","Click to exclude/include in calculation")}</title></circle><circle cx="${LX}" cy="${o.cy}" r="6" pointer-events="none" ${o.off?'fill="none" stroke="var(--mute)" stroke-width="2"':`fill="${pos?"var(--pos)":"var(--bad)"}"`}/><g${o.off?' class="off"':""}><text x="${LX+16}" y="${o.cy-3}" style="font-weight:600;font-size:15.5px">${esc(pk(o,"label"))}${o.est?esc(tt(" (추정)"," (est.)")):""}${o.url?`<a href="${esc(o.url)}" target="_blank" rel="noopener" aria-label="${tt("거래소에서 보기","Open in trade site")}"><title>${tt("거래소에서 보기","Open in trade site")}</title><tspan dx="6">↗</tspan></a>`:""}</text>${o.off?"":`<text class="mu" x="${LX-14}" y="${o.cy+4}" text-anchor="end">${pf(o.p/it.psum*100)}%</text>`}<text class="mu" x="${LX+16}" y="${o.cy+15}">${fp(o.price)} ${u}${o.n!=null?` · ${o.low?'<tspan class="lw">':""}${tt(fmt(o.n,0)+" 개",fmt(o.n,0)+(o.n===1?" listing":" listings"))}${o.low?"</tspan>":""}`:""}</text>${o.off?"":`<text class="${pos?"tp":"tn"}" data-sh="${sh}"${sh<FILTER/100?' style="display:none"':""} x="${W-15}" y="${o.cy+5}" text-anchor="end">${MODE==="pct"?spct(it.profit?(o.p/it.psum)*o.profit/it.profit:0):sd(o.profit)+" "+u}</text>`}</g>`;
    });
  });
  svg+="</svg>";
  $("detail").innerHTML=`<div class="wrapd"><div class="tree">${svg}</div>
  <div class="final">
    <div><span class="k">${tt("예상 평균 수익","Expected average profit")}</span><b class="v ${cls(it.profit)}">${fp(Math.abs(it.profit))} ${u}</b></div>
    <div><span class="k">${tt("예상 수익률","Expected return")}</span><b class="v ${cls(it.profit)}">${spct(it.rate)}</b></div>
    <div><span class="k">${tt("예상 평균 판매가","Expected average sale price")}</span><b class="v">${fp(it.avg)} ${u}</b></div>
    <div><span class="k">${tt("항목 표시 단위","Item display unit")}</span><div class="seg"><button type="button" data-m="amt" class="${MODE==="amt"?"on":""}">${tt("금액","Amount")}</button><button type="button" data-m="pct" class="${MODE==="pct"?"on":""}" title="${tt("마이너스(-) 값까지 합산한 결과이므로 100%를 초과할 수 있습니다.","Negative values are included in the sum, so the total can exceed 100%.")}">${tt("총 이익 비율","Share of total gain")}</button></div></div>
    <div><span class="k">${tt("기여도 필터","Contribution filter")} <b id="fltv">${FILTER}%</b></span><input type="range" id="flt" min="0" max="50" step="1" value="${FILTER}" title="${tt("총 이익 비율이 이 값 미만인 노드의 수익을 숨깁니다.","Hides node profits whose share of total gain is below this value.")}"></div>
    <div id="meta"></div>
  </div></div>`;
  showMeta();sizeFlt();
}
function sizeFlt(){const sg=document.querySelector(".final .seg"),f=$("flt");if(sg&&f)f.style.width=sg.offsetWidth+"px"} /* 슬라이더 폭 = 항목 표시 단위 버튼 폭 */

function align(){
  const L=document.querySelector(".layout"),h=document.querySelector(".ghead h1"),A=L.querySelector("aside");
  L.classList.remove("stack");L.style.setProperty("--sx","0px");L.style.setProperty("--sp","0px");
  const c=()=>L.querySelector(".tree circle");
  if(matchMedia("(max-width:900px)").matches||!h||!c())return;
  const M=document.querySelector(".ghead .mini")||h;
  const tx=()=>M.getBoundingClientRect().left; /* 문 모양 아이콘의 왼쪽 끝 */
  const cx=()=>c().getBoundingClientRect().left; /* 트리 시작 원의 왼쪽 끝 */
  const d=tx()-cx();
  if(A.getBoundingClientRect().left+d>=16){
    L.style.setProperty("--sx",d+"px");
    L.style.setProperty("--sx",(d-(cx()-tx()))+"px"); /* 남은 오차 보정 */
    return;
  }
  /* 목록을 옮길 여백이 없으면 목록을 위로 올리고 본문만 제목에 맞춤 */
  L.classList.add("stack");
  const v=tx()-cx();
  L.style.setProperty("--sp",v+"px");
  L.style.setProperty("--sp",(v-(cx()-tx()))+"px");
}
/* 트리가 화면 세로 크기(뷰포트 높이)에 딱 맞도록 TH를 계산 */
function fit(){
  for(let i=0;i<3;i++){
    const s=document.querySelector(".tree svg");if(!s)return;
    const r=s.getBoundingClientRect(),top=r.top+scrollY;
    const t=Math.round((innerHeight-top-16)*VW/r.width); /* 16 = 아래쪽 여백(px) */
    const w=Math.round(document.querySelector(".tree").clientWidth); /* 트리 박스 실제 폭 → 글자 크기 유지한 채 그래프만 확장 */
    if(Math.abs(t-TH)<=1&&Math.abs(w-TW)<=1)return;
    TH=t;TW=w;renderDetail();
  }
}
function showMeta(){
  if(!$("meta"))return; /* 시세 리그·시점 (데이터 중 가장 최근 수집 시각) */
  const it=items.filter(x=>x.stamp).sort((a,b)=>b.stamp<a.stamp?-1:1)[0];
  $("meta").textContent=it?tt("리그: ","League: ")+it.league+"\n"+tt("시세 기준: ","Prices as of: ")+new Date(it.stamp).toLocaleString(LANG==="en"?"en-US":"ko-KR",{dateStyle:"medium",timeStyle:"short"}):"";
}
function render(){document.querySelectorAll("#sort button").forEach(b=>b.classList.toggle("on",b.dataset.s===SORT));renderList();sizeList();fitList();renderDetail();fit();align()}
const refit=()=>{sizeList();fitList();fit();align();sizeFlt()};
addEventListener("resize",refit);if(document.fonts)document.fonts.ready.then(refit);
$("dbg").addEventListener("click",e=>{const on=document.body.classList.toggle("dbg");e.currentTarget.classList.toggle("on",on);e.currentTarget.setAttribute("aria-pressed",on)}); /* 디버그 테두리 토글 */
function setOff(off){ /* 최소 1개는 계산에 포함 */
  const it=items[sel];if(!it||off.length>=it.outcomes.length)return;
  items[sel]=analyze({...it,off});render();
}
function toggleOut(i){const it=items[sel];if(it)setOff(it.off.includes(i)?it.off.filter(x=>x!==i):it.off.concat(i))} /* 말단 노드 원 클릭 */
function toggleGroup(g){ /* 대분류 노드 원 클릭: 하위 전체 제외(하나라도 포함 중이면) / 전체 포함 */
  const it=items[sel];if(!it)return;
  const ids=it.outs.filter(o=>o.group===g).map(o=>o.i),rest=it.off.filter(i=>!ids.includes(i));
  setOff(ids.some(i=>!it.off.includes(i))?rest.concat(ids):rest);
}
$("detail").addEventListener("click",e=>{const n=e.target.closest(".nd"),gn=e.target.closest(".gd");if(n){toggleOut(+n.dataset.i);return}if(gn){toggleGroup(gn.dataset.g);return}const b=e.target.closest(".seg button");if(!b||b.dataset.m===MODE)return;MODE=b.dataset.m;renderDetail();fit();align()});
$("detail").addEventListener("input",e=>{if(e.target.id!=="flt")return;FILTER=+e.target.value;$("fltv").textContent=FILTER+"%";document.querySelectorAll(".tree [data-sh]").forEach(t=>t.style.display=+t.dataset.sh<FILTER/100?"none":"")}); /* 슬라이더: 재렌더 없이 표시만 갱신 */
$("sort").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.dataset.s===SORT)return;SORT=b.dataset.s;sortItems();render()});
$("list").addEventListener("click",e=>{const b=e.target.closest(".row");if(!b)return;sel=+b.dataset.i;render()});

window.addEventListener("sitebar:lang",e=>{LANG=e.detail==="en"?"en":"ko";applyStatic();sortItems();render()});
applyStatic();
const load=f=>new Promise(r=>{const s=document.createElement("script");s.src=encodeURI(f);s.onload=s.onerror=()=>r();document.head.appendChild(s)});
load("uniques/index.js").then(()=>Promise.all((window.UC_FILES||[]).map(f=>load("uniques/"+f)))).then(()=>{
  items=window.UC_DATA.map((d,i)=>analyze({...d,ord:i}));sortItems();
  render();
});
</script>
</body>
</html>
